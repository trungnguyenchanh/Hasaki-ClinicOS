<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hasaki Clinic · Nhận tua (NV)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
body{background:var(--bg-2)}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.06);display:flex;flex-direction:column}
.mhead{background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#fff;padding:18px 18px 16px;position:sticky;top:0;z-index:5}
.mhead .who{display:flex;align-items:center;gap:11px}
.mhead .av{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:15px;backdrop-filter:blur(4px)}
.mhead .nm{font-weight:600;font-size:16px}
.mhead .sub{font-size:12px;opacity:.85}
.mstatus{margin-left:auto;text-align:right}
.avail-toggle{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:30px;font-size:12px;font-weight:600;cursor:pointer;border:none;color:#fff}
.avail-toggle .d{width:9px;height:9px;border-radius:50%;background:#7ef0b8}
.avail-toggle.off .d{background:#f0c97e}
.mstat-row{display:flex;gap:9px;margin-top:14px}
.mstat{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 11px}
.mstat b{font-family:'Fraunces',serif;font-size:18px;display:block;line-height:1}
.mstat span{font-size:10.5px;opacity:.85}
.mbody{flex:1;padding:16px 16px 90px}
.sec-t{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px 11px}

/* tua được offer */
.offer{background:#fff;border:2px solid var(--teal);border-radius:18px;padding:0;overflow:hidden;box-shadow:0 8px 26px rgba(15,118,110,.16);margin-bottom:16px}
.offer.expired{border-color:var(--line);opacity:.6}
.offer-timer{background:var(--teal-soft);padding:9px 16px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--teal-deep)}
.offer-timer .bar{flex:1;height:5px;border-radius:3px;background:#cfe9e2;overflow:hidden}
.offer-timer .bar i{display:block;height:100%;background:var(--teal);width:62%;transition:width 1s linear}
.offer-body{padding:16px}
.offer-svc{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:3px}
.offer-meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
.anon{display:inline-flex;align-items:center;gap:6px;background:var(--bg-2);border:1px dashed var(--line);border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--ink-soft);margin-bottom:13px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}
.chip-skill{background:var(--teal-soft);color:var(--teal-deep)}
.chip-time{background:var(--indigo-soft);color:var(--indigo)}
.chip-mach{background:#ece9fb;color:#5a4bd0}
.offer-acts{display:flex;gap:10px}
.bm{flex:1;border:none;border-radius:13px;padding:14px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.bm-take{background:var(--teal-deep);color:#fff}
.bm-skip{background:var(--bg-2);color:var(--ink-soft);flex:0 0 38%}
.bm svg{width:18px;height:18px}

/* step-job: liệu trình nhiều bước, biết khi tới lượt */
.stepjob{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px}
.stepjob-h{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.stepjob-h b{font-size:14.5px}
.stepjob .code{font-size:11px;color:var(--ink-soft);font-family:Consolas,monospace}
.steps{margin-top:12px;display:flex;flex-direction:column;gap:0}
.stp-item{display:flex;gap:11px;position:relative;padding-bottom:14px}
.stp-item:last-child{padding-bottom:0}
.stp-item::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.stp-item:last-child::before{display:none}
.stp-dot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;z-index:1}
.stp-done .stp-dot{background:var(--teal);color:#fff}
.stp-now .stp-dot{background:var(--gold,#e0a13a);color:#fff;box-shadow:0 0 0 4px #fbeccb}
.stp-wait .stp-dot{background:var(--bg-2);color:var(--ink-soft);border:1px solid var(--line)}
.stp-mine .stp-info{background:var(--teal-soft);border-radius:11px;padding:9px 12px;margin:-6px 0}
.stp-info{flex:1}
.stp-info .sn{font-size:13.5px;font-weight:600}
.stp-info .sm{font-size:11.5px;color:var(--ink-soft)}
.stp-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px}
.stp-tag.you{background:var(--teal-deep);color:#fff}
.stp-tag.soon{background:#fbeccb;color:#9a6a1e}
.prep-alert{background:#fdf3e3;border:1px solid #f0d9a8;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#9a6a1e;display:flex;gap:9px;align-items:center;margin-bottom:14px}
.prep-alert svg{width:18px;height:18px;flex:none}
.prep-alert .cd{font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:#9a5a1e}

/* assigned list */
.job{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;display:flex;align-items:center;gap:12px}
.job .jt{flex:1}.job .jt b{font-size:13.5px}.job .jt span{font-size:11.5px;color:var(--ink-soft);display:block}
.job .jw{text-align:right;font-size:11px;color:var(--ink-soft)}
.job-state{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.js-now{background:#fbeccb;color:#9a6a1e}.js-next{background:var(--teal-soft);color:var(--teal-deep)}.js-done{background:var(--bg-2);color:var(--ink-soft)}

.empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:30px 16px}
.fair-note{background:var(--teal-soft);border-radius:12px;padding:12px 14px;font-size:11.5px;color:var(--teal-deep);line-height:1.6;margin-top:8px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-soft);cursor:pointer;font-family:inherit}
.tabbar button.on{color:var(--teal-deep);font-weight:600}
.tabbar svg{width:21px;height:21px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d2a28;color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
</style></head>
<body>
<div class="phone">
  <div class="mhead">
    <div class="who">
      <div class="av" id="myAv">HT</div>
      <div><div class="nm" id="myNm">Hồng Trang</div><div class="sub" id="mySub">KTV · Senior · ca 08–17</div></div>
      <div class="mstatus"><button class="avail-toggle" id="availBtn" onclick="toggleAvail()"><span class="d"></span><span id="availTxt">Sẵn sàng</span></button></div>
    </div>
    <div class="mstat-row">
      <div class="mstat"><b id="stTua">1</b><span>Tua hôm nay</span></div>
      <div class="mstat"><b id="stCong">1,2tr</b><span>Công hôm nay</span></div>
      <div class="mstat"><b id="stPrio">#2</b><span>Lượt ưu tiên</span></div>
    </div>
  </div>
  <div class="mbody" id="mbody"></div>
</div>
<div class="tabbar">
  <button class="on" id="tab-offer" onclick="showTab('offer')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>Tua mời</button>
  <button id="tab-mine" onclick="showTab('mine')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Tua của tôi</button>
  <button id="tab-fair" onclick="showTab('fair')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 8l7-5 7 5M5 8v8l7 4 7-4V8"/></svg>Công bằng</button>
</div>
<div class="toast" id="toast"></div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script>
const fmtMin = m => m>=60 ? `${Math.floor(m/60)}h${m%60?(' '+(m%60)+'p'):''}` : `${m}p`;
// NV đang đăng nhập (mock)
const ME = { nm:'Hồng Trang', init:'HT', sub:'KTV · Senior · ca 08–17', skills:['RF','Body','Laser'], senior:true };
let avail = true;
let tab = 'offer';

// ===== Tua được OFFER cho riêng NV (ẩn danh tính & giá trị khách — ý 3) =====
// Hệ đã lọc đủ skill trước khi offer. NV chỉ Nhận / Bỏ qua.
let offers = [
  { id:'OF-1', svc:'Giảm béo RF bụng · 1 buổi', group:'Giảm béo', skill:'RF · Senior', machine:'RF Slim', mins:45, start:'10:05', countdown:38, anon:'Khách #A · ẩn danh' },
];
// ===== Liệu trình tổ hợp nhiều step — NV biết khi tới lượt (ý 2) =====
let stepJob = {
  code:'DV-0825', anon:'Khách #B · ẩn danh', total:'2h05',
  steps:[
    { n:'Khám da liễu', who:'BS', skill:'Bác sĩ', mins:20, state:'done', at:'09:40' },
    { n:'Giảm béo RF bụng', who:'Bạn', skill:'RF·Senior', mins:45, state:'now', at:'10:05', mine:true },
    { n:'Triệt lông Diode', who:'KTV khác', skill:'Laser·Mid', mins:30, state:'wait', at:'10:55' },
    { n:'Chăm sóc da phục hồi', who:'ĐD', skill:'Skincare·Mid', mins:40, state:'wait', at:'11:30' },
  ]
};
// tua đã nhận
let myJobs = [
  { svc:'Triệt lông Diode 2 vùng', code:'DV-0830', at:'09:15', state:'done' },
];

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function toggleAvail(){
  avail=!avail;
  document.getElementById('availBtn').classList.toggle('off',!avail);
  document.getElementById('availTxt').textContent = avail?'Sẵn sàng':'Tạm nghỉ';
  toast(avail?'Đã bật Sẵn sàng — hệ sẽ mời tua phù hợp':'Đã tạm nghỉ — không nhận tua mới');
  render();
}

function offerCard(o){
  return `<div class="offer" id="${o.id}">
    <div class="offer-timer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Tự chuyển người khác sau <b style="margin:0 2px">${o.countdown}s</b> nếu chưa nhận
      <span class="bar"><i style="width:${Math.round(o.countdown/60*100)}%"></i></span></div>
    <div class="offer-body">
      <div class="offer-svc">${o.svc}</div>
      <div class="offer-meta">Bắt đầu lúc ${o.start} · dự kiến ${fmtMin(o.mins)}</div>
      <div class="anon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>${o.anon} — danh tính & giá trị khách được ẩn để đảm bảo công bằng</div>
      <div class="chip-row"><span class="chip chip-skill">cần ${o.skill}</span><span class="chip chip-time">${o.start}</span>${o.machine?`<span class="chip chip-mach">⚙ ${o.machine}</span>`:''}</div>
      <div class="offer-acts">
        <button class="bm bm-skip" onclick="skipOffer('${o.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>Bỏ qua</button>
        <button class="bm bm-take" onclick="takeOffer('${o.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Nhận tua</button>
      </div>
    </div>
  </div>`;
}
function takeOffer(id){
  const o=offers.find(x=>x.id===id); if(!o)return;
  myJobs.unshift({svc:o.svc,code:'DV-mới',at:o.start,state:'next'});
  offers=offers.filter(x=>x.id!==id);
  toast('✓ Đã nhận tua — chuẩn bị bắt đầu lúc '+o.start);
  render();
}
function skipOffer(id){
  offers=offers.filter(x=>x.id!==id);
  toast('Đã bỏ qua — hệ chuyển người kế · lượt ưu tiên của bạn bị lùi');
  document.getElementById('stPrio').textContent='#5';
  render();
}

function renderOffer(){
  const b=document.getElementById('mbody');
  if(!avail){ b.innerHTML=`<div class="empty">Bạn đang <b>Tạm nghỉ</b>.<br>Bật "Sẵn sàng" để hệ thống mời tua phù hợp với kỹ năng của bạn.</div>`; return; }
  let html='';
  // alert chuẩn bị cho step sắp tới của mình
  const myNow = stepJob.steps.find(s=>s.mine && s.state==='now');
  if(myNow){
    html += `<div class="prep-alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div>Sắp tới lượt bạn ở liệu trình <b>${stepJob.code}</b> — step <b>${myNow.n}</b> lúc <b>${myNow.at}</b>. <span class="cd">Chuẩn bị phòng/máy ngay.</span></div></div>`;
  }
  html += `<div class="sec-t">Tua hệ thống mời cho bạn</div>`;
  html += offers.length ? offers.map(offerCard).join('') : `<div class="empty">Chưa có tua mới được mời.<br>Hệ thống sẽ tự đẩy tua phù hợp khi có khách.</div>`;
  // liệu trình step mình tham gia
  html += `<div class="sec-t" style="margin-top:18px">Liệu trình bạn đang tham gia</div>`;
  html += stepJobCard(stepJob);
  b.innerHTML=html;
}
function stepJobCard(j){
  return `<div class="stepjob">
    <div class="stepjob-h"><b>Liệu trình tổ hợp</b> <span class="code">${j.code}</span><span style="margin-left:auto;font-size:11.5px;color:var(--ink-soft)">tổng ~${j.total}</span></div>
    <div style="font-size:11.5px;color:var(--ink-soft)">${j.anon} · nhiều NV phối hợp — bạn xem để canh giờ</div>
    <div class="steps">
      ${j.steps.map(s=>{
        const cls = s.state==='done'?'stp-done':s.state==='now'?'stp-now':'stp-wait';
        const tag = s.mine ? '<span class="stp-tag you">VIỆC CỦA BẠN</span>' : (s.state==='now'?'<span class="stp-tag soon">đang làm</span>':'');
        return `<div class="stp-item ${cls} ${s.mine?'stp-mine':''}">
          <div class="stp-dot">${s.state==='done'?'✓':(s.state==='now'?'▶':'·')}</div>
          <div class="stp-info"><div class="sn">${s.n}${tag}</div><div class="sm">${s.who} · ${s.skill} · ${s.mins}p · ~${s.at}</div></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function renderMine(){
  const b=document.getElementById('mbody');
  b.innerHTML = `<div class="sec-t">Tua của tôi hôm nay</div>` + (myJobs.length ? myJobs.map(j=>{
    const st = j.state==='now'?['js-now','Đang làm']:j.state==='next'?['js-next','Sắp làm']:['js-done','Hoàn tất'];
    return `<div class="job"><div class="q-av av-teal" style="width:36px;height:36px">${j.code.slice(-2)}</div>
      <div class="jt"><b>${j.svc}</b><span>${j.code} · ~${j.at}</span></div>
      <div class="jw"><span class="job-state ${st[0]}">${st[1]}</span></div></div>`;
  }).join('') : `<div class="empty">Chưa có tua nào hôm nay.</div>`);
}
function renderFair(){
  const b=document.getElementById('mbody');
  b.innerHTML = `<div class="sec-t">Cơ chế đảm bảo công bằng</div>
    <div class="stepjob">
      <div style="font-size:13px;line-height:1.85">
      • <b>Hệ thống tự gán</b> theo điểm — bạn <b>chỉ nhận</b>, không bốc chọn khách.<br>
      • <b>Ẩn danh tính & giá trị khách</b> trước khi nhận — không ai "để dành" khách sộp.<br>
      • <b>Lượt ưu tiên xoay vòng</b>: ai ít tua/công thấp được mời trước.<br>
      • Bỏ qua / nhận chậm → <b>lùi lượt ưu tiên</b>.<br>
      • Mọi can thiệp tay của quản lý đều <b>ghi nhật ký</b> và bị đếm.</div>
    </div>
    <div class="sec-t" style="margin-top:16px">Chỉ số công bằng của bạn hôm nay</div>
    <div class="mstat-row" style="margin-top:0">
      <div class="mstat" style="background:var(--teal-soft);color:var(--teal-deep)"><b>1</b><span>Tua đã nhận</span></div>
      <div class="mstat" style="background:var(--teal-soft);color:var(--teal-deep)"><b>0</b><span>Lần bỏ qua</span></div>
      <div class="mstat" style="background:var(--teal-soft);color:var(--teal-deep)"><b>#2</b><span>Hạng ưu tiên</span></div>
    </div>
    <div class="fair-note">Bạn đang được ưu tiên cao (#2) vì tải tua thấp & công ca dưới trung bình nhóm. Hệ sẽ mời bạn các tua phù hợp kỹ năng sớm hơn.</div>`;
}
function showTab(t){
  tab=t;
  ['offer','mine','fair'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('on',x===t));
  render();
}
function render(){
  if(tab==='offer') renderOffer();
  else if(tab==='mine') renderMine();
  else renderFair();
}
render();
</script>
</body></html>
