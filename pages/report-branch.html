<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Tổng quan chi nhánh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ops-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.ops-card .oc-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ops-card .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.ops-card .oc-ic svg{width:17px;height:17px}
.ops-card .oc-t{font-weight:600;font-size:14px}
.ops-card .oc-big{font-family:'Fraunces',serif;font-size:32px;line-height:1;margin:2px 0}
.ops-card .oc-sub{font-size:11.5px;color:var(--ink-soft)}
.ops-card .oc-rows{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ops-card .ocr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ops-card .ocr b{font-family:'Fraunces',serif}
.ops-card .oc-link{margin-top:11px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ops-card.warn{border-color:#f0c9a8;background:linear-gradient(140deg,#fff,#fdeee3)}
.load-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.load-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}.load-bar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--teal-soft);color:var(--teal-deep)}.badge.busy{background:#fbeccb;color:#9a6a1e}.badge.over{background:#f4d3cb;color:#9a3b2c}
.subtab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.subtab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.subtab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.kpi-bar{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;min-width:90px}.kpi-bar i{display:block;height:100%;background:var(--teal)}
.num-strong{font-family:'Fraunces',serif;font-weight:600}
.role-chip{font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--bg-2);font-weight:500}
.kpi-big{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi-big .kb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi-big .kb .kv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.kpi-big .kb .kl{font-size:11.5px;color:var(--ink-soft)}
.kpi-big .kb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.kpi-big .kb.warn .kv{color:#9a5a1e}
.kpi-big .kb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.kpi-big .kb.good .kv{color:var(--teal-deep)}
.region-block{margin-bottom:22px}
.region-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.region-head .rg-ic{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.region-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0}
.region-head .rg-sum{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ov-table td{padding:10px;border-bottom:1px solid var(--line)}
.ov-table tr.clickable{cursor:pointer;transition:.12s}.ov-table tr.clickable:hover td{background:var(--teal-soft)}
.ov-cn{font-weight:600}.ov-cn small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut-c{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut-c b{font-family:'Fraunces',serif;font-size:17px;display:block}.donut-c span{font-size:10px;color:var(--ink-soft)}
.leg-list{display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.leg-row .dot{width:11px;height:11px;border-radius:3px;flex:none}.leg-row b{margin-left:auto;font-family:'Fraunces',serif}
@media(max-width:900px){.snap,.ops-grid,.kpi-big{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('reports');
const CN = {
  q1:{ region:'TP. Hồ Chí Minh', name:'CN Quận 1',
    ops:{ waiting:3, serving:5, over:1, nv:6, avail:3, load:78, booking:38, noshow:2, consult:3 },
    sales:{ today:'92tr', month:'3,2 tỷ', growth:'+14%', pkgRatio:61, avgOrder:'3,1tr', sessions:1840, svc:[['Triệt lông',1180,'1,3 tỷ'],['Chăm sóc da',420,'760tr'],['Giảm béo',180,'620tr'],['Derma & Hair',60,'520tr']] },
    kpi:{ done:6, total:6, prod:93, retain:62, npc:'4.8', vio:0, rows:[['Bác sĩ','Chỉ định chốt','73%','65%',90],['KTV','Năng suất/giờ','94%','85%',94],['Tư vấn viên','Tỷ lệ chốt · vi phạm','72% · 0','60% · 0',95],['Điều dưỡng','Tuân thủ quy trình','98%','95%',98]] } },
  q7:{ region:'TP. Hồ Chí Minh', name:'CN Quận 7',
    ops:{ waiting:5, serving:4, over:2, nv:4, avail:1, load:92, booking:31, noshow:3, consult:4 },
    sales:{ today:'81tr', month:'2,9 tỷ', growth:'+12%', pkgRatio:60, avgOrder:'2,9tr', sessions:1610, svc:[['Triệt lông',980,'1,1 tỷ'],['Chăm sóc da',390,'690tr'],['Giảm béo',160,'560tr'],['Derma & Hair',80,'550tr']] },
    kpi:{ done:5, total:6, prod:90, retain:56, npc:'4.6', vio:1, rows:[['Bác sĩ','Chỉ định chốt','68%','65%',86],['KTV','Năng suất/giờ','89%','85%',89],['Tư vấn viên','Tỷ lệ chốt · vi phạm','66% · 1','60% · 0',82],['Điều dưỡng','Tuân thủ quy trình','96%','95%',96]] } },
  td:{ region:'TP. Hồ Chí Minh', name:'CN Thủ Đức',
    ops:{ waiting:1, serving:2, over:0, nv:3, avail:2, load:41, booking:18, noshow:1, consult:1 },
    sales:{ today:'52tr', month:'1,7 tỷ', growth:'+9%', pkgRatio:58, avgOrder:'2,5tr', sessions:980, svc:[['Triệt lông',520,'620tr'],['Chăm sóc da',240,'430tr'],['Giảm béo',110,'380tr'],['Derma & Hair',110,'270tr']] },
    kpi:{ done:5, total:6, prod:88, retain:53, npc:'4.7', vio:0, rows:[['Bác sĩ','Chỉ định chốt','69%','65%',87],['KTV','Năng suất/giờ','88%','85%',88],['Tư vấn viên','Tỷ lệ chốt · vi phạm','63% · 0','60% · 0',86],['Điều dưỡng','Tuân thủ quy trình','97%','95%',97]] } },
  cg:{ region:'Hà Nội', name:'CN Cầu Giấy',
    ops:{ waiting:2, serving:2, over:0, nv:3, avail:2, load:55, booking:24, noshow:1, consult:2 },
    sales:{ today:'63tr', month:'2,0 tỷ', growth:'+8%', pkgRatio:61, avgOrder:'2,7tr', sessions:1120, svc:[['Triệt lông',640,'720tr'],['Chăm sóc da',280,'480tr'],['Giảm béo',120,'430tr'],['Derma & Hair',80,'370tr']] },
    kpi:{ done:5, total:6, prod:90, retain:55, npc:'4.7', vio:0, rows:[['Bác sĩ','Chỉ định chốt','70%','65%',88],['KTV','Năng suất/giờ','90%','85%',90],['Tư vấn viên','Tỷ lệ chốt · vi phạm','64% · 0','60% · 0',88],['Điều dưỡng','Tuân thủ quy trình','97%','95%',97]] } },
  hbt:{ region:'Hà Nội', name:'CN Hai Bà Trưng',
    ops:{ waiting:1, serving:1, over:0, nv:2, avail:1, load:48, booking:14, noshow:0, consult:1 },
    sales:{ today:'41tr', month:'1,4 tỷ', growth:'+7%', pkgRatio:59, avgOrder:'2,5tr', sessions:790, svc:[['Triệt lông',420,'480tr'],['Chăm sóc da',190,'320tr'],['Giảm béo',100,'310tr'],['Derma & Hair',80,'290tr']] },
    kpi:{ done:5, total:6, prod:89, retain:54, npc:'4.6', vio:0, rows:[['Bác sĩ','Chỉ định chốt','68%','65%',86],['KTV','Năng suất/giờ','89%','85%',89],['Tư vấn viên','Tỷ lệ chốt · vi phạm','62% · 0','60% · 0',85],['Điều dưỡng','Tuân thủ quy trình','96%','95%',96]] } },
  hc:{ region:'Đà Nẵng', name:'CN Hải Châu',
    ops:{ waiting:2, serving:2, over:0, nv:3, avail:1, load:63, booking:19, noshow:1, consult:1 },
    sales:{ today:'45tr', month:'1,4 tỷ', growth:'+6%', pkgRatio:57, avgOrder:'2,4tr', sessions:760, svc:[['Triệt lông',390,'450tr'],['Chăm sóc da',180,'300tr'],['Giảm béo',100,'350tr'],['Derma & Hair',90,'300tr']] },
    kpi:{ done:4, total:6, prod:87, retain:51, npc:'4.5', vio:0, rows:[['Bác sĩ','Chỉ định chốt','66%','65%',84],['KTV','Năng suất/giờ','87%','85%',87],['Tư vấn viên','Tỷ lệ chốt · vi phạm','61% · 0','60% · 0',84],['Điều dưỡng','Tuân thủ quy trình','94%','95%',94]] } },
};
const cnId=(typeof getParam==='function')?getParam('cn'):null;
const d=cnId?CN[cnId]:null;
if(!d){
  document.getElementById('main').innerHTML = topbar('Quản trị','Tổng quan chi nhánh',{who:'QL',branch:'—',right:''}) +
    `<div class="row"><div class="panel" style="text-align:center;padding:40px"><div style="color:var(--ink-soft);margin-bottom:14px">Không tìm thấy chi nhánh (thiếu/sai mã <code>?cn=</code>).</div><a class="btn btn-teal" href="report-ops.html">← Về report vận hành</a></div></div>`;
} else {
  const back=`<a class="btn btn-ghost" href="report-ops.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Report vận hành tổng</a>`;
  document.getElementById('main').innerHTML = topbar('Quản trị',`Tổng quan chi nhánh · ${d.name}`,{who:'QL',branch:d.region,right:back}) + `
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px">Góc nhìn quản lý chi nhánh — nắm toàn bộ tình hình ${d.name}: vận hành, kinh doanh, hiệu suất.</div>
    <div class="subtab" id="st"><button class="on" onclick="sub('ops')">Vận hành</button><button onclick="sub('sales')">Sales</button><button onclick="sub('kpi')">KPI</button></div>
    <div id="bv"></div>`;
  const BV=document.getElementById('bv'); const o=d.ops, s=d.sales, k=d.kpi;
  const VIEWS={
    ops:`<div class="snap" style="grid-template-columns:repeat(5,1fr)">
        <div class="sb"><div class="sl">Khách chờ</div><div class="sv">${o.waiting}</div><div class="sl">đang phục vụ ${o.serving}</div></div>
        <div class="sb ${o.over?'warn':'good'}"><div class="sl">Quá giờ chờ</div><div class="sv">${o.over}</div><div class="sl">cần ưu tiên</div></div>
        <div class="sb"><div class="sl">NV sẵn sàng</div><div class="sv">${o.avail}<span style="font-size:15px;color:var(--ink-soft)">/${o.nv}</span></div><div class="sl">trong ca</div></div>
        <div class="sb ${o.load>=90?'warn':(o.load>=70?'':'good')}"><div class="sl">Tải tua</div><div class="sv">${o.load}%</div><div class="sl">công suất</div></div>
        <div class="sb"><div class="sl">Booking hôm nay</div><div class="sv">${o.booking}</div><div class="sl">no-show ${o.noshow}</div></div>
      </div>
      <div class="ops-grid">
        <div class="ops-card"><div class="oc-h"><div class="oc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 0"/></svg></div><div class="oc-t">Điều phối nhân viên</div></div><div class="oc-big">${o.waiting}</div><div class="oc-sub">khách chờ phân tua</div><a class="oc-link" href="dispatch-branch.html?cn=${cnId}">Xem tình hình CN →</a></div>
        <div class="ops-card"><div class="oc-h"><div class="oc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="oc-t">Tư vấn</div></div><div class="oc-big">${o.consult}</div><div class="oc-sub">khách đang tư vấn</div><a class="oc-link" href="consultant-cn.html">Mở điều phối tư vấn →</a></div>
        <div class="ops-card"><div class="oc-h"><div class="oc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><div class="oc-t">Bàn điều phối</div></div><div class="oc-big">${o.serving}</div><div class="oc-sub">đang phục vụ</div><a class="oc-link" href="dispatch.html">Mở bàn điều phối →</a></div>
      </div>`,
    sales:`<div class="snap">
        <div class="sb good"><div class="sl">Doanh thu tháng</div><div class="sv">${s.month}</div><div class="sl">${s.growth} so tháng trước</div></div>
        <div class="sb"><div class="sl">Hôm nay</div><div class="sv">${s.today}</div><div class="sl">đơn TB ${s.avgOrder}</div></div>
        <div class="sb"><div class="sl">Tỷ trọng gói</div><div class="sv">${s.pkgRatio}%</div><div class="sl">gói / lẻ</div></div>
        <div class="sb"><div class="sl">Buổi DV/tháng</div><div class="sv">${s.sessions}</div><div class="sl">buổi</div></div>
      </div>
      <div class="panel"><div class="panel-h"><div class="panel-title">Doanh thu theo dịch vụ<small>${d.name} · tháng này</small></div></div>
        <table><thead><tr><th>Dịch vụ</th><th>Số buổi</th><th>Doanh thu</th></tr></thead><tbody>
          ${s.svc.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="num-strong">${r[2]}</td></tr>`).join('')}
        </tbody></table></div>`,
    kpi:`<div class="snap">
        <div class="sb ${k.done===k.total?'good':''}"><div class="sl">Nhóm đạt mục tiêu</div><div class="sv">${k.done}/${k.total}</div><div class="sl">nghiệp vụ</div></div>
        <div class="sb"><div class="sl">Năng suất TB</div><div class="sv">${k.prod}%</div><div class="sl">toàn CN</div></div>
        <div class="sb ${k.vio?'warn':'good'}"><div class="sl">Vi phạm giành khách</div><div class="sv">${k.vio}</div><div class="sl">mục tiêu 0</div></div>
        <div class="sb"><div class="sl">NPS khách</div><div class="sv">${k.npc}★</div><div class="sl">giữ khách ${k.retain}%</div></div>
      </div>
      <div class="panel"><div class="panel-h"><div class="panel-title">KPI nhóm nghiệp vụ tại ${d.name}<small>so mục tiêu</small></div></div>
        <table><thead><tr><th>Nhóm</th><th>Chỉ số</th><th>Kết quả</th><th>Mục tiêu</th><th>Đạt</th></tr></thead><tbody>
          ${k.rows.map(r=>`<tr><td><span class="role-chip">${r[0]}</span></td><td>${r[1]}</td><td class="num-strong">${r[2]}</td><td>${r[3]}</td><td><div class="kpi-bar"><i style="width:${r[4]}%"></i></div></td></tr>`).join('')}
        </tbody></table></div>`,
  };
  function sub(t){document.querySelectorAll('#st button').forEach(b=>b.classList.remove('on'));const idx={ops:0,sales:1,kpi:2}[t];document.querySelectorAll('#st button')[idx].classList.add('on');BV.innerHTML=VIEWS[t];}
  window.sub=sub; sub('ops');
}
</script>
</body></html>
