<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Theo dõi phác đồ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.proto-track{position:relative;padding:18px 0 6px}
.ptline{display:flex;justify-content:space-between;position:relative;margin:0 16px}
.ptline::before{content:"";position:absolute;top:13px;left:0;right:0;height:3px;background:var(--line);z-index:0}
.ptstep{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;flex:1;text-align:center}
.ptdot{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-soft)}
.ptstep.done .ptdot{background:var(--teal);border-color:var(--teal);color:#fff}
.ptstep.current .ptdot{border-color:var(--teal-deep);color:var(--teal-deep);box-shadow:0 0 0 4px var(--teal-soft)}
.ptstep.late .ptdot{border-color:var(--rose);color:var(--rose);box-shadow:0 0 0 4px #f9e6e6}
.ptstep .ptl{font-size:11.5px;margin-top:8px;max-width:110px}
.ptstep .ptl b{display:block;font-size:12px}.ptstep .ptl span{color:var(--ink-soft)}
.bigprog{height:10px;border-radius:8px;background:var(--bg);overflow:hidden;margin:10px 0 4px}
.bigprog i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--teal-deep))}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
