<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Catalog Step</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.step-flow{display:flex;flex-direction:column;gap:0}
.sf{display:flex;gap:14px;align-items:flex-start}
.sf .sfn{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.sf .sfl{width:2px;flex:1;background:var(--line);margin:4px 0;min-height:18px}
.sf-col{display:flex;flex-direction:column;align-items:center}
.sf:last-child .sfl{display:none}
.sf-body{flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:14px}
.sf-body b{font-size:14px}
.sf-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('catalog-step');
const right=`<button class="btn btn-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Thêm bước</button>`;
document.getElementById('main').innerHTML = topbar('Danh mục','Catalog — Bước liệu trình (Step)',{who:'AD',branch:'Tất cả CN',right}) + `
  <div class="row r-2">
    <div class="panel"><div class="panel-h"><div class="panel-title">Quy trình bước — Giảm béo RF bụng<small>Mỗi bước gắn skill · thiết bị · định biên NVL · thời lượng</small></div><div class="pill-tabs"><button class="on">RF bụng</button><button>Triệt lông</button><button>HIFU</button></div></div>
      <div class="step-flow">
        <div class="sf"><div class="sf-col"><div class="sfn">1</div><div class="sfl"></div></div><div class="sf-body"><b>Tư vấn & đo chỉ số</b><div style="font-size:12.5px;color:var(--ink-soft)">10 phút · không dùng máy</div><div class="sf-tags"><span class="role-chip">Skincare</span></div></div></div>
        <div class="sf"><div class="sf-col"><div class="sfn">2</div><div class="sfl"></div></div><div class="sf-body"><b>Làm sạch & chuẩn bị da</b><div style="font-size:12.5px;color:var(--ink-soft)">10 phút</div><div class="sf-tags"><span class="role-chip">Skincare</span> <span class="tag done">Gel làm sạch</span></div></div></div>
        <div class="sf"><div class="sf-col"><div class="sfn">3</div><div class="sfl"></div></div><div class="sf-body"><b>Trị liệu RF vùng bụng</b><div style="font-size:12.5px;color:var(--ink-soft)">25 phút</div><div class="sf-tags"><span class="role-chip">RF · Senior</span> <span class="tag vip">Máy RF</span> <span class="tag done">Gel dẫn 45ml</span> <span class="tag done">Tinh chất 1 ống</span></div></div></div>
        <div class="sf"><div class="sf-col"><div class="sfn">4</div></div><div class="sf-body"><b>Làm dịu & kết thúc</b><div style="font-size:12.5px;color:var(--ink-soft)">10 phút</div><div class="sf-tags"><span class="role-chip">Skincare</span> <span class="tag done">Mặt nạ làm dịu</span></div></div></div>
      </div>
    </div>
    <div class="panel"><div class="panel-h"><div class="panel-title">Định biên NVL toàn liệu trình<small>Tổng hợp theo bước</small></div></div>
      <div class="cart-row"><div class="ci"><b>Gel làm sạch</b><span>Bước 2</span></div><div class="cp">20 ml</div></div>
      <div class="cart-row"><div class="ci"><b>Gel dẫn RF</b><span>Bước 3</span></div><div class="cp">45 ml</div></div>
      <div class="cart-row"><div class="ci"><b>Tinh chất tan mỡ</b><span>Bước 3</span></div><div class="cp">1 ống</div></div>
      <div class="cart-row"><div class="ci"><b>Mặt nạ làm dịu</b><span>Bước 4</span></div><div class="cp">1 cái</div></div>
      <div class="sumline total"><span>Tổng thời lượng</span><span>55 phút</span></div>
      <div class="alert al-info" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Bước có gắn <b>máy cao cấp + skill cấp cao</b> là điểm điều phối quan trọng & ảnh hưởng chi phí.</div></div>
    </div>
  </div>
  <div class="panel"><div class="panel-h"><div class="panel-title">Thư viện bước dùng chung<small>Tái sử dụng giữa các liệu trình</small></div></div>
    <table><thead><tr><th>Bước</th><th>Skill</th><th>Thiết bị</th><th>NVL định biên</th><th>Thời lượng</th></tr></thead><tbody>
      <tr class="clickable"><td><b>Làm sạch & chuẩn bị da</b></td><td>Skincare</td><td>—</td><td>Gel làm sạch 20ml</td><td>10 phút</td></tr>
      <tr class="clickable"><td><b>Trị liệu RF</b></td><td>RF · Senior</td><td>Máy RF</td><td>Gel dẫn + tinh chất</td><td>25 phút</td></tr>
      <tr class="clickable"><td><b>Bắn laser triệt lông</b></td><td>LASER · Senior</td><td>Laser Diode XL</td><td>Gel lạnh 30ml</td><td>20 phút</td></tr>
      <tr class="clickable"><td><b>Nâng cơ HIFU</b></td><td>HIFU · Expert</td><td>Máy HIFU</td><td>Gel siêu âm</td><td>40 phút</td></tr>
      <tr class="clickable"><td><b>Làm dịu & kết thúc</b></td><td>Skincare</td><td>—</td><td>Mặt nạ làm dịu</td><td>10 phút</td></tr>
    </tbody></table>
  </div>`;
wireUI();
</script>
</body></html>
