<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.heat{display:grid;grid-template-columns:70px repeat(8,1fr);gap:4px}
.heat>div{border-radius:8px;padding:7px 4px;font-size:11px;text-align:center;min-height:42px;display:flex;flex-direction:column;justify-content:center}
.heat .hh{background:transparent;color:var(--ink-soft);font-weight:600;font-size:11px}
.heat .hr-label{background:var(--bg-2);font-family:'Fraunces',serif;font-weight:600;color:var(--teal-deep);justify-content:center}
.cell{cursor:pointer;transition:.14s;font-weight:600;border:1px solid transparent}
.cell:hover{transform:scale(1.05);box-shadow:var(--shadow)}
.c-free{background:var(--teal-soft);color:var(--teal-deep)}
.c-mid{background:#f7eed3;color:#9a7b1e}
.c-full{background:#f9e6e6;color:#a64b4b}
.c-over{background:#a64b4b;color:#fff}
.cell small{font-weight:400;font-size:9.5px;opacity:.8}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin-top:14px;flex-wrap:wrap}
.legend2 i{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:middle}
.mc{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.mc:last-child{border:none}
.mc .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.util{height:7px;border-radius:6px;background:var(--bg);overflow:hidden;width:100%;margin-top:5px}
.util i{display:block;height:100%;border-radius:6px}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('booking');
const right=`<button class="btn btn-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Đặt lịch mới</button>`;
document.getElementById('main').innerHTML = topbar('Lịch & Booking','Theo dõi khung giờ & tải vận hành',{who:'BK',branch:'CN Quận 1',right}) + `
  <div class="cn-tabs">
    <a class="cn-link on" href="booking.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Dashboard (calendar CN)</a>
    <a class="cn-link" href="booking-list.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Danh sách booking</a>
    <a class="cn-link" href="booking-detail.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Chi tiết booking</a>
  </div>
  <div class="kpi-grid">
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div></div><div class="kpi-val">42</div><div class="kpi-lbl">Lịch hẹn hôm nay</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div></div><div class="kpi-val">11</div><div class="kpi-lbl">Khung giờ còn trống</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div></div><div class="kpi-val">2</div><div class="kpi-lbl">Khung giờ quá tải</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-indigo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg></div></div><div class="kpi-val">78%</div><div class="kpi-lbl">Hiệu suất máy cao cấp</div></div>
  </div>

  <div class="row r-2" style="margin-bottom:22px">
    <div class="panel"><div class="panel-h"><div class="panel-title">Form đặt lịch chi tiết<small>Liên kết hồ sơ khách · kiểm tra nhân sự, máy, phòng</small></div></div>
      <div class="field"><label>Khách hàng</label>
        <div style="display:flex;gap:8px"><input value="Trần Thu Hà · C-1042" style="flex:1" readonly><a class="btn btn-ghost" href="customer-detail.html" style="padding:9px 13px">Hồ sơ</a></div>
        <div style="font-size:11.5px;color:var(--rose);margin-top:5px">⚠ Dị ứng Lidocaine · không thích KTV nam · đã có gói triệt lông</div>
      </div>
      <div class="field"><label>Dịch vụ</label><select><option>Giảm béo RF bụng (máy RF · cần KTV RF Senior)</option><option>Triệt lông Diode (máy Laser Diode XL)</option><option>Chăm sóc da phục hồi</option></select></div>
      <div class="row r-2e" style="margin:0 0 14px"><div class="field" style="margin:0"><label>Ngày</label><input type="text" value="03/06/2026"></div><div class="field" style="margin:0"><label>Khung giờ (còn trống)</label><select><option>11:00 ✓ trống</option><option>15:00 ✓ trống</option><option>10:00 ⚠ quá tải</option></select></div></div>
      <div class="row r-2e" style="margin:0 0 14px"><div class="field" style="margin:0"><label>Phòng / Máy</label><select><option>Slim 1 · Máy RF (trống)</option><option>Laser 2 · Laser Diode XL</option></select></div><div class="field" style="margin:0"><label>KTV / ĐD</label><select><option>Hồng Trang (RF Senior · rảnh)</option><option>Thanh Mai (LASER)</option></select></div></div>
      <div class="field"><label>Ghi chú đặt lịch</label><input placeholder="VD: khách muốn phòng yên tĩnh, đến sớm 10 phút…"></div>
      <div style="display:flex;gap:9px"><button class="btn btn-teal" style="flex:1;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg>Xác nhận đặt lịch</button><button class="btn btn-ghost">Lưu nháp</button></div>
    </div>
    <div class="panel"><div class="panel-h"><div class="panel-title">Lịch hẹn sắp tới<small>Bấm tên khách để xem hành trình · "Tiếp nhận" để vào quy trình</small></div><a class="btn btn-ghost" href="reception.html" style="padding:6px 12px;font-size:12px">Tiếp nhận khách</a></div>
      <div class="q-item"><div class="q-time">11:00</div><div class="q-av av-teal" style="cursor:pointer" onclick="location.href='customer-detail.html'">NK</div><div class="q-main" style="cursor:pointer" onclick="location.href='flow-tracking.html'"><b>Ngô Khánh · Triệt lông</b><span>Laser 2 · KTV Thanh Mai</span></div><a class="btn btn-teal" href="reception.html" style="padding:5px 11px;font-size:11.5px">Tiếp nhận</a></div>
      <div class="q-item"><div class="q-time">13:30</div><div class="q-av av-blush" style="cursor:pointer" onclick="location.href='customer-detail.html'">TM</div><div class="q-main" style="cursor:pointer" onclick="location.href='flow-tracking.html'"><b>Trần My · Giảm béo</b><span>Slim 1 · KTV Hồng Trang</span></div><span class="tag prog">Chờ check-in</span></div>
      <div class="q-item"><div class="q-time">15:00</div><div class="q-av av-gold" style="cursor:pointer" onclick="location.href='customer-detail.html'">LV</div><div class="q-main" style="cursor:pointer" onclick="location.href='flow-tracking.html'"><b>Lê Vy · Nhuộm dưỡng tóc</b><span>Salon · NV Mỹ Tâm</span></div><span class="tag done">Đã xác nhận</span></div>
      <div class="alert al-info" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Form kiểm tra <b>khung giờ trống · nhân sự rảnh · máy sẵn sàng</b> trước khi xác nhận, tránh quá tải.</div></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:22px"><div class="panel-h"><div class="panel-title">Bản đồ nhiệt khung giờ · so với năng lực nhân sự<small>Số khách đặt / số nhân sự rảnh từng khung — đỏ = quá tải</small></div><div class="pill-tabs"><button class="on">Hôm nay</button><button>Ngày mai</button></div></div>
    <div class="heat" id="heat"></div>
    <div class="legend2"><span><i style="background:var(--teal-soft)"></i>Còn trống</span><span><i style="background:#f7eed3"></i>Gần đầy</span><span><i style="background:#f9e6e6"></i>Đầy</span><span><i style="background:#a64b4b"></i>Quá tải (khách > nhân sự)</span></div>
  </div>

  <div class="row r-2">
    <div class="panel"><div class="panel-h"><div class="panel-title">Nhân sự đang trống theo khung giờ<small>Lấy lịch ca từ HR · đề xuất nhận thêm khách</small></div></div>
      <table><thead><tr><th>Nhân sự</th><th>Vai trò · skill</th><th>Khung trống</th><th>Tải</th></tr></thead><tbody>
        <tr><td><div class="staff-cell"><div class="q-av av-teal">TM</div><b>Thanh Mai</b></div></td><td>KTV · LASER</td><td><span class="tag done">10:00</span> <span class="tag done">14:00</span></td><td style="width:120px"><div class="util"><i style="width:45%;background:var(--teal)"></i></div></td></tr>
        <tr><td><div class="staff-cell"><div class="q-av av-gold">HT</div><b>Hồng Trang</b></div></td><td>KTV · RF</td><td><span class="tag done">11:00</span> <span class="tag done">15:00</span> <span class="tag done">16:00</span></td><td><div class="util"><i style="width:30%;background:var(--teal)"></i></div></td></tr>
        <tr><td><div class="staff-cell"><div class="q-av av-blush">NL</div><b>Ngọc Linh</b></div></td><td>ĐD · Skincare</td><td><span class="tag done">13:30</span></td><td><div class="util"><i style="width:75%;background:var(--amber)"></i></div></td></tr>
        <tr><td><div class="staff-cell"><div class="q-av av-slate">MT</div><b>Mỹ Tâm</b></div></td><td>Salon tóc</td><td><span class="tag wait">Nghỉ ca chiều</span></td><td><div class="util"><i style="width:50%;background:var(--teal)"></i></div></td></tr>
      </tbody></table>
      <div class="alert al-warn" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div>Khung <b>10:00</b> và <b>17:00</b>: số khách đặt vượt số KTV rảnh → cân nhắc giãn lịch hoặc thêm part-time giờ cao điểm.</div></div>
    </div>
    <div class="panel"><div class="panel-h"><div class="panel-title">Lịch máy móc · thiết bị cao cấp<small>Tài sản đắt tiền cần theo dõi hiệu suất</small></div></div>
      <div class="mc"><div class="ic ic-rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg></div><div style="flex:1"><b style="font-size:13.5px">Laser Diode XL <span class="tag vip">~1,8 tỷ</span></b><div style="font-size:12px;color:var(--ink-soft)">Đang dùng · phòng Laser 2</div><div class="util"><i style="width:82%;background:var(--rose)"></i></div></div><div style="text-align:right;font-family:Fraunces,serif;font-weight:600">82%</div></div>
      <div class="mc"><div class="ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg></div><div style="flex:1"><b style="font-size:13.5px">Máy RF giảm béo <span class="tag vip">~950tr</span></b><div style="font-size:12px;color:var(--ink-soft)">Trống đến 11:00</div><div class="util"><i style="width:58%;background:var(--amber)"></i></div></div><div style="text-align:right;font-family:Fraunces,serif;font-weight:600">58%</div></div>
      <div class="mc"><div class="ic ic-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg></div><div style="flex:1"><b style="font-size:13.5px">Máy HIFU nâng cơ <span class="tag vip">~1,2 tỷ</span></b><div style="font-size:12px;color:var(--ink-soft)">Bảo trì định kỳ 13:30–14:00</div><div class="util"><i style="width:40%;background:var(--teal)"></i></div></div><div style="text-align:right;font-family:Fraunces,serif;font-weight:600">40%</div></div>
      <div class="alert al-info" style="margin-top:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Booking cần kiểm tra máy còn trống trước khi xác nhận buổi dùng thiết bị cao cấp.</div></div>
    </div>
  </div>`;

// heatmap data: rows=resource type, cols=time; value=ratio khách/nhân sự
const TIMES=['09:00','10:00','11:00','13:30','14:00','15:00','16:00','17:00'];
const ROWS=[
  {r:'Laser',cells:['mid','over','free','free','mid','free','free','full']},
  {r:'Slim/RF',cells:['free','full','mid','free','free','free','free','full']},
  {r:'Da',cells:['mid','full','free','mid','free','free','free','mid']},
  {r:'Salon',cells:['free','mid','free','free','free','free','free','free']},
];
const lbl={free:'Trống',mid:'Gần đầy',full:'Đầy',over:'Quá tải'};
let h='<div class="hh"></div>'+TIMES.map(t=>`<div class="hh">${t}</div>`).join('');
ROWS.forEach(row=>{
  h+=`<div class="hr-label">${row.r}</div>`;
  row.cells.forEach((c,i)=> h+=`<div class="cell c-${c}" title="${row.r} · ${TIMES[i]}">${c==='over'?'!':''}<small>${lbl[c]}</small></div>`);
});
document.getElementById('heat').innerHTML=h;
wireUI();
</script>
</body></html>
