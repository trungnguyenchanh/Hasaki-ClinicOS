<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Tracking flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.flow-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.flow-tabs button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:13px;font-weight:500;padding:8px 16px;border-radius:30px;cursor:pointer;color:var(--ink-soft)}
.flow-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* multi-queue board */
.queue-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.qline{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column}
.qline-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.qline-h .qh-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.qline-h b{font-size:12.5px;line-height:1.2}
.qline-h .qh-cnt{margin-left:auto;font-family:'Fraunces',serif;font-weight:600;font-size:17px}
.qline-sub{font-size:10.5px;color:var(--ink-soft);margin-bottom:10px}
.qticket{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;cursor:pointer;transition:.14s;position:relative}
.qticket:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.qticket:last-child{margin-bottom:0}
.qt-row{display:flex;align-items:center;gap:8px}
.qt-num{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:11px;color:#fff;flex:none}
.qt-num.book{background:var(--teal)}.qt-num.walk{background:var(--gold)}
.qticket b{font-size:12px;line-height:1.2}
.qt-meta{font-size:10.5px;color:var(--ink-soft);margin-top:2px}
.qt-wait{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;margin-left:auto;white-space:nowrap}
.w-ok{background:var(--teal-soft);color:var(--teal-deep)}
.w-warn{background:#fdf3e3;color:#9a6a1e}
.w-late{background:#f9e6e6;color:#a64b4b}
.qticket.urgent{border-color:#e9b3b3;background:#fdf4f4}
.qline-empty{font-size:11px;color:var(--ink-soft);text-align:center;padding:14px 0;font-style:italic}
.wait-flag{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;box-shadow:var(--shadow)}
/* đang làm dịch vụ theo group */
.grp{margin-bottom:18px}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.grp-h .g-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.grp-h .g-ic svg{width:18px;height:18px}
.grp-h b{font-size:15px;font-family:'Fraunces',serif}
.grp-h .g-cnt{font-size:11.5px;color:var(--ink-soft)}
.grp-h .g-room{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.insvc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.insvc{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;position:relative}
.insvc.over{border-color:#e9b3b3;background:#fdf4f4}
.insvc.empty{border-style:dashed;display:grid;place-items:center;min-height:120px;color:var(--ink-soft);font-size:12.5px;font-style:italic}
.is-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.is-top .q-av{width:34px;height:34px;font-size:12px}
.is-top b{font-size:13.5px;line-height:1.2}
.is-top .is-room{font-size:11px;color:var(--ink-soft)}
.is-svc{font-size:12px;color:var(--ink-soft);margin-bottom:10px}
.is-time{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-top:1px dashed var(--line)}
.is-time b{font-family:'Fraunces',serif;font-weight:600}
.is-prog{height:7px;border-radius:6px;background:var(--bg);overflow:hidden;margin:9px 0 4px}
.is-prog i{display:block;height:100%;border-radius:6px}
.is-status{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;position:absolute;top:13px;right:13px}
.st-ontime{background:var(--teal-soft);color:var(--teal-deep)}
.st-soon{background:#fdf3e3;color:#9a6a1e}
.st-over{background:#f9e6e6;color:#a64b4b}
.over-flag{position:absolute;top:-7px;left:14px;background:var(--rose);color:#fff;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;box-shadow:var(--shadow)}
/* tình trạng nguồn lực */
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.res-col h4{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.res-col h4 .rc-ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.res-col h4 .rc-ic svg{width:13px;height:13px}
.res-col h4 .rc-cnt{margin-left:auto;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:10px}
.rc-cnt.ok{background:var(--teal-soft);color:var(--teal-deep)}.rc-cnt.bad{background:#f9e6e6;color:#a64b4b}
.res-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--bg-2);font-size:12.5px}
.res-item:last-child{border:none}
.res-item .ri-dot{width:9px;height:9px;border-radius:50%;flex:none}
.ri-free{background:var(--teal)}.ri-busy{background:var(--amber)}.ri-block{background:var(--rose)}.ri-off{background:#b8c0c4}
.res-item .ri-name{flex:1}.res-item .ri-name b{font-weight:600}.res-item .ri-name span{font-size:11px;color:var(--ink-soft);display:block}
.res-item .ri-state{font-size:10.5px;font-weight:600;white-space:nowrap}
@media(max-width:880px){.res-grid{grid-template-columns:1fr}}
/* timeline 1 khách */
.flow-line{display:flex;align-items:flex-start;overflow-x:auto;padding:10px 0}
.fl-step{flex:1;min-width:120px;text-align:center;position:relative}
.fl-step::before{content:"";position:absolute;top:18px;left:50%;width:100%;height:3px;background:var(--line);z-index:0}
.fl-step:last-child::before{display:none}
.fl-dot{width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;margin:0 auto;position:relative;z-index:1;color:var(--ink-soft)}
.fl-step.done .fl-dot{background:var(--teal);border-color:var(--teal);color:#fff}
.fl-step.current .fl-dot{border-color:var(--teal-deep);color:var(--teal-deep);box-shadow:0 0 0 4px var(--teal-soft)}
.fl-step.skip .fl-dot{border-style:dashed;opacity:.5}
.fl-lbl{font-size:11.5px;margin-top:7px;font-weight:500}
.fl-time{font-size:10.5px;color:var(--ink-soft)}
.fl-dur{font-size:10px;font-weight:600;margin-top:3px;padding:1px 6px;border-radius:10px;display:inline-block}
.dur-ok{background:var(--teal-soft);color:var(--teal-deep)}.dur-slow{background:#fdf3e3;color:#9a6a1e}
/* bottleneck bars */
.bn-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.bn-row:last-child{border:none}
.bn-name{width:160px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.bn-bar{flex:1;height:22px;border-radius:7px;background:var(--bg);overflow:hidden;position:relative}
.bn-bar i{display:block;height:100%;border-radius:7px}
.bn-val{font-family:'Fraunces',serif;font-weight:600;width:70px;text-align:right;font-size:14px}
/* luồng phiếu dọc (gom từ booking-detail) */
.pflow{position:relative}
.pf-item{display:flex;gap:14px;align-items:flex-start}
.pf-col{display:flex;flex-direction:column;align-items:center;flex:none}
.pf-dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;z-index:1}
.pf-dot svg{width:18px;height:18px}
.pf-line{width:2px;flex:1;background:var(--line);min-height:22px;margin:4px 0}
.pf-item:last-child .pf-line{display:none}
.pf-body{flex:1;border:1px solid var(--line);border-radius:13px;padding:12px 15px;margin-bottom:13px;background:#fff;text-decoration:none;color:inherit;display:block}
.pf-body:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.pf-body.done{background:linear-gradient(140deg,#fff,var(--teal-soft))}
.pf-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pf-h .pcode{font-family:Consolas,monospace;font-size:12px;font-weight:600;color:var(--teal-deep)}
.pf-h b{font-size:13.5px}
.pf-h .pf-time{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.pf-meta{font-size:12px;color:var(--ink-soft);margin-top:4px}
.pf-extra{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-soft)}
.pf-branch{margin-left:52px;border-left:2px dashed var(--gold);padding-left:13px;margin-bottom:13px}
.pf-branch .pbl{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px}
</style></head>

// ===== TAB 3: REPORT =====
function renderReport(){
  const bn=[
    {n:'Booking → Lấy số',v:5,max:30,c:'var(--teal)'},
    {n:'Lấy số → Tư vấn',v:8,max:30,c:'var(--teal)'},

    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3z"/></svg></div></div><div class="kpi-val">${late}</div><div class="kpi-lbl">Chờ quá lâu — cần xử lý ngay</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div></div><div class="kpi-val">7</div><div class="kpi-lbl">Số line theo dõi</div></div>
  </div>
  <div class="panel"><div class="panel-h"><div class="panel-title">Bảng hàng đợi theo từng line<small>Một khách có thể đi qua nhiều line trong ngày · chấm đỏ = chờ quá lâu, tránh bỏ sót</small></div>
    <div style="display:flex;gap:12px;font-size:11.5px;color:var(--ink-soft)"><span><i style="width:9px;height:9px;border-radius:3px;background:var(--teal);display:inline-block;margin-right:4px"></i>&lt;5p</span><span><i style="width:9px;height:9px;border-radius:3px;background:var(--amber);display:inline-block;margin-right:4px"></i>5–15p</span><span><i style="width:9px;height:9px;border-radius:3px;background:var(--rose);display:inline-block;margin-right:4px"></i>&gt;15p</span></div></div>
    <div class="queue-board">${QLINES.map(l=>`
      <div class="qline"><div class="qline-h"><div class="qh-ic ${l.ic}" style="background:var(--teal-deep)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px">${l.sv}</svg></div><b>${l.lbl}</b><span class="qh-cnt" style="color:${l.tickets.some(t=>t.w==='late')?'var(--rose)':'var(--teal-deep)'}">${l.tickets.length}</span></div>
        <div class="qline-sub">${l.sub}</div>
        ${l.tickets.length?l.tickets.map(t=>`<div class="qticket ${t.w==='late'?'urgent':''}" onclick="location.href='flow-timeline.html'">${t.w==='late'?'<span class="wait-flag">!</span>':''}
          <div class="qt-row"><span class="qt-num ${t.src}">${t.num}</span><div style="flex:1;min-width:0"><b>${t.name}</b><div class="qt-meta">${t.meta}</div></div></div>
          <div style="display:flex;align-items:center;margin-top:6px"><span class="qt-wait w-${t.w}">⏱ ${t.wait} phút</span></div></div>`).join(''):'<div class="qline-empty">Không có khách chờ</div>'}
      </div>`).join('')}</div>
  </div>
  <div class="alert al-rose" style="margin-top:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3z"/></svg><div><b>${late} khách chờ quá lâu (&gt;15 phút):</b> line "Đợi bác sĩ" có 2 khách (Ngô Khánh 18p, Đỗ Lan 22p) — ưu tiên gọi ngay để tránh bỏ sót.</div></div>`;
}
renderInService();
</script>
</body></html>
