<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Report Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ops-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.ops-card .oc-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ops-card .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.ops-card .oc-ic svg{width:17px;height:17px}
.ops-card .oc-t{font-weight:600;font-size:14px}
.ops-card .oc-big{font-family:'Fraunces',serif;font-size:32px;line-height:1;margin:2px 0}
.ops-card .oc-sub{font-size:11.5px;color:var(--ink-soft)}
.ops-card .oc-rows{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ops-card .ocr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ops-card .ocr b{font-family:'Fraunces',serif}
.ops-card .oc-link{margin-top:11px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ops-card.warn{border-color:#f0c9a8;background:linear-gradient(140deg,#fff,#fdeee3)}
.load-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.load-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}.load-bar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--teal-soft);color:var(--teal-deep)}.badge.busy{background:#fbeccb;color:#9a6a1e}.badge.over{background:#f4d3cb;color:#9a3b2c}
.subtab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.subtab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.subtab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.kpi-bar{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;min-width:90px}.kpi-bar i{display:block;height:100%;background:var(--teal)}
.num-strong{font-family:'Fraunces',serif;font-weight:600}
.role-chip{font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--bg-2);font-weight:500}
.kpi-big{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi-big .kb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi-big .kb .kv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.kpi-big .kb .kl{font-size:11.5px;color:var(--ink-soft)}
.kpi-big .kb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.kpi-big .kb.warn .kv{color:#9a5a1e}
.kpi-big .kb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.kpi-big .kb.good .kv{color:var(--teal-deep)}
.region-block{margin-bottom:22px}
.region-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.region-head .rg-ic{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.region-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0}
.region-head .rg-sum{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ov-table td{padding:10px;border-bottom:1px solid var(--line)}
.ov-table tr.clickable{cursor:pointer;transition:.12s}.ov-table tr.clickable:hover td{background:var(--teal-soft)}
.ov-cn{font-weight:600}.ov-cn small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut-c{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut-c b{font-family:'Fraunces',serif;font-size:17px;display:block}.donut-c span{font-size:10px;color:var(--ink-soft)}
.leg-list{display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.leg-row .dot{width:11px;height:11px;border-radius:3px;flex:none}.leg-row b{margin-left:auto;font-family:'Fraunces',serif}
@media(max-width:900px){.snap,.ops-grid,.kpi-big{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('reports');
const back=`<a class="btn btn-ghost" href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Trung tâm báo cáo</a>`;
document.getElementById('main').innerHTML = topbar('Quản trị','Report Sales · Kinh doanh',{who:'HQ',branch:'Tất cả CN',right:back}) + `
  <div class="snap">
    <div class="sb good"><div class="sl">Doanh thu tháng</div><div class="sv">12,6 tỷ</div><div class="sl">▲ 11% so tháng trước</div></div>
    <div class="sb"><div class="sl">Doanh thu hôm nay</div><div class="sv">487tr</div><div class="sl">▲ 8% so hôm qua</div></div>
    <div class="sb"><div class="sl">Tỷ trọng gói</div><div class="sv">61%</div><div class="sl">gói / lẻ / ví</div></div>
    <div class="sb"><div class="sl">Giá trị đơn TB</div><div class="sv">2,9tr</div><div class="sl">▲ 4%</div></div>
  </div>
  <div class="subtab" id="st">
    <button class="on" onclick="sub('total')">Tổng toàn chuỗi</button><button onclick="sub('region')">Theo khu vực</button><button onclick="sub('cn')">Theo chi nhánh</button><button onclick="sub('cust')">Theo khách hàng</button><button onclick="sub('svc')">Theo dịch vụ</button><button onclick="sub('prod')">Theo sản phẩm</button>
  </div>
  <div id="sv"></div>`;
const SV=document.getElementById('sv');
const VIEWS={
total:`<div class="row r-2"><div class="panel"><div class="panel-h"><div class="panel-title">Doanh thu 6 tháng<small>toàn chuỗi (tỷ VND)</small></div></div>
    <table><thead><tr><th>Tháng</th><th>Doanh thu</th><th>Gói</th><th>Lẻ</th><th>So tháng trước</th></tr></thead><tbody>
      <tr><td>Tháng 1</td><td class="num-strong">10,2</td><td>60%</td><td>40%</td><td>—</td></tr><tr><td>Tháng 2</td><td class="num-strong">9,8</td><td>58%</td><td>42%</td><td style="color:var(--rose)">▼ 4%</td></tr><tr><td>Tháng 3</td><td class="num-strong">11,1</td><td>61%</td><td>39%</td><td style="color:var(--teal-deep)">▲ 13%</td></tr><tr><td>Tháng 4</td><td class="num-strong">11,5</td><td>62%</td><td>38%</td><td style="color:var(--teal-deep)">▲ 4%</td></tr><tr><td>Tháng 5</td><td class="num-strong">11,4</td><td>60%</td><td>40%</td><td style="color:var(--rose)">▼ 1%</td></tr><tr><td><b>Tháng 6</b></td><td class="num-strong">12,6</td><td>61%</td><td>39%</td><td style="color:var(--teal-deep)">▲ 11%</td></tr>
    </tbody></table></div>
    <div class="panel"><div class="panel-h"><div class="panel-title">Cơ cấu doanh thu</div></div>
      <div class="donut-box"><div class="donut" style="background:conic-gradient(var(--teal) 0 38%,var(--blush-deep) 38% 62%,var(--gold) 62% 81%,#9fbfd6 81% 100%)"><div class="donut-c"><div><b>12,6T</b><span>tổng</span></div></div></div>
      <div class="leg-list"><div class="leg-row"><i class="dot" style="background:var(--teal)"></i>Triệt lông <b>38%</b></div><div class="leg-row"><i class="dot" style="background:var(--blush-deep)"></i>Chăm sóc da <b>24%</b></div><div class="leg-row"><i class="dot" style="background:var(--gold)"></i>Giảm béo <b>19%</b></div><div class="leg-row"><i class="dot" style="background:#9fbfd6"></i>Derma & Hair <b>19%</b></div></div></div>
    </div></div>`,
region:`<div class="panel"><div class="panel-h"><div class="panel-title">Doanh thu theo khu vực<small>3 khu vực · tháng này</small></div></div>
    <table><thead><tr><th>Khu vực</th><th>Số CN</th><th>Doanh thu</th><th>Tỷ trọng</th><th>So tháng trước</th><th>Đơn TB</th></tr></thead><tbody>
      <tr><td><b>TP. Hồ Chí Minh</b></td><td>3</td><td class="num-strong">7,8 tỷ</td><td>62%</td><td style="color:var(--teal-deep)">▲ 13%</td><td>3,1tr</td></tr><tr><td><b>Hà Nội</b></td><td>2</td><td class="num-strong">3,4 tỷ</td><td>27%</td><td style="color:var(--teal-deep)">▲ 8%</td><td>2,7tr</td></tr><tr><td><b>Đà Nẵng</b></td><td>1</td><td class="num-strong">1,4 tỷ</td><td>11%</td><td style="color:var(--teal-deep)">▲ 6%</td><td>2,4tr</td></tr>
    </tbody></table></div>`,
cn:`<div class="panel"><div class="panel-h"><div class="panel-title">Doanh thu theo chi nhánh<small>6 CN · tháng này</small></div></div>
    <table><thead><tr><th>Chi nhánh</th><th>Khu vực</th><th>Doanh thu</th><th>Gói/Lẻ/Ví</th><th>Buổi DV</th><th>So tháng trước</th></tr></thead><tbody>
      <tr><td><b>CN Quận 1</b></td><td>TP.HCM</td><td class="num-strong">3,2 tỷ</td><td>63/30/7</td><td>1.840</td><td style="color:var(--teal-deep)">▲ 14%</td></tr><tr><td><b>CN Quận 7</b></td><td>TP.HCM</td><td class="num-strong">2,9 tỷ</td><td>60/33/7</td><td>1.610</td><td style="color:var(--teal-deep)">▲ 12%</td></tr><tr><td><b>CN Thủ Đức</b></td><td>TP.HCM</td><td class="num-strong">1,7 tỷ</td><td>58/35/7</td><td>980</td><td style="color:var(--teal-deep)">▲ 9%</td></tr><tr><td><b>CN Cầu Giấy</b></td><td>Hà Nội</td><td class="num-strong">2,0 tỷ</td><td>61/32/7</td><td>1.120</td><td style="color:var(--teal-deep)">▲ 8%</td></tr><tr><td><b>CN Hai Bà Trưng</b></td><td>Hà Nội</td><td class="num-strong">1,4 tỷ</td><td>59/34/7</td><td>790</td><td style="color:var(--teal-deep)">▲ 7%</td></tr><tr><td><b>CN Hải Châu</b></td><td>Đà Nẵng</td><td class="num-strong">1,4 tỷ</td><td>57/36/7</td><td>760</td><td style="color:var(--teal-deep)">▲ 6%</td></tr>
    </tbody></table></div>`,
cust:`<div class="snap" style="grid-template-columns:repeat(3,1fr)"><div class="sb"><div class="sl">Khách hoạt động/tháng</div><div class="sv">4.320</div><div class="sl">▲ 6%</div></div><div class="sb good"><div class="sl">Tỷ lệ khách quay lại</div><div class="sv">58%</div><div class="sl">▲ 3%</div></div><div class="sb"><div class="sl">Khách VIP</div><div class="sv">312</div><div class="sl">đóng góp 34% DT</div></div></div>
    <div class="panel"><div class="panel-h"><div class="panel-title">Phân khúc khách hàng theo doanh thu</div></div>
    <table><thead><tr><th>Phân khúc</th><th>Số khách</th><th>Doanh thu</th><th>Tỷ trọng</th><th>Đơn TB</th><th>Tần suất/tháng</th></tr></thead><tbody>
      <tr><td><span class="role-chip">VIP / Hạng Vàng</span></td><td>312</td><td class="num-strong">4,3 tỷ</td><td>34%</td><td>6,8tr</td><td>2,1</td></tr><tr><td><span class="role-chip">Thân thiết / Bạc</span></td><td>980</td><td class="num-strong">5,1 tỷ</td><td>40%</td><td>3,2tr</td><td>1,6</td></tr><tr><td><span class="role-chip">Mới / Đồng</span></td><td>3.028</td><td class="num-strong">3,2 tỷ</td><td>26%</td><td>1,1tr</td><td>0,9</td></tr>
    </tbody></table></div>`,
svc:`<div class="panel"><div class="panel-h"><div class="panel-title">Doanh thu theo dịch vụ<small>nhóm dịch vụ · tháng này</small></div></div>
    <table><thead><tr><th>Dịch vụ</th><th>Số buổi</th><th>Doanh thu</th><th>Tỷ trọng</th><th>Giá TB/buổi</th><th>So tháng trước</th></tr></thead><tbody>
      <tr><td><b>Triệt lông</b></td><td>2.140</td><td class="num-strong">4,8 tỷ</td><td>38%</td><td>2,2tr</td><td style="color:var(--teal-deep)">▲ 12%</td></tr><tr><td><b>Chăm sóc da</b></td><td>1.680</td><td class="num-strong">3,0 tỷ</td><td>24%</td><td>1,8tr</td><td style="color:var(--teal-deep)">▲ 9%</td></tr><tr><td><b>Giảm béo</b></td><td>720</td><td class="num-strong">2,4 tỷ</td><td>19%</td><td>3,3tr</td><td style="color:var(--teal-deep)">▲ 15%</td></tr><tr><td><b>Derma & Hair</b></td><td>610</td><td class="num-strong">2,4 tỷ</td><td>19%</td><td>3,9tr</td><td style="color:var(--rose)">▼ 2%</td></tr>
    </tbody></table></div>`,
prod:`<div class="panel"><div class="panel-h"><div class="panel-title">Doanh thu theo sản phẩm bán lẻ<small>mỹ phẩm · dược mỹ phẩm · tháng này</small></div></div>
    <table><thead><tr><th>Sản phẩm</th><th>SL bán</th><th>Doanh thu</th><th>Tồn kho</th><th>Vòng quay</th><th>Trạng thái</th></tr></thead><tbody>
      <tr><td><b>Serum phục hồi B5</b></td><td>820</td><td class="num-strong">410tr</td><td>140</td><td>5,9</td><td><span class="badge ok">Bán chạy</span></td></tr><tr><td><b>Kem chống nắng SPF50</b></td><td>640</td><td class="num-strong">256tr</td><td>210</td><td>3,0</td><td><span class="badge ok">Tốt</span></td></tr><tr><td><b>Sữa rửa mặt dịu nhẹ</b></td><td>510</td><td class="num-strong">128tr</td><td>95</td><td>5,4</td><td><span class="badge ok">Bán chạy</span></td></tr><tr><td><b>Mặt nạ dưỡng ẩm</b></td><td>430</td><td class="num-strong">86tr</td><td>320</td><td>1,3</td><td><span class="badge busy">Tồn cao</span></td></tr><tr><td><b>Tinh chất trị mụn</b></td><td>180</td><td class="num-strong">63tr</td><td>40</td><td>4,5</td><td><span class="badge ok">Tốt</span></td></tr>
    </tbody></table></div>`,
};
function sub(k){document.querySelectorAll('#st button').forEach(b=>b.classList.remove('on'));const idx={total:0,region:1,cn:2,cust:3,svc:4,prod:5}[k];document.querySelectorAll('#st button')[idx].classList.add('on');SV.innerHTML=VIEWS[k];}
window.sub=sub; sub('total');
</script>
</body></html>
