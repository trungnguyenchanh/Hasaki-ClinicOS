<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Hồ sơ điều trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.med-head{background:linear-gradient(140deg,#fff,var(--indigo-soft));border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.med-head .q-av{width:60px;height:60px;border-radius:18px;font-size:22px}
.allergy{background:#f9e6e6;border:1px solid #e9b3b3;border-radius:13px;padding:13px;font-size:13px;color:#a64b4b;display:flex;gap:9px}
.allergy svg{width:18px;height:18px;flex:none;margin-top:1px}
.vital{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.vital .v{background:var(--bg-2);border-radius:11px;padding:11px 13px}
.vital .v b{font-family:'Fraunces',serif;font-size:18px;display:block}.vital .v span{font-size:11px;color:var(--ink-soft)}
.enc{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:13px;background:#fff}
.enc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.enc-top .d{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--indigo)}
.enc dl{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:13px;margin:0}
.enc dt{color:var(--ink-soft)}.enc dd{margin:0}
.icd{display:inline-block;font-size:11px;font-family:Consolas,monospace;background:var(--indigo-soft);color:var(--indigo);padding:2px 7px;border-radius:6px;margin-right:6px}
/* ==== bản đồ vùng điều trị ==== */
.bmap-wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.bmap-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.bmap-tabs{display:flex;gap:5px;margin-bottom:12px}
.bmap-tabs button{flex:1;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12px;padding:7px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.bmap-tabs button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.bmap-svg{width:100%;height:auto;display:block}
.bzone{cursor:pointer;transition:.15s;stroke:#fff;stroke-width:1.2}
.bzone:hover{opacity:.82}
.bzone.sel{stroke:var(--teal-deep);stroke-width:2.4}
.fpoint{cursor:pointer}
.bmap-legend{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--ink-soft);margin-top:10px;flex-wrap:wrap}
.bmap-legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:middle;margin-right:3px}
.zhist-empty{color:var(--ink-soft);font-size:13px;padding:24px 8px;text-align:center}
.zhist-head{font-family:'Fraunces',serif;font-size:16px;margin:0 0 3px}
.zhist-sub{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.zsess{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--bg-2);cursor:pointer}
.zsess:last-child{border:none}.zsess:hover{background:var(--bg-2)}
.zsess .zs-d{width:46px;flex:none;font-size:11px;color:var(--ink-soft);text-align:center}
.zsess .zs-d b{display:block;font-family:'Fraunces',serif;font-size:14px;color:var(--ink)}
.zsess .zs-b b{font-size:13.5px}.zsess .zs-b span{font-size:11.5px;color:var(--ink-soft);display:block}
.zsess .zs-amt{margin-left:auto;font-size:11px;color:var(--teal-deep);font-weight:600;white-space:nowrap;text-align:right}
.zsum{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.zsum-chip{font-size:11.5px;padding:5px 11px;border-radius:20px;background:var(--bg-2);cursor:pointer;border:1px solid transparent}
.zsum-chip.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.zsum-chip b{font-weight:700}
@media(max-width:900px){.bmap-wrap{grid-template-columns:1fr}.vital{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>

<script>

const right=`<a class="btn btn-ghost" href="customer-detail.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Hồ sơ khách</a><a class="btn btn-teal" href="doctor-prescription.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/><circle cx="9" cy="10" r="1.5"/></svg>Khám & kê toa</a>`;
document.getElementById('main').innerHTML = topbar('Bác sĩ › Hồ sơ điều trị','Hồ sơ điều trị — Trần Thu Hà',{who:'BH',branch:'CN Quận 1',right}) + `

      <div style="font-size:13px;color:var(--ink-soft)">C-1042 · Nữ · 32 tuổi · Nhóm máu O+ · BS theo dõi: Bích Hằng</div></div>
    <div class="allergy" style="max-width:340px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>Dị ứng:</b> Lidocaine, Paraben, cồn khô · da nhạy cảm vùng mặt</div></div>

  <div class="row r-2e" style="margin-bottom:18px">

      <div class="vital"><div class="v"><b>52 kg</b><span>Cân nặng</span></div><div class="v"><b>160 cm</b><span>Chiều cao</span></div><div class="v"><b>118/76</b><span>Huyết áp</span></div><div class="v"><b>20.3</b><span>BMI</span></div></div>
      <div style="font-size:13px;margin-top:14px;line-height:1.8"><b>Tiền sử y khoa:</b> không bệnh nền · không phẫu thuật thẩm mỹ trước đó · không mang thai.<br><b>Thói quen:</b> không hút thuốc · ít vận động · da khô theo mùa.</div>

    <div class="panel"><div class="panel-h"><div class="panel-title">Liệu trình đang điều trị</div></div>
      <div class="wpill"><div class="q-av av-gold">RF</div><div class="wi"><b>Giảm béo RF bụng · 1/10</b><span>BS chỉ định 10/06 · theo dõi phản ứng da</span></div></div>
      <div class="wpill"><div class="q-av av-teal">TL</div><div class="wi"><b>Triệt lông Diode · 4/8</b><span>Ổn định, không phản ứng bất thường</span></div></div>
      <div class="wpill"><div class="q-av av-blush">DA</div><div class="wi"><b>Chăm sóc da phục hồi · 2/3</b><span>Da cải thiện tốt</span></div></div>

        <dt>Chẩn đoán</dt><dd><span class="icd">E65</span> Mỡ khu trú · <span class="icd">L98.9</span> Rối loạn da, mô dưới da chưa đặc hiệu</dd>
        <dt>Xử trí</dt><dd>Chỉ định liệu trình RF 10 buổi · kê toa hỗ trợ phục hồi</dd>

    <div class="enc">
      <div class="enc-top"><div class="d">02/05/2026 · BS. Minh Quân</div><a href="encounter-summary.html" class="btn btn-ghost" style="margin-left:auto;padding:6px 13px;font-size:12px">Xem chi tiết</a></div>
      <dl><dt>Lý do khám</dt><dd>Khám da định kỳ</dd>
        <dt>Chẩn đoán</dt><dd><span class="icd">L70.0</span> Mụn trứng cá thông thường (nhẹ)</dd>
        <dt>Xử trí</dt><dd>Tư vấn chăm sóc da, không kê thuốc</dd></dl>
    </div>
    <div class="enc">
      <div class="enc-top"><div class="d">15/03/2026 · BS. Bích Hằng</div><span class="tag new">Đơn QG-7012F</span><a href="encounter-summary.html" class="btn btn-ghost" style="margin-left:auto;padding:6px 13px;font-size:12px">Xem chi tiết</a></div>
      <dl><dt>Chẩn đoán</dt><dd><span class="icd">Z41.1</span> Chăm sóc thẩm mỹ sau thủ thuật</dd>
        <dt>Xử trí</dt><dd>Kê kháng sinh bôi ngừa nhiễm khuẩn sau triệt lông</dd></dl>
    </div>
  </div>

  <div class="row r-2e">
    <div class="panel"><div class="panel-h"><div class="panel-title">Lịch sử thuốc đã dùng<small>Tổng hợp từ các đơn — hỗ trợ tránh kê trùng / tương tác</small></div></div>
      <table><thead><tr><th>Thuốc</th><th>SKU</th><th>Từ đơn</th><th>Ngày</th></tr></thead><tbody>
        <tr><td><b>Kem phục hồi da (panthenol)</b></td><td style="font-family:Consolas,monospace;font-size:12px">MED-PAN-CR</td><td>QG-7741A</td><td>10/06</td></tr>
        <tr><td><b>Vitamin C + E</b></td><td style="font-family:Consolas,monospace;font-size:12px">MED-VITCE</td><td>QG-7741A</td><td>10/06</td></tr>
        <tr><td><b>Kháng sinh bôi (mupirocin)</b></td><td style="font-family:Consolas,monospace;font-size:12px">MED-MUPI</td><td>QG-7012F</td><td>15/03</td></tr>
      </tbody></table>
      <div class="alert al-warn" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3z"/></svg><div>Đã từng dùng kháng sinh bôi 15/03 — cân nhắc nếu kê lại nhóm này.</div></div>
    </div>
    <div class="panel"><div class="panel-h"><div class="panel-title">SKU liệu trình / buổi đã sử dụng<small>Mã định danh từng buổi dịch vụ đã thực hiện</small></div></div>
      <table><thead><tr><th>SKU buổi</th><th>Liệu trình</th><th>Buổi</th><th>Ngày</th></tr></thead><tbody>
        <tr class="clickable" onclick="location.href='service-record.html'"><td style="font-family:Consolas,monospace;font-size:12px">SVC-RF-0012</td><td>Giảm béo RF bụng</td><td>1/10</td><td>Hôm nay</td></tr>
        <tr class="clickable" onclick="location.href='service-record.html'"><td style="font-family:Consolas,monospace;font-size:12px">SVC-DA-0089</td><td>Chăm sóc da phục hồi</td><td>2/3</td><td>28/06</td></tr>
        <tr class="clickable" onclick="location.href='service-record.html'"><td style="font-family:Consolas,monospace;font-size:12px">SVC-LSR-0341</td><td>Triệt lông Diode</td><td>4/8</td><td>15/06</td></tr>
        <tr class="clickable" onclick="location.href='service-record.html'"><td style="font-family:Consolas,monospace;font-size:12px">SVC-LSR-0298</td><td>Triệt lông Diode</td><td>3/8</td><td>01/06</td></tr>
      </tbody></table>
      <div class="alert al-info" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Click mã SKU buổi để mở <b>chi tiết thực hiện</b> (máy · thợ chính/phụ · step · ảnh).</div></div>
    </div>
  </div>
  <div class="panel" style="margin-top:18px"><div class="panel-h"><div class="panel-title">Bản đồ điều trị theo vùng cơ thể<small>Vùng đã làm dịch vụ — đậm theo số buổi · click vùng để xem lịch sử riêng vùng đó</small></div></div>
    <div style="padding:16px">
      <div class="bmap-wrap">
        <div class="bmap-card">
          <div class="bmap-tabs"><button class="on" id="bm-body" onclick="bmapMode('body')">Toàn thân</button><button id="bm-face" onclick="bmapMode('face')">Khuôn mặt</button></div>
          <div id="bmapHolder"></div>
          <div class="bmap-legend"><span><i style="background:#e4ece9"></i>Chưa làm</span><span><i style="background:#bfe0d6"></i>1–2 buổi</span><span><i style="background:#6bbca8"></i>3–5 buổi</span><span><i style="background:#2f9c87"></i>6+ buổi</span><span><i style="background:var(--rose)"></i>Điểm (mặt)</span></div>
        </div>

wireUI();

/* ====== Dữ liệu vùng điều trị của khách ====== */
// vùng lớn: số buổi theo vùng + lịch sử
const ZONE_NAME={
  'ZN-ABD':'Bụng','ZN-WAIST-L':'Eo trái','ZN-WAIST-R':'Eo phải','ZN-UA-L':'Nách trái','ZN-UA-R':'Nách phải',
  'ZN-THIGH-L':'Đùi trái','ZN-THIGH-R':'Đùi phải','ZN-ARM-L':'Cánh tay trái','ZN-ARM-R':'Cánh tay phải','ZN-BACK':'Lưng'
};
const ZONE_HIST={
  'ZN-ABD':[
    {d:'Hôm nay',svc:'Giảm béo RF bụng',ses:'1/10',amt:'Mức 6 · 42°C',tk:'SVC-RF-0012'},
  ],
  'ZN-WAIST-L':[{d:'Hôm nay',svc:'Giảm béo RF bụng',ses:'1/10',amt:'Mức 6',tk:'SVC-RF-0012'}],
  'ZN-WAIST-R':[{d:'Hôm nay',svc:'Giảm béo RF bụng',ses:'1/10',amt:'Mức 6',tk:'SVC-RF-0012'}],
  'ZN-UA-L':[
    {d:'15/06',svc:'Triệt lông Diode',ses:'4/8',amt:'14 J/cm² · 240 shot',tk:'SVC-LSR-0341'},
    {d:'01/06',svc:'Triệt lông Diode',ses:'3/8',amt:'13 J/cm² · 230 shot',tk:'SVC-LSR-0298'},
    {d:'15/05',svc:'Triệt lông Diode',ses:'2/8',amt:'13 J/cm²',tk:'SVC-LSR-0255'},
    {d:'01/05',svc:'Triệt lông Diode',ses:'1/8',amt:'12 J/cm²',tk:'SVC-LSR-0210'},
  ],
  'ZN-UA-R':[
    {d:'15/06',svc:'Triệt lông Diode',ses:'4/8',amt:'14 J/cm² · 240 shot',tk:'SVC-LSR-0341'},
    {d:'01/06',svc:'Triệt lông Diode',ses:'3/8',amt:'13 J/cm²',tk:'SVC-LSR-0298'},
    {d:'15/05',svc:'Triệt lông Diode',ses:'2/8',amt:'13 J/cm²',tk:'SVC-LSR-0255'},
  ],
};
// điểm trên mặt
const FACE_POINTS=[
  {x:62,y:46,note:'Nốt ruồi má phải',svc:'Tiểu phẫu nốt ruồi (BS)',d:'10/06',tk:'SVC-CO2-0033'},
  {x:50,y:30,note:'Nám trán',svc:'Điều trị nám laser',d:'28/05',tk:'SVC-LSR-0301'},
  {x:50,y:62,note:'Nâng cơ vùng cằm',svc:'Nâng cơ HIFU mặt',d:'20/05',tk:'SVC-HIFU-0012'},
];
function zCount(code){return (ZONE_HIST[code]||[]).length;}
function zFill(n){return n===0?'#e4ece9':n<=2?'#bfe0d6':n<=5?'#6bbca8':'#2f9c87';}

let bmMode='body', selZone=null;
function bodySvg(){
  // silhouette mặt trước, các vùng là path/ellipse có id=mã vùng
  const z=(code,el)=>el.replace('FILL',zFill(zCount(code))).replace('CODE',code).replace('SEL',selZone===code?'sel':'');
  return `<svg viewBox="0 0 200 360" class="bmap-svg">
    <!-- đầu -->
    <circle cx="100" cy="34" r="22" fill="#eadfce" stroke="var(--line)"/>
    <!-- thân nền -->
    <path d="M70 60 Q100 52 130 60 L138 150 Q140 200 132 240 L120 340 L108 340 L104 250 L96 250 L92 340 L80 340 L68 240 Q60 200 62 150 Z" fill="#f1ece3" stroke="var(--line)"/>
    <!-- tay nền -->
    <path d="M70 64 L40 150 L34 210 L46 212 L56 152 L72 96 Z" fill="#f1ece3" stroke="var(--line)"/>
    <path d="M130 64 L160 150 L166 210 L154 212 L144 152 L128 96 Z" fill="#f1ece3" stroke="var(--line)"/>
    ${z('ZN-UA-L','<ellipse class="bzone SEL" data-z="CODE" cx="74" cy="96" rx="9" ry="11" fill="FILL"/>')}
    ${z('ZN-UA-R','<ellipse class="bzone SEL" data-z="CODE" cx="126" cy="96" rx="9" ry="11" fill="FILL"/>')}
    ${z('ZN-ARM-L','<path class="bzone SEL" data-z="CODE" d="M44 140 L38 200 L48 202 L58 144 Z" fill="FILL"/>')}
    ${z('ZN-ARM-R','<path class="bzone SEL" data-z="CODE" d="M156 140 L162 200 L152 202 L142 144 Z" fill="FILL"/>')}
    ${z('ZN-WAIST-L','<path class="bzone SEL" data-z="CODE" d="M72 150 Q70 175 78 195 L96 195 L96 150 Z" fill="FILL"/>')}
    ${z('ZN-WAIST-R','<path class="bzone SEL" data-z="CODE" d="M128 150 Q130 175 122 195 L104 195 L104 150 Z" fill="FILL"/>')}
    ${z('ZN-ABD','<rect class="bzone SEL" data-z="CODE" x="84" y="150" width="32" height="50" rx="8" fill="FILL"/>')}
    ${z('ZN-THIGH-L','<path class="bzone SEL" data-z="CODE" d="M84 248 L80 320 L94 320 L96 248 Z" fill="FILL"/>')}
    ${z('ZN-THIGH-R','<path class="bzone SEL" data-z="CODE" d="M116 248 L120 320 L106 320 L104 248 Z" fill="FILL"/>')}
  </svg>`;
}
function faceSvg(){
  return `<svg viewBox="0 0 100 120" class="bmap-svg" style="max-width:220px;margin:0 auto">
    <ellipse cx="50" cy="58" rx="32" ry="40" fill="#f1ece3" stroke="var(--line)"/>
    <path d="M22 32 Q50 10 78 32" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <ellipse cx="38" cy="52" rx="4" ry="2.5" fill="#fff" stroke="var(--ink-soft)" stroke-width=".6"/><circle cx="38" cy="52" r="1.6" fill="var(--ink-soft)"/>
    <ellipse cx="62" cy="52" rx="4" ry="2.5" fill="#fff" stroke="var(--ink-soft)" stroke-width=".6"/><circle cx="62" cy="52" r="1.6" fill="var(--ink-soft)"/>
    <path d="M50 56 L47 68 Q50 71 53 68" fill="none" stroke="var(--ink-soft)" stroke-width="1"/>
    <path d="M42 80 Q50 85 58 80" fill="none" stroke="var(--ink-soft)" stroke-width="1.2"/>
    ${FACE_POINTS.map((p,i)=>`<g class="fpoint" data-fi="${i}"><circle cx="${p.x}" cy="${p.y}" r="4" fill="${selZone==='F'+i?'var(--teal-deep)':'var(--rose)'}" stroke="#fff" stroke-width="1.2"/><text x="${p.x}" y="${p.y+2.4}" font-size="5.5" fill="#fff" text-anchor="middle" font-weight="700">${i+1}</text></g>`).join('')}
  </svg>`;
}
function renderBmap(){
  document.getElementById('bmapHolder').innerHTML = bmMode==='body'?bodySvg():faceSvg();
  if(bmMode==='body'){
    document.querySelectorAll('#bmapHolder .bzone').forEach(el=>el.addEventListener('click',()=>selectZone(el.dataset.z)));
  } else {
    document.querySelectorAll('#bmapHolder .fpoint').forEach(el=>el.addEventListener('click',()=>selectZone('F'+el.dataset.fi)));
  }
}
function bmapMode(m){bmMode=m;selZone=null;document.getElementById('bm-body').classList.toggle('on',m==='body');document.getElementById('bm-face').classList.toggle('on',m==='face');renderBmap();renderZHist();}
function selectZone(code){selZone=code;renderBmap();renderZHist();}
function renderZHist(){
  const el=document.getElementById('zhist');
  if(bmMode==='face'){
    // tổng quan điểm mặt
    if(selZone&&selZone[0]==='F'){
      const p=FACE_POINTS[+selZone.slice(1)];
      el.innerHTML=`<div class="zhist-head">Điểm: ${p.note}</div><div class="zhist-sub">Vị trí đánh dấu trên khuôn mặt</div>
        <div class="zsess" onclick="location.href='service-record.html'"><div class="zs-d"><b>${p.d.split('/')[0]||''}</b>${p.d.includes('/')?'/'+p.d.split('/')[1]:p.d}</div><div class="zs-b"><b>${p.svc}</b><span>${p.tk}</span></div><div class="zs-amt">1 lần</div></div>`;
      return;
    }
    el.innerHTML=`<div class="zhist-head">Điểm điều trị trên mặt</div><div class="zhist-sub">${FACE_POINTS.length} điểm đã đánh dấu — click 1 điểm trên hình để xem</div>
      <div class="zsum">${FACE_POINTS.map((p,i)=>`<span class="zsum-chip ${selZone==='F'+i?'on':''}" onclick="selectZone('F${i}')">${i+1}. ${p.note}</span>`).join('')}</div>
      ${FACE_POINTS.map((p,i)=>`<div class="zsess" onclick="selectZone('F${i}')"><div class="zs-d"><b>${i+1}</b></div><div class="zs-b"><b>${p.svc}</b><span>${p.note} · ${p.d}</span></div><div class="zs-amt">${p.tk}</div></div>`).join('')}`;
    return;
  }
  // body mode
  if(!selZone){
    const done=Object.keys(ZONE_HIST);
    el.innerHTML=`<div class="zhist-head">Tổng quan theo vùng</div><div class="zhist-sub">Các vùng đã từng làm dịch vụ — click vùng trên hình hoặc chip dưới đây</div>
      <div class="zsum">${done.map(c=>`<span class="zsum-chip" onclick="selectZone('${c}')">${ZONE_NAME[c]} <b>${zCount(c)}</b></span>`).join('')}</div>
      <div class="zhist-sub" style="margin-top:4px">Vùng tô đậm = làm nhiều buổi. Giúp theo dõi hiệu quả & tránh quá liều 1 vùng.</div>`;
    return;
  }
  const hist=ZONE_HIST[selZone]||[];
  el.innerHTML=`<div class="zhist-head">${ZONE_NAME[selZone]||selZone}</div><div class="zhist-sub">${hist.length} buổi đã thực hiện ở vùng này</div>
    ${hist.length?hist.map(h=>`<div class="zsess" onclick="location.href='service-record.html'"><div class="zs-d"><b>${h.d.includes('/')?h.d.split('/')[0]:h.d}</b>${h.d.includes('/')?'/'+h.d.split('/')[1]:''}</div><div class="zs-b"><b>${h.svc}</b><span>buổi ${h.ses} · ${h.tk}</span></div><div class="zs-amt">${h.amt}</div></div>`).join(''):'<div class="zhist-empty">Chưa có dữ liệu vùng này.</div>'}`;
}
window.bmapMode=bmapMode; window.selectZone=selectZone;
renderBmap(); renderZHist();
</script>
</body></html>
