<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Tiếp nhận khách</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.src-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.src{border:1.5px solid var(--line);border-radius:16px;padding:20px;background:#fff;cursor:pointer;transition:.16s}
.src:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.src.on{border-color:var(--teal);background:linear-gradient(140deg,#fff,var(--teal-soft))}
.src-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.src-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.src-ic svg{width:22px;height:22px}
.src h3{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
.src p{font-size:12.5px;color:var(--ink-soft)}
.queue-tk{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:#fff}
.qnum{width:46px;height:46px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px;flex:none}
.qnum.book{background:var(--teal)}.qnum.walk{background:var(--gold)}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('reception');
document.getElementById('main').innerHTML = topbar('Quy trình tiếp khách','Tiếp nhận khách — Lễ tân',{who:'LT',branch:'CN Quận 1'}) + `
  <div class="kpi-grid">
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div></div><div class="kpi-val">28</div><div class="kpi-lbl">Khách từ booking hôm nay</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div></div><div class="kpi-val">9</div><div class="kpi-lbl">Khách walk-in hôm nay</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-blush"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div></div><div class="kpi-val">04</div><div class="kpi-lbl">Đang chờ lấy số</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-indigo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v6l-3 3 3 3v6"/></svg></div></div><div class="kpi-val">3 TVV</div><div class="kpi-lbl">Tư vấn viên sẵn sàng</div></div>
  </div>

  <div class="row r-2">
    <div class="panel"><div class="panel-h"><div class="panel-title">Tiếp nhận khách mới<small>Chọn nguồn khách để bắt đầu</small></div></div>
      <div class="src-grid">
        <div class="src on" onclick="pickSrc(this,'book')"><div class="src-top"><div class="src-ic ic-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg></div><div><h3>Khách có booking</h3><p>Đã đặt lịch online / hotline</p></div></div></div>
        <div class="src" onclick="pickSrc(this,'walk')"><div class="src-top"><div class="src-ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 4v6l4 2M5 21l4-9 4 3 3-2"/><circle cx="13" cy="4" r="0"/></svg></div><div><h3>Khách walk-in</h3><p>Đến trực tiếp chi nhánh</p></div></div></div>
      </div>
      <div id="bookForm">
        <div class="field"><label>Tìm khách theo booking / SĐT / tên</label>
          <div style="display:flex;gap:8px"><input value="Trần Thu Hà · C-1042 · booking 10:00" style="flex:1" readonly><a class="btn btn-ghost" href="customer-detail.html" style="padding:9px 13px">Hồ sơ</a></div>
          <div style="font-size:11.5px;color:var(--rose);margin-top:5px">⚠ Dị ứng Lidocaine · không thích KTV nam · đã có gói triệt lông</div></div>
        <div class="field"><label>Dịch vụ đã đặt</label><input value="Giảm béo RF bụng · 10:00 · phòng Slim 1" readonly></div>
      </div>
      <div id="walkForm" style="display:none">
        <div class="row r-2e" style="margin:0 0 14px"><div class="field" style="margin:0"><label>Họ tên</label><input placeholder="Nhập tên khách mới"></div><div class="field" style="margin:0"><label>Số điện thoại</label><input placeholder="09xx xxx xxx"></div></div>
        <div class="row r-2e" style="margin:0 0 14px"><div class="field" style="margin:0"><label>Giới tính</label><select><option>Nữ</option><option>Nam</option></select></div><div class="field" style="margin:0"><label>Nguồn biết đến</label><select><option>Vãng lai</option><option>Giới thiệu</option><option>Mạng xã hội</option></select></div></div>
        <div class="field"><label>Nhu cầu ban đầu</label><input placeholder="VD: tư vấn giảm béo, triệt lông…"></div>
      </div>
      <div class="field"><label>Gán tư vấn viên</label><select><option>Tự động (cân bằng tải)</option><option>Quỳnh Trang (đang rảnh)</option><option>Thảo Nguyên</option></select></div>
      <div style="display:flex;gap:9px"><button class="btn btn-teal" style="flex:1;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Cấp số & chuyển tư vấn</button></div>
    </div>
    <div class="panel"><div class="panel-h"><div class="panel-title">Hàng đợi lấy số<small>Khách chờ vào tư vấn</small></div></div>
      <div class="queue-tk"><div class="qnum book">05</div><div style="flex:1"><b style="font-size:13.5px">Trần Thu Hà <span class="tag vip">VIP</span></b><div style="font-size:12px;color:var(--ink-soft)">Booking · Giảm béo RF · TVV Quỳnh Trang</div></div><span class="tag prog">Chờ tư vấn</span></div>
      <div class="queue-tk"><div class="qnum walk">06</div><div style="flex:1"><b style="font-size:13.5px">Khách walk-in <span class="tag new">Mới</span></b><div style="font-size:12px;color:var(--ink-soft)">Walk-in · tư vấn triệt lông · TVV Thảo Nguyên</div></div><span class="tag wait">Chờ</span></div>
      <div class="queue-tk"><div class="qnum book">07</div><div style="flex:1"><b style="font-size:13.5px">Ngô Khánh</b><div style="font-size:12px;color:var(--ink-soft)">Booking · yêu cầu gặp bác sĩ trước</div></div><span class="tag wait">Chờ</span></div>
      <div class="queue-tk"><div class="qnum walk">08</div><div style="flex:1"><b style="font-size:13.5px">Khách walk-in</b><div style="font-size:12px;color:var(--ink-soft)">Walk-in · hỏi giá dịch vụ</div></div><span class="tag wait">Chờ</span></div>
      <div class="alert al-info" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Số có tiền tố màu: <b style="color:var(--teal-deep)">xanh = booking</b>, <b style="color:var(--gold)">vàng = walk-in</b>. Sau khi cấp số, khách vào hàng chờ Tư vấn (xem Tracking flow).</div></div>
    </div>
  </div>`;
function pickSrc(el,type){
  document.querySelectorAll('.src').forEach(s=>s.classList.remove('on'));el.classList.add('on');
  document.getElementById('bookForm').style.display = type==='book'?'block':'none';
  document.getElementById('walkForm').style.display = type==='walk'?'block':'none';
}
wireUI();
</script>
</body></html>
