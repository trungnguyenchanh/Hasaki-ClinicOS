<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Tư vấn & pick thuốc</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.disp{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.med-card{border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;background:#fff}
.med-card.picked{border-color:var(--teal);background:linear-gradient(140deg,#fff,var(--teal-soft))}
.mc-top{display:flex;align-items:center;gap:11px}
.mc-chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;cursor:pointer}
.med-card.picked .mc-chk{background:var(--teal);border-color:var(--teal)}
.mc-top b{flex:1;font-size:14px}
.mc-sku{font-family:Consolas,monospace;font-size:11px;color:var(--ink-soft)}
.mc-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
.mc-detail .lbl{color:var(--ink-soft)}
.mc-explain{margin-top:9px;background:var(--teal-soft);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--teal-deep)}
.mc-explain b{display:block;margin-bottom:3px}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('pharmacy');
const right=`<a class="btn btn-ghost" href="encounter-summary.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Toa thuốc gốc</a><a class="btn btn-teal" href="service-ticket.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Chuyển Cashier tính tiền</a>`;
document.getElementById('main').innerHTML = topbar('Dược sĩ','Tư vấn & pick thuốc — Trần Thu Hà',{who:'DS',branch:'CN Quận 1',right}) + `
  <div class="alert al-info" style="margin-bottom:18px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Luồng: <b>Bác sĩ ra toa</b> → dược sĩ <b>giải thích cách dùng + pick thuốc theo toa</b> → chuyển Cashier tính tiền. Đơn liên thông QG-7741A.</div></div>
  <div class="disp">
    <div class="panel"><div class="panel-h"><div class="panel-title">Toa thuốc QG-7741A<small>BS. Bích Hằng · giải thích & soạn thuốc cho khách</small></div><span class="tag new">3 mục</span></div>
      <div class="med-card picked"><div class="mc-top"><div class="mc-chk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 6"/></svg></div><b>Kem phục hồi da (panthenol)</b><span class="mc-sku">MED-PAN-CR</span></div>
        <div class="mc-detail"><span><span class="lbl">Liều:</span> Bôi 2 lần/ngày</span><span><span class="lbl">SL:</span> 1 tuýp</span><span><span class="lbl">Số ngày:</span> 7</span><span><span class="lbl">Tồn kho:</span> ✓ đủ</span></div>
        <div class="mc-explain"><b>Giải thích cho khách:</b> Bôi lớp mỏng lên vùng điều trị sau khi rửa sạch, sáng và tối. Tránh vùng mắt.</div></div>
      <div class="med-card picked"><div class="mc-top"><div class="mc-chk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 6"/></svg></div><b>Vitamin C + E</b><span class="mc-sku">MED-VITCE</span></div>
        <div class="mc-detail"><span><span class="lbl">Liều:</span> 1 viên/ngày sau ăn</span><span><span class="lbl">SL:</span> 30 viên</span><span><span class="lbl">Số ngày:</span> 30</span><span><span class="lbl">Tồn kho:</span> ✓ đủ</span></div>
        <div class="mc-explain"><b>Giải thích cho khách:</b> Uống sau bữa sáng để hấp thu tốt, hỗ trợ phục hồi & chống oxy hóa.</div></div>
      <div class="med-card"><div class="mc-top"><div class="mc-chk"></div><b>Ibuprofen 400mg <span class="tag prog">Hết tại kho</span></b><span class="mc-sku">MED-IBU-400</span></div>
        <div class="mc-detail"><span><span class="lbl">Liều:</span> Khi đau, tối đa 3 lần/ngày</span><span><span class="lbl">SL:</span> 10 viên</span><span><span class="lbl">Số ngày:</span> —</span><span style="color:var(--rose)"><span class="lbl">Tồn kho:</span> ✕ hết</span></div>
        <div class="alert al-warn" style="margin-top:9px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3z"/></svg><div><b>Ghi chú bác sĩ:</b> khách mua ngoài theo đơn, hoặc thay Paracetamol 500mg. → Dược sĩ tư vấn khách.</div></div></div>
      <div class="alert al-info" style="margin-top:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Tick để xác nhận đã soạn (pick) thuốc. Thuốc hết kho không pick được — xử lý theo ghi chú bác sĩ.</div></div>
    </div>
    <div class="panel" style="position:sticky;top:20px"><div class="panel-h"><div class="panel-title">Tổng hợp soạn thuốc</div></div>
      <div class="cart-row"><div class="ci"><b>Kem phục hồi (panthenol)</b><span>1 tuýp</span></div><div class="cp">120.000đ</div></div>
      <div class="cart-row"><div class="ci"><b>Vitamin C + E</b><span>30 viên</span></div><div class="cp">285.000đ</div></div>
      <div class="cart-row" style="opacity:.5"><div class="ci"><b>Ibuprofen 400mg</b><span>Hết kho · không tính</span></div><div class="cp">—</div></div>
      <div class="sumline"><span>Thuốc đã soạn (2/3)</span><span>405.000đ</span></div>
      <div class="sumline total"><span>Tiền thuốc</span><span>405.000đ</span></div>
      <div class="field" style="margin-top:14px"><label>Ghi chú dược sĩ cho khách</label><textarea class="txta" style="width:100%;min-height:60px;font-family:inherit;font-size:13px;padding:11px;border:1px solid var(--line);border-radius:12px;outline:none" placeholder="Lưu ý bảo quản, tương tác…">Đã giải thích cách dùng. Khách tự mua Ibuprofen ngoài theo đơn.</textarea></div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:6px">
        <a class="btn btn-teal" href="service-ticket.html" style="width:100%;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Chuyển Cashier (tính tiền + thuốc)</a>
        <button class="btn btn-ghost" style="width:100%;justify-content:center">Lưu & in nhãn thuốc</button>
      </div>
    </div>
  </div>`;
// toggle pick
document.querySelectorAll('.mc-chk').forEach(c=>{ const card=c.closest('.med-card'); if(!card.querySelector('.al-warn')) c.onclick=()=>card.classList.toggle('picked'); });
wireUI();
</script>
</body></html>
