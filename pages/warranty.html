<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Bảo hành dịch vụ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ops-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.ops-card .oc-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ops-card .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.ops-card .oc-ic svg{width:17px;height:17px}
.ops-card .oc-t{font-weight:600;font-size:14px}
.ops-card .oc-big{font-family:'Fraunces',serif;font-size:32px;line-height:1;margin:2px 0}
.ops-card .oc-sub{font-size:11.5px;color:var(--ink-soft)}
.ops-card .oc-rows{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ops-card .ocr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ops-card .ocr b{font-family:'Fraunces',serif}
.ops-card .oc-link{margin-top:11px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ops-card.warn{border-color:#f0c9a8;background:linear-gradient(140deg,#fff,#fdeee3)}
.load-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.load-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}.load-bar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--teal-soft);color:var(--teal-deep)}.badge.busy{background:#fbeccb;color:#9a6a1e}.badge.over{background:#f4d3cb;color:#9a3b2c}
.subtab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.subtab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.subtab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.kpi-bar{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;min-width:90px}.kpi-bar i{display:block;height:100%;background:var(--teal)}
.num-strong{font-family:'Fraunces',serif;font-weight:600}
.role-chip{font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--bg-2);font-weight:500}
.kpi-big{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi-big .kb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi-big .kb .kv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.kpi-big .kb .kl{font-size:11.5px;color:var(--ink-soft)}
.kpi-big .kb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.kpi-big .kb.warn .kv{color:#9a5a1e}
.kpi-big .kb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.kpi-big .kb.good .kv{color:var(--teal-deep)}
.region-block{margin-bottom:22px}
.region-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.region-head .rg-ic{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.region-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0}
.region-head .rg-sum{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ov-table td{padding:10px;border-bottom:1px solid var(--line)}
.ov-table tr.clickable{cursor:pointer;transition:.12s}.ov-table tr.clickable:hover td{background:var(--teal-soft)}
.ov-cn{font-weight:600}.ov-cn small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut-c{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut-c b{font-family:'Fraunces',serif;font-size:17px;display:block}.donut-c span{font-size:10px;color:var(--ink-soft)}
.leg-list{display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.leg-row .dot{width:11px;height:11px;border-radius:3px;flex:none}.leg-row b{margin-left:auto;font-family:'Fraunces',serif}
.det-link{font-size:11.5px;font-weight:600;color:var(--teal-deep);text-decoration:none;white-space:nowrap}
.det-link:hover{text-decoration:underline}
.pill-tabs{display:flex;gap:4px;flex-wrap:wrap}
.pill-tabs button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:8px;cursor:pointer;color:var(--ink-soft)}
.pill-tabs button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.mk-mask{position:fixed;inset:0;background:rgba(35,30,28,.4);display:none;z-index:80;align-items:center;justify-content:center;padding:20px}
.mk-mask.on{display:flex}
.mk-box{background:#fff;border-radius:18px;width:min(460px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mk-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.mk-h b{font-family:'Fraunces',serif;font-size:17px}
.mk-x{margin-left:auto;border:none;background:var(--bg-2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink-soft)}
.mk-b{padding:16px 20px}
.mk-l{display:block;font-size:12px;font-weight:600;margin:12px 0 5px}.mk-l:first-child{margin-top:0}
.mk-i{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;background:#fff}
textarea.mk-i{resize:vertical}
.mk-note{font-size:11.5px;color:var(--ink-soft);margin-top:14px;padding:10px 12px;background:var(--bg-2);border-radius:10px;line-height:1.5}
.mk-f{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
@media(max-width:900px){.snap,.ops-grid,.kpi-big{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('warranty');
const right=`<button class="btn btn-teal" onclick="openCreate()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Tạo phiếu bảo hành</button>`;
document.getElementById('main').innerHTML = topbar('Nghiệp vụ','Bảo hành dịch vụ',{who:'CS',branch:'CN Quận 1',right}) + `
  <div class="snap">
    <div class="sb good"><div class="sl">Ca còn trong hạn BH</div><div class="sv">312</div><div class="sl">toàn CN</div></div>
    <div class="sb warn"><div class="sl">Yêu cầu chờ xử lý</div><div class="sv">5</div><div class="sl">cần duyệt</div></div>
    <div class="sb"><div class="sl">Đã làm lại MP (tháng)</div><div class="sv">18</div><div class="sl">miễn phí</div></div>
    <div class="sb warn"><div class="sl">Sắp hết hạn (7 ngày)</div><div class="sv">7</div><div class="sl">nhắc khách</div></div>
  </div>
  <div id="wv"></div>`;
const WV=document.getElementById('wv');

/* ===== Phiếu BH (tạo từ SKU hoặc gói — config thời hạn ở SKU dịch vụ) ===== */
const TICKETS=[
  {id:'BH-1042', cust:'Trần Thu Hà', cid:'C-1042', sku:'Triệt lông Diode toàn thân', src:'Gói PKG-LASER-8 · RC-0825', dv:'DV-0825', left:'còn 4 năm 8 tháng', issue:'Lông mọc lại vùng nách', st:'wait', stl:'Chờ duyệt'},
  {id:'BH-1039', cust:'Ngô Khánh', cid:'C-1136', sku:'Nâng cơ HIFU mặt', src:'SKU lẻ · RC-0836', dv:'DV-0836', left:'còn 4 tháng', issue:'Hiệu quả chưa rõ rệt', st:'wait', stl:'Chờ BS đánh giá'},
  {id:'BH-1035', cust:'Lê Minh', cid:'C-1080', sku:'Giảm béo RF bụng', src:'Gói PKG-RF-10 · RC-0830', dv:'DV-0830', left:'còn 1 tháng', issue:'Vùng eo chưa đạt', st:'done', stl:'Đã duyệt · đặt lịch'},
  {id:'BH-1028', cust:'Trần Thu Hà', cid:'C-1042', sku:'Điều trị mụn cốc', src:'SKU lẻ · RC-0812', dv:'DV-0812', left:'hết hạn 3 ngày trước', issue:'Mụn tái phát', st:'expired', stl:'Quá hạn'},
];
const stB={wait:'busy',done:'ok',expired:'over'};

function renderTickets(filter){
  let list=TICKETS;
  if(filter==='wait') list=TICKETS.filter(t=>t.st==='wait');
  else if(filter==='done') list=TICKETS.filter(t=>t.st==='done');
  else if(filter==='expired') list=TICKETS.filter(t=>t.st==='expired');
  WV.innerHTML=`<div class="panel" style="padding:6px 4px"><div class="panel-h" style="padding:12px 14px 4px"><div class="panel-title">Danh sách phiếu bảo hành — CN Quận 1<small>phiếu tạo từ SKU hoặc gói khách đã mua · thời hạn BH cấu hình trong SKU dịch vụ</small></div>
    <div class="pill-tabs" id="ft"><button class="on" onclick="ft('all')">Tất cả</button><button onclick="ft('wait')">Chờ xử lý</button><button onclick="ft('done')">Đã duyệt</button><button onclick="ft('expired')">Quá hạn</button></div></div>
  <table class="ov-table"><thead><tr><th>Phiếu BH</th><th>Khách</th><th>SKU bảo hành</th><th>Nguồn (gói/SKU · phiếu mua)</th><th>Còn hạn</th><th>Vấn đề</th><th>Trạng thái</th><th></th></tr></thead><tbody>
    ${list.map(t=>`<tr class="clickable" onclick="location.href='service-record.html?tk=${t.dv}'">
      <td><b style="font-family:Consolas,monospace;color:var(--teal-deep)">${t.id}</b></td><td>${t.cust}<span style="display:block;font-size:11px;color:var(--ink-soft)">${t.cid}</span></td><td>${t.sku}</td>
      <td><span style="font-size:11.5px">${t.src}</span></td><td>${t.st==='expired'?`<span style="color:var(--rose)">${t.left}</span>`:t.left}</td><td>${t.issue}</td>
      <td><span class="badge ${stB[t.st]}">${t.stl}</span></td>
      <td><a class="det-link" href="service-record.html?tk=${t.dv}" onclick="event.stopPropagation()">Chi tiết buổi DV →</a></td></tr>`).join('')}
  </tbody></table>
  <div class="alert al-info" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Mỗi phiếu BH gắn về <b>buổi dịch vụ gốc</b> (mở chi tiết để xem hồ sơ thực hiện). Phiếu duyệt → tạo buổi dịch vụ <b>miễn phí</b> (không trừ gói/ví). Thời hạn BH lấy theo cấu hình trong <a href="catalog-service-detail.html" style="color:var(--teal-deep)">SKU dịch vụ</a>.</div></div></div>`;
}
function ft(k){document.querySelectorAll('#ft button').forEach(b=>b.classList.remove('on'));document.querySelectorAll('#ft button')[{all:0,wait:1,done:2,expired:3}[k]].classList.add('on');renderTickets(k);}

/* ===== Popup tạo phiếu BH đơn giản ===== */
function openCreate(){
  const m=document.getElementById('mkMask');
  if(m){m.classList.add('on');return;}
  const div=document.createElement('div');
  div.innerHTML=`<div class="mk-mask on" id="mkMask" onclick="if(event.target===this)closeCreate()">
    <div class="mk-box">
      <div class="mk-h"><b>Tạo phiếu bảo hành</b><button class="mk-x" onclick="closeCreate()">✕</button></div>
      <div class="mk-b">
        <label class="mk-l">Khách hàng</label>
        <input class="mk-i" id="mkCust" placeholder="Tìm tên / mã KH (vd C-1042)...">
        <label class="mk-l">SKU / gói đã mua <span style="color:var(--ink-soft);font-weight:400">(chỉ hiện cái còn trong hạn BH)</span></label>
        <select class="mk-i" id="mkSku">
          <option>Triệt lông Diode toàn thân · Gói PKG-LASER-8 · còn 4 năm 8 tháng</option>
          <option>Nâng cơ HIFU mặt · SKU lẻ · còn 4 tháng</option>
          <option>Giảm béo RF bụng · Gói PKG-RF-10 · còn 1 tháng</option>
        </select>
        <label class="mk-l">Buổi dịch vụ gốc</label>
        <input class="mk-i" id="mkDv" placeholder="Mã buổi DV (vd DV-0825)" value="DV-0825">
        <label class="mk-l">Lý do bảo hành</label>
        <textarea class="mk-i" id="mkIssue" rows="2" placeholder="Mô tả vấn đề khách phản ánh..."></textarea>
        <div class="mk-note">Thời hạn BH tự lấy theo cấu hình SKU dịch vụ. Phiếu sau khi tạo ở trạng thái <b>Chờ duyệt</b>.</div>
      </div>
      <div class="mk-f"><button class="btn btn-ghost" onclick="closeCreate()">Huỷ</button><button class="btn btn-teal" onclick="submitCreate()">Tạo phiếu</button></div>
    </div></div>`;
  document.body.appendChild(div.firstElementChild);
}
function closeCreate(){const m=document.getElementById('mkMask');if(m)m.classList.remove('on');}
function submitCreate(){closeCreate();alert('Đã tạo phiếu bảo hành (Chờ duyệt) — gắn về buổi DV gốc. Demo tĩnh.');}
window.openCreate=openCreate; window.closeCreate=closeCreate; window.submitCreate=submitCreate; window.ft=ft;
renderTickets('all');
</script>
</body></html>
