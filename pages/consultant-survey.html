<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Quy trình tư vấn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.cs-head{background:linear-gradient(140deg,#fff,var(--teal-soft));border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cs-head .q-av{width:48px;height:48px;border-radius:14px;font-size:16px}
.stepper{display:flex;align-items:center;margin-bottom:18px}
.stp{display:flex;align-items:center;gap:9px}
.stp .sc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--ink-soft);flex:none;background:#fff}
.stp.on .sc,.stp.done .sc{background:var(--teal);border-color:var(--teal);color:#fff}
.stp .sl{font-size:13px;font-weight:600;color:var(--ink-soft)}.stp.on .sl{color:var(--ink)}
.stp-line{height:2px;flex:1;background:var(--line);margin:0 10px;min-width:24px}
.stp-line.done{background:var(--teal)}
/* bước 1 khảo sát wizard */
.survey-grid{display:grid;grid-template-columns:230px 1fr 260px;gap:16px;align-items:start}
.flow-map .fm-step{display:flex;align-items:center;gap:10px;padding:9px 0}
.flow-map .fm-n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-soft);flex:none}
.flow-map .fm-step.on .fm-n{border-color:var(--teal);color:var(--teal-deep)}
.flow-map .fm-step.done .fm-n{background:var(--teal);border-color:var(--teal);color:#fff}
.flow-map .fm-t b{font-size:12.5px;display:block}.flow-map .fm-t span{font-size:11px;color:var(--ink-soft)}
.qopt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:13px;margin-bottom:10px;cursor:pointer;transition:.14s}
.qopt:hover{border-color:var(--teal)}
.qopt.on{border-color:var(--teal);background:var(--teal-soft)}
.qopt .qo-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.qopt.on .qo-radio{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 40%,transparent 45%)}
.qopt b{flex:1;font-size:14px}
.qopt .qo-branch{font-size:11.5px;color:var(--ink-soft);font-style:italic}
.summ .su-row{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--bg-2)}
.summ .su-row:last-child{border:none}.summ .su-row b{display:block;color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.flag-med{background:#f9e6e6;color:#a64b4b;border-radius:9px;padding:9px 12px;font-size:12px;margin-top:9px;display:none}
.flag-med.show{display:block}
.sugg-row{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px}
.sugg-row .sr-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.sugg-row .sr-name{flex:1}.sugg-row .sr-name b{font-size:13.5px}.sugg-row .sr-name span{font-size:11.5px;color:var(--ink-soft)}
.sugg-row .sr-price{font-family:'Fraunces',serif;font-weight:600}
.attr-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.attr-row:last-child{border:none}.attr-row .ar-pct{margin-left:auto;font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--teal-deep)}
@media(max-width:1000px){.survey-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('consultant');
let step=1;
const right=`<a class="btn btn-ghost" href="consultant.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>B\u00e0n c\u1ee7a t\u00f4i</a>`;
document.getElementById('main').innerHTML = topbar('T\u01b0 v\u1ea5n \u203a Quy tr\u00ecnh t\u01b0 v\u1ea5n','\u0110ang t\u01b0 v\u1ea5n \u2014 Tr\u1ea7n Thu H\u00e0',{who:'QT',branch:'CN Qu\u1eadn 1',right}) + `
  <div class="cs-head"><div class="q-av av-teal">TH</div>
    <div style="flex:1;min-width:200px"><div style="font-family:Fraunces,serif;font-size:18px;font-weight:600">Tr\u1ea7n Thu H\u00e0 <span class="tag vip">VIP</span></div>
      <div style="font-size:12.5px;color:var(--ink-soft)">C-1042 \u00b7 S\u0110T <b>${maskPhone('0908123456')}</b> \u00b7 Phi\u1ebfu t\u01b0 v\u1ea5n <b>TV-0825</b></div>
      <div style="font-size:11px;color:var(--ink-soft);font-family:Consolas,monospace;margin-top:3px">Lu\u1ed3ng: BK-0825 \u2192 <b>TV-0825</b> \u2192 KH-0825 \u2192 RC-0825 \u2192 DV-0825</div></div>
    <span class="tag" style="background:var(--teal-soft);color:var(--teal-deep)">\u0110ang t\u01b0 v\u1ea5n \u00b7 lock c\u1ee7a b\u1ea1n</span>
  </div>
  <div class="stepper" id="stepper"></div>
  <div id="stepBody"></div>`;

function renderStepper(){
  document.getElementById('stepper').innerHTML=`
    <div class="stp ${step>=1?(step>1?'done':'on'):''}"><div class="sc">${step>1?'\u2713':'1'}</div><div class="sl">Kh\u1ea3o s\u00e1t nhu c\u1ea7u</div></div>
    <div class="stp-line ${step>1?'done':''}"></div>
    <div class="stp ${step>=2?(step>2?'done':'on'):''}"><div class="sc">${step>2?'\u2713':'2'}</div><div class="sl">Ch\u1ed1t d\u1ecbch v\u1ee5</div></div>
    <div class="stp-line ${step>2?'done':''}"></div>
    <div class="stp ${step>=3?'on':''}"><div class="sc">3</div><div class="sl">Chuy\u1ec3n Cashier / b\u00e1c s\u0129</div></div>`;
}

function renderStep(){
  renderStepper();
  const b=document.getElementById('stepBody');
  if(step===1){
    b.innerHTML=`
    <div class="survey-grid">
      <div class="panel flow-map"><div class="panel-title" style="font-size:14px;margin-bottom:8px">S\u01a1 \u0111\u1ed3 lu\u1ed3ng c\u00e2u h\u1ecfi</div>
        <div class="fm-step done"><div class="fm-n">\u2713</div><div class="fm-t"><b>M\u1ee5c ti\u00eau</b><span>nh\u00f3m d\u1ecbch v\u1ee5</span></div></div>
        <div class="fm-step on"><div class="fm-n">2</div><div class="fm-t"><b>C\u01a1 \u0111\u1ecba / v\u00f9ng</b><span>\u0111ang tr\u1ea3 l\u1eddi\u2026</span></div></div>
        <div class="fm-step"><div class="fm-n">3</div><div class="fm-t"><b>Ti\u1ec1n s\u1eed y t\u1ebf</b><span>s\u00e0ng l\u1ecdc</span></div></div>
        <div class="fm-step"><div class="fm-n">4</div><div class="fm-t"><b>Ng\u00e2n s\u00e1ch</b><span>kho\u1ea3ng gi\u00e1</span></div></div>
        <div class="fm-step"><div class="fm-n">5</div><div class="fm-t"><b>Th\u1eddi gian</b><span>l\u1ecbch mong mu\u1ed1n</span></div></div>
      </div>
      <div class="panel"><div style="font-size:12px;font-weight:600;color:var(--teal-deep);letter-spacing:.5px">C\u00c2U 1/5</div>
        <div style="font-family:Fraunces,serif;font-size:22px;font-weight:600;margin:4px 0 4px">Kh\u00e1ch quan t\u00e2m nh\u00f3m d\u1ecbch v\u1ee5 n\u00e0o nh\u1ea5t?</div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px">Quy\u1ebft \u0111\u1ecbnh nh\u00e1nh c\u00e2u h\u1ecfi ti\u1ebfp theo.</div>
        <div class="qopt on" onclick="selOpt(this)"><span class="qo-radio"></span><b>Gi\u1ea3m b\u00e9o / \u0111\u1ecbnh h\u00ecnh</b><span class="qo-branch">\u2192 h\u1ecfi v\u00f9ng</span></div>
        <div class="qopt" onclick="selOpt(this)"><span class="qo-radio"></span><b>Tri\u1ec7t l\u00f4ng</b><span class="qo-branch">\u2192 h\u1ecfi c\u01a1 \u0111\u1ecba da</span></div>
        <div class="qopt" onclick="selOpt(this)"><span class="qo-radio"></span><b>Ch\u0103m s\u00f3c da / tr\u1ebb h\u00f3a</b><span class="qo-branch">\u2192 h\u1ecfi c\u01a1 \u0111\u1ecba da</span></div>
        <div class="qopt" onclick="selOpt(this)"><span class="qo-radio"></span><b>Derma & Hair (t\u00f3c)</b><span class="qo-branch">\u2192 h\u1ecfi ng\u00e2n s\u00e1ch</span></div>
        <div class="flag-med"><b>\u26a0 C\u1edd y t\u1ebf:</b> n\u1ebfu c\u00f3 ti\u1ec1n s\u1eed d\u1ecb \u1ee9ng/thai s\u1ea3n \u2192 c\u1ea7n b\u00e1c s\u0129 duy\u1ec7t.</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><button class="btn btn-ghost" disabled style="opacity:.5">\u2190 Quay l\u1ea1i</button><button class="btn btn-teal" onclick="step=2;renderStep()">C\u00e2u ti\u1ebfp \u2192</button></div>
      </div>
      <div class="panel summ"><div class="panel-title" style="font-size:14px;margin-bottom:8px">T\u1ed5ng h\u1ee3p kh\u1ea3o s\u00e1t</div>
        <div class="su-row"><b>M\u1ee5c ti\u00eau</b>Gi\u1ea3m b\u00e9o / \u0111\u1ecbnh h\u00ecnh</div>
        <div class="su-row" style="color:var(--ink-soft)">C\u00e1c c\u00e2u sau s\u1ebd hi\u1ec7n \u1edf \u0111\u00e2y khi tr\u1ea3 l\u1eddi.</div>
      </div>
    </div>`;
  } else if(step===2){
    b.innerHTML=`
    <div class="panel"><div class="panel-h"><div class="panel-title">B\u01b0\u1edbc 2 \u00b7 Ch\u1ed1t d\u1ecbch v\u1ee5 cho kh\u00e1ch<small>D\u1ef1a tr\u00ean k\u1ebft qu\u1ea3 kh\u1ea3o s\u00e1t</small></div></div>
      <div class="sugg-row"><div class="sr-ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4 8 4 8-4z"/><path d="M4 7v10l8 4 8-4V7"/></svg></div><div class="sr-name"><b>G\u00f3i gi\u1ea3m b\u00e9o RF \u00b7 10 bu\u1ed5i</b><span>Ph\u00f9 h\u1ee3p m\u1ee5c ti\u00eau gi\u1ea3m m\u1ee1 b\u1ee5ng</span></div><div class="sr-price">18.000.000\u0111</div></div>
      <div class="sugg-row"><div class="sr-ic ic-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg></div><div class="sr-name"><b>Ch\u0103m s\u00f3c da ph\u1ee5c h\u1ed3i \u00b7 3 bu\u1ed5i</b><span>B\u00e1n k\u00e8m</span></div><div class="sr-price">2.400.000\u0111</div></div>
      <div class="sugg-row"><div class="sr-ic ic-rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h12l-1 7H7zM7 9v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9"/></svg></div><div class="sr-name"><b>Serum d\u01b0\u1ee1ng ph\u1ee5c h\u1ed3i</b><span>S\u1ea3n ph\u1ea9m \u00b7 KM -15%</span></div><div class="sr-price">680.000\u0111</div></div>
      <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Th\u00eam d\u1ecbch v\u1ee5 / s\u1ea3n ph\u1ea9m</button>
      <div class="sumline total" style="margin-top:12px"><span>T\u1ed5ng ch\u1ed1t</span><span>21.080.000\u0111</span></div>
      <div class="alert al-warn" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8M9 7V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v3M3 7h18"/></svg><div><b>Quy t\u1eafc ch\u1ed1t:</b> sau khi ch\u1ed1t & ra receipt, ch\u1ec9 \u0111\u01b0\u1ee3c <b>TH\u00caM</b>, kh\u00f4ng s\u1eeda/x\u00f3a SKU \u0111\u00e3 ch\u1ed1t \u2014 \u0111\u1ec3 KPI ch\u00ednh x\u00e1c.</div></div>
      <div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn btn-ghost" onclick="step=1;renderStep()">\u2190 Quay l\u1ea1i kh\u1ea3o s\u00e1t</button><button class="btn btn-teal" onclick="step=3;renderStep()">Ch\u1ed1t \u2192 b\u01b0\u1edbc chuy\u1ec3n</button></div>
    </div>`;
  } else {
    b.innerHTML=`
    <div class="row r-2">
      <div class="panel"><div class="panel-h"><div class="panel-title">B\u01b0\u1edbc 3 \u00b7 Chuy\u1ec3n ti\u1ebfp<small>Sau khi ch\u1ed1t d\u1ecbch v\u1ee5</small></div></div>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px">\u0110\u00e3 ch\u1ed1t <b>21.080.000\u0111</b>. Ch\u1ecdn lu\u1ed3ng ti\u1ebfp theo cho kh\u00e1ch:</div>
        <a class="btn btn-teal" href="service-ticket.html" style="width:100%;justify-content:center;margin-bottom:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Chuy\u1ec3n Cashier (thu ti\u1ec1n & k\u00edch ho\u1ea1t)</a>
        <a class="btn btn-ghost" href="doctor-cn.html" style="width:100%;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/></svg>C\u1ea7n g\u1eb7p b\u00e1c s\u0129 (c\u00f3 c\u1edd y t\u1ebf)</a>
        <div class="alert al-info" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Ph\u00e1t sinh c\u1ea7n t\u01b0 v\u1ea5n th\u00eam sau khi chuy\u1ec3n Cashier? Cashier b\u1ea5m "Tr\u1ea3 l\u1ea1i t\u01b0 v\u1ea5n" \u2014 kh\u00e1ch quay l\u1ea1i, gi\u1eef owner & l\u1ecbch s\u1eed.</div></div>
        <button class="btn btn-ghost" onclick="step=2;renderStep()" style="margin-top:12px">\u2190 Quay l\u1ea1i ch\u1ed1t d\u1ecbch v\u1ee5</button>
      </div>
      <div class="panel"><div class="panel-h"><div class="panel-title">Quy t\u1eafc ghi c\u00f4ng (attribution)</div></div>
        <div class="attr-row"><div class="q-av av-blush" style="width:36px;height:36px;font-size:12px">QT</div><div><b style="font-size:13.5px">Qu\u1ef3nh Trang (closer)</b><div style="font-size:12px;color:var(--ink-soft)">Ng\u01b0\u1eddi ch\u1ed1t \u0111\u01a1n n\u00e0y</div></div><span class="ar-pct">70%</span></div>
        <div class="attr-row"><div class="q-av av-blush" style="width:36px;height:36px;font-size:12px">QT</div><div><b style="font-size:13.5px">Qu\u1ef3nh Trang (owner)</b><div style="font-size:12px;color:var(--ink-soft)">\u0110ang l\u00e0 owner c\u1ee7a kh\u00e1ch</div></div><span class="ar-pct">30%</span></div>
        <div class="alert al-info" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Khi owner v\u00e0 closer kh\u00e1c nhau, h\u1ec7 th\u1ed1ng chia c\u00f4ng theo c\u1ea5u h\u00ecnh (vd 30/70) \u0111\u1ec3 KPI & hoa h\u1ed3ng minh b\u1ea1ch.</div></div>
      </div>
    </div>`;
  }
  wireUI();
}
function selOpt(el){el.parentElement.querySelectorAll('.qopt').forEach(o=>o.classList.remove('on'));el.classList.add('on');}
renderStep();
</script>
</body></html>
