<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Chi tiết khách</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.profile-head{display:flex;gap:20px;align-items:center;background:linear-gradient(140deg,#fff,var(--teal-soft));border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);margin-bottom:18px;animation:rise .5s both;flex-wrap:wrap}
.profile-head .q-av{width:74px;height:74px;border-radius:22px;font-size:26px}
.ph-name{font-family:'Fraunces',serif;font-size:27px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-meta{color:var(--ink-soft);font-size:13.5px;margin-top:4px}
.ph-stats{margin-left:auto;display:flex;gap:24px;text-align:center}
.ph-stats .s b{font-family:'Fraunces',serif;font-size:21px;display:block}
.ph-stats .s span{font-size:12px;color:var(--ink-soft)}
.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.today-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:18px}
.today-status{background:linear-gradient(140deg,var(--teal-deep),var(--teal));color:#fff;border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.today-status.absent{background:linear-gradient(140deg,#7a8a86,#6b7a76)}
.ts-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ts-top .ts-dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ts-top b{font-size:15px}
.ts-flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.ts-node{font-size:10.5px;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.15);font-weight:500}
.ts-node.done{background:rgba(255,255,255,.3)}
.ts-node.cur{background:#fff;color:var(--teal-deep);font-weight:600}
.ts-next{background:rgba(255,255,255,.15);border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:11px}
.ts-next .nb-ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.ts-next .nb-ic svg{width:18px;height:18px}
.ts-next b{font-size:13.5px;display:block}.ts-next span{font-size:11.5px;opacity:.9}
.remind{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;display:flex;gap:11px;align-items:flex-start}
.remind .r-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.remind .r-ic svg{width:17px;height:17px}
.remind b{font-size:13px;display:block}.remind span{font-size:12px;color:var(--ink-soft)}
.remind.late{border-color:#e9b3b3;background:#fdf4f4}
@media(max-width:900px){.today-grid{grid-template-columns:1fr}}
.dtabs button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:13px;font-weight:500;padding:8px 15px;border-radius:30px;cursor:pointer;color:var(--ink-soft)}
.dtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
.tl-item.warn .tl-dot{border-color:var(--amber)}.tl-item.blush .tl-dot{border-color:var(--blush-deep)}
.tl-time{font-size:12px;color:var(--ink-soft)}.tl-item b{font-size:14px;display:block;margin:2px 0}.tl-item span{font-size:12.5px;color:var(--ink-soft)}
.note-row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.note-row:last-child{border:none}.note-row .q-av{width:30px;height:30px;font-size:11px}
.cflag-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cflag{border:1px solid var(--line);border-radius:13px;padding:14px}
.cflag b{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:8px}
.chip{display:inline-block;font-size:12px;padding:4px 11px;border-radius:20px;margin:0 5px 5px 0;font-weight:500}
.chip.warn{background:#fdf3e3;color:#9a6a1e}.chip.rose{background:#f9e6e6;color:#a64b4b}.chip.teal{background:var(--teal-soft);color:var(--teal-deep)}.chip.grey{background:var(--bg);color:var(--ink-soft)}
.stars{color:var(--gold);font-size:14px}
.vou{display:flex;align-items:center;gap:13px;padding:13px;border:1px dashed var(--blush-deep);border-radius:13px;margin-bottom:10px;background:#fdf6f3}
.vou .vc{font-family:'Fraunces',serif;font-weight:600;font-size:14px;background:var(--blush-deep);color:#fff;padding:6px 11px;border-radius:9px;flex:none}
.vou .vi{flex:1}.vou .vi b{font-size:13.5px;display:block}.vou .vi span{font-size:12px;color:var(--ink-soft)}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script>

const right=`<a class="btn btn-ghost" href="${linkFor('flow-tracking.html')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Hành trình hôm nay</a><a class="btn btn-ghost" href="${linkFor('customer-treatment-record.html')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Hồ sơ điều trị</a><a class="btn btn-ghost" href="warranty.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Bảo hành</a><button class="btn btn-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 2v4M8 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Đặt lịch</button>`;

function dtab(k){document.querySelectorAll('#dt button').forEach(b=>b.classList.remove('on'));event&&event.target&&event.target.classList.add('on');DV.innerHTML=TABS[k];wireUI();}
