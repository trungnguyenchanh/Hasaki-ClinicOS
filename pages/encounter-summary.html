<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Tổng kết lần khám</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.summary-doc{max-width:840px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;animation:rise .5s both}
.sd-head{background:linear-gradient(140deg,var(--teal-deep),var(--teal));color:#fff;padding:24px 30px}
.sd-head h2{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
.sd-head .sub{opacity:.9;font-size:13px;margin-top:3px}
.sd-body{padding:26px 30px}
.sd-sec{margin-bottom:22px}
.sd-sec h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--teal-deep);font-weight:600;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sd-grid{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;font-size:14px}
.sd-grid dt{color:var(--ink-soft)}.sd-grid dd{margin:0}
.icd{display:inline-block;font-size:11px;font-family:Consolas,monospace;background:var(--indigo-soft);color:var(--indigo);padding:2px 7px;border-radius:6px;margin-right:6px}
.rx-tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.rx-tbl th{background:var(--bg-2);text-align:left;padding:8px 11px;font-size:11px;text-transform:uppercase;color:var(--ink-soft)}
.rx-tbl td{padding:9px 11px;border-top:1px solid var(--line)}
.sd-foot{display:flex;justify-content:space-between;align-items:center;padding:18px 30px;border-top:1px solid var(--line);background:var(--bg-2)}
.sign{text-align:center}.sign b{font-family:'Fraunces',serif;font-size:15px;display:block}.sign span{font-size:11px;color:var(--ink-soft)}
.actions-top{max-width:840px;margin:0 auto 16px;display:flex;gap:9px;justify-content:flex-end}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('doctor');
document.getElementById('main').innerHTML = topbar('Bác sĩ › Tổng kết khám','Phiếu tổng kết lần khám',{who:'BH',branch:'CN Quận 1'}) + `

      <div class="sign"><b>BS. Bích Hằng</b><span>Bác sĩ điều trị · đã ký điện tử</span></div>
    </div>
  </div>`;
wireUI();

</body></html>
