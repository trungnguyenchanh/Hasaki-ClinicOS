<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Dashboard vận hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
.ops-snap{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.ops-snap .sb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.ops-snap .sv{font-family:'Fraunces',serif;font-size:25px;line-height:1;margin:5px 0 2px}
.ops-snap .sl{font-size:11px;color:var(--ink-soft)}
.ops-snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.ops-snap .sb.warn .sv{color:#9a5a1e}
.ops-snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.ops-snap .sb.good .sv{color:var(--teal-deep)}
.ops-snap .sb.rose{background:linear-gradient(140deg,#fff,#f7dcd5);border-color:#e8b3a8}.ops-snap .sb.rose .sv{color:#9a3b2c}
.flow-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}
.lcard{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.lcard-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.lcard-h .lh-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--teal-soft);color:var(--teal-deep)}
.lcard-h .lh-ic svg{width:16px;height:16px}
.lcard-h b{font-size:14px}
.lcard-h .lh-cnt{margin-left:auto;font-family:'Fraunces',serif;font-size:18px;font-weight:600}
.lcard-h .lh-link{font-size:11.5px;color:var(--teal-deep);text-decoration:none;font-weight:600}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.lrow:last-child{border:none}
.lrow .num{width:26px;height:26px;border-radius:7px;background:var(--bg-2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.lrow .nm{flex:1;min-width:0}.lrow .nm b{font-weight:600}.lrow .nm span{display:block;font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .rt{text-align:right;white-space:nowrap;font-size:11.5px}
.mini-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.mb-wait{background:var(--bg-2);color:var(--ink-soft)}.mb-go{background:var(--teal-soft);color:var(--teal-deep)}.mb-warn{background:#fbeccb;color:#9a6a1e}.mb-over{background:#f4d3cb;color:#9a3b2c}
.alert-card{border:1px solid #f0c9a8;border-radius:16px;background:linear-gradient(160deg,#fff,#fdf2ea);overflow:hidden}
.alert-card .ac-h{padding:14px 16px;border-bottom:1px solid #f0d6bf;display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:#9a5a1e}
.arow{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid #f3e2d3;font-size:12.5px}
.arow:last-child{border:none}
.arow .ai{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.ai.red{background:#f4d3cb;color:#9a3b2c}.ai.amber{background:#fbeccb;color:#9a6a1e}
.arow .at{flex:1}.arow .at b{font-weight:600}.arow .at span{display:block;font-size:11px;color:var(--ink-soft)}
.arow .aa{font-size:11px;color:var(--teal-deep);font-weight:600;text-decoration:none;white-space:nowrap}
@media(max-width:1000px){.ops-snap{grid-template-columns:repeat(2,1fr)}.flow-cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="assets/app.js"></script>
<script>
renderLayout('dashboard',{fromRoot:true});
const _now=new Date();
const _hh=String(_now.getHours()).padStart(2,'0'), _mm=String(_now.getMinutes()).padStart(2,'0');
const _dd=String(_now.getDate()).padStart(2,'0'), _mo=String(_now.getMonth()+1).padStart(2,'0');
const right=`<div class="tenant" style="background:var(--teal-soft);color:var(--teal-deep);border-color:transparent"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal-deep);display:inline-block"></span> Cập nhật lần cuối ${_hh}:${_mm} · ${_dd}/${_mo} <span style="opacity:.7;font-weight:400">· tự làm mới 30s</span></div>`;
document.getElementById('main').innerHTML = topbar('Tổng quan vận hành','Bảng điều hành · CN Quận 1',{who:'MA',branch:'CN Quận 1',right}) + `
  <div class="ops-snap">
    <div class="sb"><div class="sl">Booking chờ tới lượt</div><div class="sv">9</div><div class="sl">đã lấy số</div></div>
    <div class="sb"><div class="sl">Chờ / đang tư vấn · khám</div><div class="sv">7</div><div class="sl">2 chờ khám</div></div>
    <div class="sb good"><div class="sl">Đang làm dịch vụ</div><div class="sv">5</div><div class="sl">2 sắp xong</div></div>
    <div class="sb rose"><div class="sl">Phiếu tính tiền treo</div><div class="sv">3</div><div class="sl">còn nợ</div></div>
    <div class="sb warn"><div class="sl">Cảnh báo bất thường</div><div class="sv">6</div><div class="sl">stock · date · máy</div></div>
  </div>

  <div class="flow-cols">
    <!-- 1. Booking chờ lấy số -->
    <div class="lcard"><div class="lcard-h"><div class="lh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><b>Booking · chờ tới lượt</b><span class="lh-cnt">9</span></div>
      <div id="l1"></div>
      <div style="padding:9px 16px;text-align:center"><a class="lh-link" href="pages/flow-queue.html">Xem hàng đợi đầy đủ →</a></div>
    </div>
    <!-- 2. Chờ/đang tư vấn - chờ/đang khám -->
    <div class="lcard"><div class="lcard-h"><div class="lh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><b>Tư vấn & khám</b><span class="lh-cnt">7</span></div>
      <div id="l2"></div>
      <div style="padding:9px 16px;text-align:center"><a class="lh-link" href="pages/flow-inservice.html">Xem chi tiết →</a></div>
    </div>
    <!-- 3. Đang làm dịch vụ - sắp xong -->
    <div class="lcard"><div class="lcard-h"><div class="lh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4 8 4 8-4z"/><path d="M4 7v10l8 4 8-4V7"/></svg></div><b>Đang làm dịch vụ</b><span class="lh-cnt">5</span></div>
      <div id="l3"></div>
      <div style="padding:9px 16px;text-align:center"><a class="lh-link" href="pages/flow-inservice.html">Xem đang phục vụ →</a></div>
    </div>
    <!-- 4. Phiếu tính tiền dở - treo nợ -->
    <div class="lcard"><div class="lcard-h"><div class="lh-ic" style="background:#f7dcd5;color:#9a3b2c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div><b>Phiếu tính tiền dở · treo nợ</b><span class="lh-cnt">3</span></div>
      <div id="l4"></div>
      <div style="padding:9px 16px;text-align:center"><a class="lh-link" href="pages/cashier.html">Mở thu ngân →</a></div>
    </div>
  </div>

  <!-- Cảnh báo bất thường -->
  <div class="alert-card"><div class="ac-h"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3z"/></svg>Cảnh báo bất thường — cần xử lý</div>
    <div id="alerts"></div>
  </div>`;

// ===== Dữ liệu danh sách rút gọn =====
const L1=[ // booking chờ lấy số
  {no:'A12', nm:'Trần Thu Hà', sv:'Giảm béo RF · hẹn 10:00', vip:true, st:['mb-go','Sắp gọi']},
  {no:'A13', nm:'Lê Minh', sv:'Triệt lông · hẹn 10:15', st:['mb-wait','Chờ 8p']},
  {no:'A14', nm:'Khách lẻ', sv:'Tư vấn gói · walk-in', st:['mb-wait','Chờ 12p']},
  {no:'A15', nm:'Ngô Khánh', sv:'Phục hồi tóc · hẹn 10:30', st:['mb-wait','Chờ 16p']},
];
const L2=[ // chờ/đang tư vấn - khám
  {no:'TV', nm:'Khách lẻ #A', sv:'Đang tư vấn · Quỳnh Trang', st:['mb-go','Đang TV']},
  {no:'TV', nm:'Ngô Khánh', sv:'Chờ tư vấn · 9p', st:['mb-wait','Chờ TV']},
  {no:'KH', nm:'Trần Thu Hà', sv:'Đang khám · BS. Bích Hằng', st:['mb-go','Đang khám']},
  {no:'KH', nm:'Khách lẻ #B', sv:'Chờ bác sĩ · 14p', st:['mb-warn','Chờ khám']},
];
const L3=[ // đang làm dịch vụ - sắp xong
  {no:'P1', nm:'Trần Thu Hà', sv:'RF bụng · Hồng Trang', st:['mb-warn','Sắp xong 5p']},
  {no:'P2', nm:'Lê Minh', sv:'Triệt lông lưng · Thanh Mai', st:['mb-go','Còn 20p']},
  {no:'P3', nm:'Khách lẻ #C', sv:'Chăm sóc da · Ngọc Linh', st:['mb-warn','Sắp xong 8p']},
  {no:'P4', nm:'Khách lẻ #D', sv:'Massage · Mai Linh', st:['mb-go','Còn 25p']},
];
const L4=[ // phiếu tính tiền dở - treo nợ
  {no:'RC', nm:'Trần Thu Hà', sv:'RC-0825 · đã trả 1 phần', amt:'còn 1,2tr', st:['mb-over','Treo nợ']},
  {no:'RC', nm:'Lê Minh', sv:'RC-0830 · chờ thanh toán', amt:'2,9tr', st:['mb-warn','Chưa trả']},
  {no:'RC', nm:'Khách lẻ #E', sv:'RC-0841 · giữ chờ ví', amt:'650k', st:['mb-warn','Tạm giữ']},
];
function fill(id,list,withAmt){
  document.getElementById(id).innerHTML = list.map(r=>`<div class="lrow">
    <span class="num">${r.no}</span>
    <div class="nm"><b>${r.nm}</b> ${r.vip?'<span class="mini-badge mb-over" style="background:#fbeccb;color:#9a6a1e">VIP</span>':''}<span>${r.sv}</span></div>
    <div class="rt">${withAmt?`<b style="font-family:'Fraunces',serif">${r.amt}</b><br>`:''}<span class="mini-badge ${r.st[0]}">${r.st[1]}</span></div>
  </div>`).join('');
}
fill('l1',L1); fill('l2',L2); fill('l3',L3); fill('l4',L4,true);

// ===== Cảnh báo bất thường: stock hết / cận date / máy bảo trì =====
const ALERTS=[
  {ic:'red', t:'Hết hàng: Tinh chất trị mụn (SP-ACN-20)', s:'Tồn 18 < định mức 40 · ảnh hưởng dịch vụ điều trị mụn', a:'Mở kho →', href:'pages/inventory-products.html'},
  {ic:'red', t:'NVL gần hết: Serum vitamin C (NVL-VITC-30)', s:'Còn 5 lọ · 11 buổi hôm nay cần dùng', a:'Chuyển kho →', href:'pages/inventory-transfer.html'},
  {ic:'amber', t:'Cận hạn dùng: Mặt nạ dưỡng ẩm', s:'HSD 03/2026 · tồn cao, đẩy bán gấp', a:'Xem SP →', href:'pages/inventory-products.html'},
  {ic:'amber', t:'Cận hạn: Kem dưỡng ẩm ban đêm', s:'HSD 04/2026 · còn 22 tuýp', a:'Xem SP →', href:'pages/inventory-products.html'},
  {ic:'red', t:'Máy HIFU đến hạn bảo trì', s:'Quá 180h hoạt động · cần kiểm định trước khi dùng tiếp', a:'Lịch bảo trì →', href:'pages/catalog-machine.html'},
  {ic:'amber', t:'Máy RF Slim sắp đến hạn bảo hành', s:'Còn 12 ngày · liên hệ NCC gia hạn', a:'Xem máy →', href:'pages/catalog-machine.html'},
];
document.getElementById('alerts').innerHTML = ALERTS.map(al=>`<div class="arow">
  <span class="ai ${al.ic}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">${al.ic==='red'?'<path d="M18 6 6 18M6 6l12 12"/>':'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3z"/>'}</svg></span>
  <div class="at"><b>${al.t}</b><span>${al.s}</span></div>
  <a class="aa" href="${al.href}">${al.a}</a>
</div>`).join('');
</script>
</body>
</html>
