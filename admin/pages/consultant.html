<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Bàn tư vấn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.active-banner{display:flex;align-items:center;gap:13px;padding:14px 18px;border-radius:14px;margin-bottom:18px;background:linear-gradient(120deg,var(--teal-deep),var(--teal));color:#fff}
.active-banner.empty{background:var(--bg-2);color:var(--ink-soft);border:1px dashed var(--line)}
.active-banner .ab-av{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.active-banner .ab-info{flex:1}.active-banner .ab-info b{font-size:16px}.active-banner .ab-info span{font-size:12.5px;opacity:.9;display:block}
.sla{text-align:center;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 14px;min-width:96px}
.sla b{font-family:'Fraunces',serif;font-size:22px;display:block;line-height:1}.sla.over b{color:#ffd9d0}
.sla span{font-size:10px;opacity:.85;letter-spacing:.4px}
.ab-close{border:none;background:#fff;color:var(--teal-deep);font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13.5px;white-space:nowrap}
.sla-warn{background:#fdf3e3;border:1px solid #f0d9a8;color:#9a6a1e;border-radius:12px;padding:11px 14px;font-size:12.5px;display:flex;gap:9px;align-items:center;margin-bottom:16px}
.sla-warn svg{width:18px;height:18px;flex:none}
.lock-msg{font-size:11px;color:var(--rose);font-weight:600;margin-top:7px;display:flex;align-items:center;gap:5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.next-claim{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px dashed var(--teal);border-radius:14px;background:var(--teal-soft)}
.next-claim .nc-left{flex:1;display:flex;align-items:center;gap:14px}
.next-claim .nc-icon{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--teal-deep);flex:none}
.next-claim .nc-icon svg{width:24px;height:24px}
.next-claim .nc-count{font-size:15px}.next-claim .nc-count b{font-family:'Fraunces',serif;font-size:22px;color:var(--teal-deep)}
.next-claim .nc-sub{font-size:12px;color:var(--ink-soft);margin-top:3px;max-width:430px}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script>
renderLayout('consultant');
const right = `<a class="btn btn-teal" href="consultant-survey.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Mở trang tư vấn khách</a>`;

const SLA_WARN = 20;
let active = { name:'Trần Thu Hà', id:'C-1042', init:'TH', av:'av-teal', vip:true, svc:'Tư vấn gói giảm béo', heldMin:14 };
let cooldownSec = 0;
const owned = [
  { name:'Lê Minh', id:'C-1080', sub:'owner đến 12/08 · triệt lông' },
  { name:'Đỗ Lan', id:'C-0875', sub:'owner đến 30/07 · chăm sóc da' },
  { name:'Phạm Yến', id:'C-0810', sub:'owner đến 05/09 · derma hair' },
];
let waitQueue = [
  { name:'Ngô Khánh', id:'C-1136', init:'NK' },
  { name:'Bùi An', id:'C-1144', init:'BA' },
  { name:'Khách walk-in', id:'C-1150', init:'WI' },
];
let openCount = waitQueue.length;

document.getElementById('main').innerHTML = topbar('Nghiệp vụ Tư vấn viên','Bàn tư vấn — Quỳnh Trang',{who:CURRENT_USER.initials,branch:CURRENT_USER.branch,right}) + `
  <div class="cn-tabs">
    <a class="cn-link" href="consultant-cn.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>Toàn CN (điều phối tư vấn)</a>
    <a class="cn-link on" href="consultant.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Của tôi (Quỳnh Trang)</a>
  </div>
  <div id="myView"></div>`;

function fairBlocked(){ return active!==null || cooldownSec>0; }
function render(){
  const v=document.getElementById('myView');
  const over = active && active.heldMin>SLA_WARN;
  v.innerHTML = `
  ${active ? `
  <div class="active-banner">
    <div class="ab-av">${active.init}</div>
    <div class="ab-info"><b>Đang tiếp: ${active.name} ${active.vip?'<span class="tag vip" style="vertical-align:middle">VIP</span>':''}</b>
      <span>${active.id} · ${active.svc} · 1 khách active tại 1 thời điểm</span></div>
    <div class="sla ${over?'over':''}"><b>${active.heldMin}p</b><span>ĐANG GIỮ</span></div>
    <a class="ab-close" href="consultant-survey.html" style="text-decoration:none;display:inline-block">Mở trang tư vấn →</a>
    <button class="ab-close" onclick="closeActive()">Đóng / Bàn giao</button>
  </div>` : `
  <div class="active-banner empty">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <div class="ab-info" style="color:var(--ink)"><b>Không có khách đang tiếp</b><span>Bạn có thể nhận 1 khách mới theo lượt bên dưới.</span></div>
  </div>`}

  ${over ? `<div class="sla-warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>Giữ khách quá ${SLA_WARN} phút</b> — hãy chốt hoặc bàn giao. Giữ khách lâu bất thường sẽ bị ghi nhận (chống câu giờ chờ KTV).</div></div>`:''}
  ${cooldownSec>0 ? `<div class="sla-warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>Đang chờ (cooldown ${cooldownSec}s)</b> — vừa trả khách, xếp cuối lượt rồi mới nhận tiếp (tránh "đóng giả" để nhảy khách ngon).</div></div>`:''}

  <div class="kpi-grid">
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div></div><div class="kpi-val">${active?1:0}/1</div><div class="kpi-lbl">Khách đang tiếp (giới hạn 1)</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div><div class="kpi-val">14,2tr</div><div class="kpi-lbl">Giá trị gói trung bình</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-blush"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg></div><span class="trend up">96%</span></div><div class="kpi-val">38</div><div class="kpi-lbl">Chốt trong tháng</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div></div><div class="kpi-val">0</div><div class="kpi-lbl">Vi phạm giành khách</div></div>
  </div>

  <div class="panel" style="margin-bottom:22px"><div class="panel-h"><div class="panel-title">Hàng đợi tư vấn — nhận theo lượt<small>Hệ xếp thứ tự · không chọn khách · bấm mới biết là ai</small></div></div>
    <div class="next-claim">
      <div class="nc-left">
        <div class="nc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div><div class="nc-count"><b>${openCount}</b> khách đang chờ tư vấn</div>
          <div class="nc-sub">Khách kế tiếp do hệ xếp theo thứ tự đến — danh tính & giá trị được ẩn để đảm bảo công bằng.</div></div>
      </div>
      ${fairBlocked()
        ? `<div style="text-align:right"><button class="btn btn-ghost" disabled style="padding:12px 22px;font-size:14px">Nhận khách kế tiếp</button>
            <div class="lock-msg" style="justify-content:flex-end"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>${active?'Đang tiếp 1 khách — đóng trước đã':'Đang cooldown'}</div></div>`
        : `<button class="btn btn-teal" style="padding:13px 24px;font-size:14.5px" onclick="claimNext()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Nhận khách kế tiếp</button>`}
    </div>
    <div class="alert al-info" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div><b>Chống ghim khách:</b> TVV <b>không được chọn khách</b> — hệ trả về đúng khách đầu hàng đợi. Mỗi lần chỉ 1 khách (xong mới nhận tiếp), giá trị khách ẩn, KTV do hệ tự điều phối (TVV không chọn KTV).</div></div>
  </div>

  <div class="panel"><div class="panel-h"><div class="panel-title">Khách của tôi (owner)<small>Đã chốt / đang theo — không chiếm slot đang tiếp</small></div></div>
    ${owned.map(c=>`<div class="cart-row"><div class="q-av av-gold">${c.name.split(' ').slice(-1)[0].slice(0,2)}</div><div class="ci"><b>${c.name}</b><span>${c.id} · ${c.sub}</span></div><span class="tag done" style="align-self:center">Owner</span></div>`).join('')}
  </div>`;
  wireUI();
}
function closeActive(){
  if(!active) return;
  active=null; cooldownSec=8; render();
  const t=setInterval(()=>{ cooldownSec--; if(cooldownSec<=0){clearInterval(t);cooldownSec=0;} render(); },1000);
}
function claimNext(){
  if(fairBlocked() || !waitQueue.length) return;
  const c = waitQueue.shift(); openCount = waitQueue.length;
  active={ name:c.name, id:c.id, init:c.init, av:'av-teal', vip:false, svc:'Tư vấn mới', heldMin:0 };
  render();
}
render();
</script>
</body></html>
