<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Kho nguyên vật liệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ops-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.ops-card .oc-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ops-card .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.ops-card .oc-ic svg{width:17px;height:17px}
.ops-card .oc-t{font-weight:600;font-size:14px}
.ops-card .oc-big{font-family:'Fraunces',serif;font-size:32px;line-height:1;margin:2px 0}
.ops-card .oc-sub{font-size:11.5px;color:var(--ink-soft)}
.ops-card .oc-rows{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ops-card .ocr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ops-card .ocr b{font-family:'Fraunces',serif}
.ops-card .oc-link{margin-top:11px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ops-card.warn{border-color:#f0c9a8;background:linear-gradient(140deg,#fff,#fdeee3)}
.load-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.load-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}.load-bar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--teal-soft);color:var(--teal-deep)}.badge.busy{background:#fbeccb;color:#9a6a1e}.badge.over{background:#f4d3cb;color:#9a3b2c}
.subtab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.subtab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.subtab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.kpi-bar{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;min-width:90px}.kpi-bar i{display:block;height:100%;background:var(--teal)}
.num-strong{font-family:'Fraunces',serif;font-weight:600}
.role-chip{font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--bg-2);font-weight:500}
.kpi-big{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi-big .kb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi-big .kb .kv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.kpi-big .kb .kl{font-size:11.5px;color:var(--ink-soft)}
.kpi-big .kb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.kpi-big .kb.warn .kv{color:#9a5a1e}
.kpi-big .kb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.kpi-big .kb.good .kv{color:var(--teal-deep)}
.region-block{margin-bottom:22px}
.region-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.region-head .rg-ic{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.region-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0}
.region-head .rg-sum{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ov-table td{padding:10px;border-bottom:1px solid var(--line)}
.ov-table tr.clickable{cursor:pointer;transition:.12s}.ov-table tr.clickable:hover td{background:var(--teal-soft)}
.ov-cn{font-weight:600}.ov-cn small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut-c{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut-c b{font-family:'Fraunces',serif;font-size:17px;display:block}.donut-c span{font-size:10px;color:var(--ink-soft)}
.leg-list{display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.leg-row .dot{width:11px;height:11px;border-radius:3px;flex:none}.leg-row b{margin-left:auto;font-family:'Fraunces',serif}
@media(max-width:900px){.snap,.ops-grid,.kpi-big{grid-template-columns:repeat(2,1fr)}}

/* ==== module kho ==== */
.rep-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
.rep-card{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;cursor:pointer;transition:.18s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.rep-card:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-3px)}
.rep-card .rc-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:13px;background:var(--teal-soft);color:var(--teal-deep)}
.rep-card .rc-ic.gold{background:#fbeccb;color:#9a6a1e}.rep-card .rc-ic.indigo{background:#e6e0f5;color:#6b54b8}.rep-card .rc-ic.rose{background:#f7dcd5;color:#9a3b2c}
.rep-card .rc-ic svg{width:23px;height:23px}
.rep-card h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 6px}
.rep-card p{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 13px;flex:1}
.rep-card .rc-go{font-size:12.5px;font-weight:600;color:var(--teal-deep);display:flex;align-items:center;gap:5px}
.log-row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.log-row:last-child{border:none}
.log-tk{font-family:Consolas,monospace;font-size:11.5px;color:var(--teal-deep);font-weight:600;white-space:nowrap}
.log-step{flex:1}.log-step b{font-weight:600}.log-step span{display:block;font-size:11.5px;color:var(--ink-soft)}
.log-qty{text-align:right;white-space:nowrap;font-family:'Fraunces',serif;font-weight:600}
.diff-up{color:var(--rose)}.diff-ok{color:var(--teal-deep)}
.mini-tab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.mini-tab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.mini-tab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.bar-mini{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden;vertical-align:middle;margin-right:6px}.bar-mini i{display:block;height:100%}
/* ==== lô / batch tracking ==== */
.lot-chip{font-family:Consolas,monospace;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--teal-soft);color:var(--teal-deep);white-space:nowrap}
.lot-chip.near{background:#fbeccb;color:#9a6a1e}.lot-chip.expired{background:#f4d3cb;color:#9a3b2c}
.lot-none{color:var(--ink-soft);font-size:12px}
.lot-btn{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:11px;padding:3px 9px;border-radius:7px;cursor:pointer;color:var(--teal-deep);font-weight:600;white-space:nowrap}
.lot-btn:hover{border-color:var(--teal);background:var(--teal-soft)}
.lot-mask{position:fixed;inset:0;background:rgba(35,30,28,.34);display:none;z-index:60}
.lot-mask.on{display:block}
.lot-drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:.22s;z-index:61;display:flex;flex-direction:column}
.lot-drawer.on{transform:translateX(0)}
.lot-dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.lot-dh .ld-t{font-family:'Fraunces',serif;font-size:17px;margin:0}
.lot-dh .ld-s{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.lot-dh .ld-x{margin-left:auto;border:none;background:var(--bg-2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--ink-soft);flex:none}
.lot-db{padding:16px 20px;overflow:auto;flex:1}
.lot-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.lot-tbl th{text-align:left;font-size:10.5px;color:var(--ink-soft);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
.lot-tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.lot-tbl tr.fefo td{background:var(--teal-soft)}
.lot-no{font-family:Consolas,monospace;font-weight:600}
.lot-flag{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:5px}
.lot-flag.fefo{background:var(--teal-deep);color:#fff}
.lot-note{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-top:14px;padding:11px 13px;background:var(--bg-2);border-radius:10px}
.lot-trace{display:inline-flex;align-items:center;gap:5px;margin-top:13px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none}
@media(max-width:900px){.rep-menu{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('inventory');
const back=`<a class="btn btn-ghost" href="inventory.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Trung tâm kho</a>`;
document.getElementById('main').innerHTML = topbar('Vận hành','Kho nguyên vật liệu',{who:'WH',branch:'CN Quận 1',right:back}) + `
  <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px">NVL/vật tư tiêu hao dùng trong liệu trình, SKU lẻ, và chai/lọ <b>đang dùng dở</b> (chưa hết). Theo dõi tồn nguyên + tồn dở để tính hao hụt chính xác.</div>
  <div class="snap">
    <div class="sb"><div class="sl">Mã NVL</div><div class="sv">124</div><div class="sl">vật tư tiêu hao</div></div>
    <div class="sb"><div class="sl">Chai/lọ đang dùng dở</div><div class="sv">37</div><div class="sl">chưa hết</div></div>
    <div class="sb warn"><div class="sl">Dưới định mức</div><div class="sv">8</div><div class="sl">cần nhập</div></div>
    <div class="sb warn"><div class="sl">Hao hụt vượt ngưỡng</div><div class="sv">2</div><div class="sl">tháng này</div></div>
  </div>
  <div class="mini-tab" id="mt">
    <button class="on" onclick="tab('all')">Tất cả</button>
    <button onclick="tab('open')">Chai/lọ dùng dở (37)</button>
    <button onclick="tab('low')">⚠ Dưới định mức (8)</button>
  </div>
  <div class="mini-tab" style="margin-top:-6px"><span style="font-size:11.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px">Vật tư <b style="color:var(--teal-deep)">tiêm/cấy</b> có theo dõi <b>số lô + HSD</b> (xuất FEFO). <a href="inventory-trace.html" style="color:var(--teal-deep);font-weight:600;text-decoration:none">Log theo lô →</a></span></div>
  <div class="panel" style="padding:6px 4px"><table class="ov-table" id="tb"><thead><tr><th>Vật tư (NVL)</th><th>SKU</th><th>Tồn nguyên</th><th>Đang dùng dở</th><th>ĐM tối thiểu</th><th>Hao hụt/tháng</th><th>Hạn dùng · Lô</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></div>`;

const MAT=[
  {n:'Gel lạnh triệt lông', sku:'NVL-GEL-1L', whole:'24 chai', open:'3 chai (≈40%)', min:'10 chai', loss:'+16%', exp:'06/2026', st:'loss', flags:['open','low']},
  {n:'Tinh chất phục hồi', sku:'NVL-SER-500', whole:'18 lọ', open:'2 lọ (≈30%)', min:'8 lọ', loss:'+2%', exp:'09/2026', st:'ok', flags:['open']},
  {n:'Mặt nạ chuyên dụng', sku:'NVL-MSK-1', whole:'210 cái', open:'—', min:'80 cái', loss:'+13%', exp:'07/2026', st:'loss', flags:['low']},
  {n:'Gel dẫn RF', sku:'NVL-RFG-1L', whole:'12 chai', open:'1 chai (≈60%)', min:'6 chai', loss:'−4%', exp:'08/2026', st:'ok', flags:['open']},
  {n:'Đầu cartridge HIFU', sku:'NVL-HIFU-C', whole:'14 đầu', open:'—', min:'20 đầu', loss:'−3%', exp:'—', st:'low', flags:['low']},
  {n:'Gel làm dịu sau laser', sku:'NVL-SOOTH-500', whole:'9 lọ', open:'4 lọ (≈50%)', min:'6 lọ', loss:'+2%', exp:'05/2026', st:'ok', flags:['open']},
  {n:'Tinh dầu massage', sku:'NVL-OIL-1L', whole:'16 chai', open:'5 chai (≈35%)', min:'8 chai', loss:'+2%', exp:'10/2026', st:'ok', flags:['open']},
  {n:'Serum vitamin C', sku:'NVL-VITC-30', whole:'5 lọ', open:'2 lọ (≈20%)', min:'10 lọ', loss:'−2%', exp:'04/2026', st:'low', flags:['open','low']},
  {n:'Bông + cồn y tế', sku:'NVL-CTN-SET', whole:'320 set', open:'—', min:'100 set', loss:'0%', exp:'12/2026', st:'ok', flags:[]},
  {n:'Đầu kim lăn', sku:'NVL-NDL-1', whole:'42 đầu', open:'—', min:'30 đầu', loss:'0%', exp:'—', st:'ok', flags:[]},
];
const badge={loss:['over','Hao hụt cao'],low:['busy','Dưới ĐM'],ok:['ok','Bình thường']};
// Lô + HSD cho vật tư tiêm/cấy (FEFO: hạn sớm xuất trước). st: active | near | expired
const LOTS={
  'NVL-SER-500':[
    {lot:'SER-2503A', exp:'04/2026', qty:'4 lọ',  in:'05/03/2026', st:'near'},
    {lot:'SER-2505B', exp:'09/2026', qty:'14 lọ', in:'18/05/2026', st:'active'},
  ],
  'NVL-HIFU-C':[
    {lot:'HIFU-2502X', exp:'08/2026', qty:'9 đầu', in:'20/02/2026', st:'active'},
    {lot:'HIFU-2504Y', exp:'02/2027', qty:'5 đầu', in:'10/04/2026', st:'active'},
  ],
  'NVL-SOOTH-500':[
    {lot:'SOOTH-2412C', exp:'05/2026', qty:'5 lọ', in:'28/12/2025', st:'near'},
    {lot:'SOOTH-2503D', exp:'11/2026', qty:'4 lọ', in:'12/03/2026', st:'active'},
  ],
  'NVL-VITC-30':[
    {lot:'VITC-2411E', exp:'04/2026', qty:'2 lọ', in:'15/11/2025', st:'near'},
    {lot:'VITC-2502F', exp:'10/2026', qty:'5 lọ', in:'08/02/2026', st:'active'},
  ],
  'NVL-NDL-1':[
    {lot:'NDL-2504G', exp:'04/2027', qty:'30 đầu', in:'02/04/2026', st:'active'},
    {lot:'NDL-2505H', exp:'05/2027', qty:'12 đầu', in:'15/05/2026', st:'active'},
  ],
};
// FEFO: lô hạn sớm nhất (chưa hết hạn) là lô đang xuất
function fefoLot(sku){
  const ls=LOTS[sku]; if(!ls) return null;
  const sorted=[...ls].sort((a,b)=>expKey(a.exp)-expKey(b.exp));
  return sorted[0];
}
function expKey(e){ const [m,y]=e.split('/'); return parseInt(y)*12+parseInt(m); }
function render(list){
  document.getElementById('rows').innerHTML = list.map(m=>{
    const [bc,bl]=badge[m.st];
    const lots=LOTS[m.sku];
    let expCell;
    if(lots){
      const f=fefoLot(m.sku);
      const cls=f.st==='near'?'near':(f.st==='expired'?'expired':'');
      expCell=`<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
        <span class="lot-chip ${cls}">${f.lot}</span>
        <span style="font-size:11px;color:var(--ink-soft)">HSD ${f.exp}</span>
        <button class="lot-btn" onclick="openLots('${m.sku}','${m.n.replace(/'/g,"\\'")}')">${lots.length} lô ›</button>
      </div>`;
    } else {
      expCell=`${m.exp}`;
    }
    return `<tr ${m.st!=='ok'?'style="background:#fdf6f0"':''}>
      <td><b>${m.n}</b></td><td>${m.sku}</td><td>${m.whole}</td>
      <td>${m.open==='—'?'<span style="color:var(--ink-soft)">—</span>':m.open}</td>
      <td>${m.min}</td><td class="${m.loss.includes('+')?'diff-up':(m.loss.includes('−')?'diff-ok':'')}">${m.loss}</td>
      <td>${expCell}</td><td><span class="badge ${bc}">${bl}</span></td></tr>`;
  }).join('');
}
function tab(k){
  document.querySelectorAll('#mt button').forEach(b=>b.classList.remove('on'));
  const idx={all:0,open:1,low:2}[k];
  document.querySelectorAll('#mt button')[idx].classList.add('on');
  render(k==='all'?MAT:MAT.filter(m=>m.flags.includes(k)));
}
window.tab=tab; render(MAT);

// ===== Drawer chi tiết lô =====
const drawer=document.createElement('div');
drawer.innerHTML=`<div class="lot-mask" id="lotMask" onclick="closeLots()"></div>
<aside class="lot-drawer" id="lotDrawer">
  <div class="lot-dh"><div><h3 class="ld-t" id="ldT">—</h3><div class="ld-s" id="ldS">Số lô · HSD · xuất theo FEFO</div></div><button class="ld-x" onclick="closeLots()">✕</button></div>
  <div class="lot-db" id="ldBody"></div>
</aside>`;
document.body.appendChild(drawer);
function openLots(sku,name){
  const ls=LOTS[sku]||[];
  const sorted=[...ls].sort((a,b)=>expKey(a.exp)-expKey(b.exp));
  document.getElementById('ldT').textContent=name;
  document.getElementById('ldS').textContent=sku+' · '+ls.length+' lô đang giữ · xuất theo FEFO';
  const stLbl={active:['ok','Còn hạn'],near:['busy','Cận date'],expired:['over','Hết hạn']};
  document.getElementById('ldBody').innerHTML=`
    <table class="lot-tbl"><thead><tr><th>Số lô</th><th>HSD</th><th>Tồn lô</th><th>Ngày nhập</th><th>Trạng thái</th></tr></thead><tbody>
    ${sorted.map((l,i)=>{const [c,t]=stLbl[l.st];return `<tr class="${i===0?'fefo':''}">
      <td><span class="lot-no">${l.lot}</span>${i===0?'<span class="lot-flag fefo">FEFO</span>':''}</td>
      <td>${l.exp}</td><td>${l.qty}</td><td>${l.in}</td><td><span class="badge ${c}">${t}</span></td></tr>`}).join('')}
    </tbody></table>
    <div class="lot-note"><b>FEFO</b> — lô <b>${sorted[0].lot}</b> (HSD ${sorted[0].exp}) sẽ được xuất trước. Khi ghi NVL thực tế ở buổi dịch vụ, hệ thống gợi ý đúng lô này và lưu lô vào hồ sơ buổi để truy vết.</div>
    <a class="lot-trace" href="inventory-trace.html?sku=${encodeURIComponent(sku)}">Xem log lô này →</a>`;
  document.getElementById('lotMask').classList.add('on');
  document.getElementById('lotDrawer').classList.add('on');
}
function closeLots(){document.getElementById('lotMask').classList.remove('on');document.getElementById('lotDrawer').classList.remove('on');}
window.openLots=openLots; window.closeLots=closeLots;
</script>
</body></html>
