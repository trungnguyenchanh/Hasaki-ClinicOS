<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Cashier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.pos{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.catalog-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ct-tab{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;font-weight:500;padding:7px 14px;border-radius:30px;cursor:pointer;color:var(--ink-soft)}
.ct-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.prod{border:1.5px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:.16s;background:#fff;position:relative;display:flex;gap:12px;align-items:flex-start}
.prod:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.prod.owned{border-color:var(--amber);background:#fffaf0;cursor:not-allowed}
.prod .picon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.prod .picon svg{width:22px;height:22px}
.prod .pbody{flex:1;min-width:0}
.prod .pt{font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
.prod b{font-size:13.5px;display:block;line-height:1.3}
.prod .pp{font-family:'Fraunces',serif;font-weight:600;margin-top:7px;font-size:15px}
.prod.owned .owntag{position:absolute;top:9px;right:9px;font-size:10px;font-weight:600;background:var(--amber);color:#fff;padding:2px 8px;border-radius:20px}
.ic-laser{background:#fbe7e0;color:var(--blush-deep)}.ic-rf{background:#f7eed3;color:var(--gold)}
.ic-skin{background:var(--teal-soft);color:var(--teal-deep)}.ic-hair{background:var(--indigo-soft);color:var(--indigo)}
.ic-relax{background:#e3f0ec;color:#5d9486}.ic-prod{background:#eef1f4;color:#6b7a86}
.cart-lot{display:inline-block;font-family:Consolas,monospace;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--teal-soft);color:var(--teal-deep);margin-top:4px}
.cart-lot.near{background:#fbeccb;color:#9a6a1e}
/* invoice — rõ ràng chống nhầm */
.inv-row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.inv-row:last-of-type{border:none}
.inv-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.inv-ic svg{width:20px;height:20px}
.inv-name{font-size:14.5px;font-weight:600;line-height:1.25}
.inv-sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.inv-right{text-align:right;white-space:nowrap}
.inv-qty{display:inline-flex;align-items:center;gap:9px;background:var(--bg-2);border-radius:9px;padding:3px 4px;margin-bottom:5px}
.inv-qty button{width:24px;height:24px;border-radius:6px;border:none;background:#fff;cursor:pointer;font-size:16px;line-height:1;color:var(--ink);box-shadow:var(--shadow)}
.inv-qty .qn{font-family:'Fraunces',serif;font-weight:600;min-width:22px;text-align:center;font-size:15px}
.inv-price{font-family:'Fraunces',serif;font-weight:600;font-size:16px}
.inv-unit{font-size:11px;color:var(--ink-soft)}
.inv-rm{cursor:pointer;color:var(--ink-soft);font-size:17px;margin-left:8px}
.sumline.total{font-size:22px}
.cust-note{background:#fdf3e3;border:1px solid #f0d9a8;border-radius:12px;padding:12px;font-size:12.5px;color:#9a6a1e;margin-bottom:14px;display:flex;gap:9px}
.cust-note svg{width:17px;height:17px;flex:none;margin-top:1px}
@media(max-width:980px){.pos{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script>
renderLayout('cashier');
const C = (typeof getCustomer==='function') ? getCustomer() : {id:'C-1042',name:'Trần Thu Hà',initials:'TH',avatarClass:'av-teal',consultant:'Quỳnh Trang',allergy:'Lidocaine & Paraben'};
const fmt=n=> n.toLocaleString('vi-VN')+'đ';

// Quy tắc giảm giá có thể chọn (ý 2)
const RULES = [
  { id:'none', label:'Không áp dụng', pct:0 },
  { id:'bday', label:'Khuyến mãi sinh nhật −5%', pct:5 },
  { id:'vip',  label:'Ưu đãi khách VIP −8%', pct:8 },
  { id:'combo',label:'Combo nhiều dịch vụ −10%', pct:10 },
];
let activeRule = 'bday';
let voucher = '';

document.getElementById('main').innerHTML = topbar('Cashier › Bán hàng','POS bán hàng / tạo phiếu',{who:CURRENT_USER.initials,branch:CURRENT_USER.branch}) + `
  <div class="cn-tabs">
    <a class="cn-link" href="cashier.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9h18M9 21V9"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Quầy của tôi (receipt)</a>
    <a class="cn-link on" href="cashier-pos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/></svg>Bán hàng / tạo phiếu</a>
  </div>
  ${navCluster(C)}
  <div id="myView">
  <div class="cust-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>Lưu ý khách ${C.name} (${C.id}):</b> dị ứng ${C.allergy||'—'} · đã có gói triệt lông (tránh bán trùng).</div></div>
  <div class="pos">
    <div class="panel"><div class="panel-h"><div class="panel-title">Chọn dịch vụ / gói<small>Icon theo nhóm — tránh chọn nhầm</small></div></div>
      <div class="catalog-tabs" id="cats"></div>
      <div class="cat-grid" id="grid"></div>
    </div>
    <div class="panel" style="position:sticky;top:20px;align-self:start"><div class="panel-h"><div class="panel-title">Phiếu tạm #INV-${C.code||'20825'}<small>${C.name} · từ TVV ${C.consultant||'—'}</small></div><span class="tag vip">Tạo phiếu</span></div>
      <div id="cart"></div>
      <div id="sum"></div>
      <div class="field" style="margin-top:14px"><label>Quy tắc giảm giá</label>
        <select id="ruleSel" onchange="setRule(this.value)" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-family:inherit;font-size:13px;outline:none;background:#fff">
          ${RULES.map(r=>`<option value="${r.id}" ${r.id===activeRule?'selected':''}>${r.label}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-top:10px"><label>Mã voucher (nếu có)</label>
        <div style="display:flex;gap:8px"><input id="vouIn" placeholder="VD: HASAKI500" style="flex:1" oninput="voucher=this.value"><button class="btn btn-ghost" onclick="applyVou()">Áp dụng</button></div>
        <div id="vouMsg" style="font-size:11.5px;margin-top:5px"></div>
      </div>
      <div class="field" style="margin-top:10px"><label>Ghi chú phiếu</label><input id="invnote" placeholder="VD: xuất hóa đơn công ty, giao serum sau…" /></div>
      <div class="alert al-info" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>POS chỉ <b>tạo phiếu</b> — việc <b>thu tiền</b> (Cash/Thẻ/KM) thực hiện ở bước thanh toán (cashier-payment).</div></div>
      <a class="btn btn-teal" href="${typeof linkFor==='function'?linkFor('cashier-payment.html',C):'cashier-payment.html'}" style="width:100%;justify-content:center;margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg>Tạo phiếu & chuyển thu ngân</a>
    </div>
  </div>
  </div>`;

// icon svg theo nhóm
const IC={
  laser:['ic-laser','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'],
  rf:['ic-rf','<path d="M3 12h4l3-8 4 16 3-8h4"/>'],
  skin:['ic-skin','<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>'],
  hair:['ic-hair','<path d="M12 2C8 2 5 6 5 11c0 4 2 7 7 11 5-4 7-7 7-11 0-5-3-9-7-9z"/>'],
  relax:['ic-relax','<path d="M12 2v6M4.9 9 9 11M19.1 9 15 11M6 20a6 6 0 0 1 12 0z"/>'],
  prod:['ic-prod','<path d="M6 2h12l-1 7H7zM7 9v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9"/>'],
  med:['ic-prod','<rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M13 9h4M13 12h4"/>'],
};
function icSvg(k){const[c,p]=IC[k];return `<div class="picon ${c}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${p}</svg></div>`;}

const CATALOG={
  "Gói liệu trình":[
    {ic:'rf',t:"Gói",n:"Giảm béo RF bụng · 10 buổi",p:18000000},
    {ic:'laser',t:"Gói",n:"Triệt lông Diode · 8 buổi",p:9900000,owned:true},
    {ic:'skin',t:"Gói",n:"Chăm sóc da phục hồi · 3 buổi",p:2400000},
    {ic:'hair',t:"Gói",n:"Phục hồi tóc · 6 buổi",p:9600000},
  ],
  "Dịch vụ lẻ":[
    {ic:'laser',t:"Dịch vụ",n:"Triệt lông · 1 vùng",p:600000},
    {ic:'skin',t:"Dịch vụ",n:"Chăm sóc da cơ bản",p:450000},
    {ic:'relax',t:"Dịch vụ",n:"Massage thư giãn",p:520000},
    {ic:'rf',t:"Dịch vụ",n:"Giảm béo RF · 1 buổi",p:1900000},
  ],
  "Từ liệu trình đang theo":[
    {ic:'rf',t:"Trừ gói",n:"Giảm béo RF · buổi 1/10",p:0},
    {ic:'laser',t:"Trừ gói",n:"Triệt lông · buổi 5/8",p:0},
  ],
  "Sản phẩm":[
    {ic:'prod',t:"Sản phẩm",n:"Serum dưỡng phục hồi",p:680000,sku:'SP-B5-30'},
    {ic:'prod',t:"Sản phẩm",n:"Kem chống nắng SPF50",p:420000,sku:'SP-SUN-50'},
    {ic:'prod',t:"Sản phẩm",n:"Sữa rửa mặt dịu nhẹ",p:280000,sku:'SP-CLN-150'},
  ],
  "Thuốc (SKU)":[
    {ic:'med',t:"Thuốc",n:"Lidocaine gel 5%",p:120000,pick:'picked'},
    {ic:'med',t:"Thuốc",n:"Vitamin C bôi 10ml",p:260000,pick:'nopick'},
    {ic:'med',t:"Thuốc",n:"Kem phục hồi B5",p:180000,pick:'nostock'},
  ],
};
let activeCat=Object.keys(CATALOG)[0];
// FEFO lô sản phẩm bán (gán khi thêm vào giỏ → lưu vào hoá đơn để truy vết)
const PLOTS_SALE={'SP-B5-30':{lot:'B5-2503',exp:'08/2026'},'SP-SUN-50':{lot:'SUN-2504',exp:'11/2026'},'SP-CLN-150':{lot:'CLN-2501',exp:'05/2026',near:true}};
function fefoSale(sku){return sku?PLOTS_SALE[sku]:null;}
// cart: dịch vụ có cờ done (ý 5); thuốc có pick (ý 6)
let cart=[
  {ic:'rf',n:"Gói giảm béo RF bụng · 10 buổi",m:"Mua gói",p:18000000,q:1,done:false},
  {ic:'laser',n:"Triệt lông · buổi 4/8",m:"Trừ gói · KTV đã xác nhận hoàn thành",p:600000,q:1,done:true},
  {ic:'med',n:"Vitamin C bôi 10ml",m:"Thuốc SKU",p:260000,q:1,pick:'nopick'},
];
const billable = it => !(it.pick && it.pick!=='picked');
const ruleObj = () => RULES.find(r=>r.id===activeRule)||RULES[0];

function renderCats(){document.getElementById('cats').innerHTML=Object.keys(CATALOG).map(c=>`<button class="ct-tab ${c===activeCat?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('');}
function renderGrid(){document.getElementById('grid').innerHTML=CATALOG[activeCat].map((x,i)=>{
  const owned=x.owned;
  let pickBadge='';
  if(x.pick==='picked') pickBadge='<div class="med-badge med-picked" style="margin-top:4px">✓ đã pick</div>';
  else if(x.pick==='nopick') pickBadge='<div class="med-badge med-nopick" style="margin-top:4px">⚠ chưa pick</div>';
  else if(x.pick==='nostock') pickBadge='<div class="med-badge med-nostock" style="margin-top:4px">⚠ hết stock</div>';
  return `<div class="prod ${owned?'owned':''}" ${owned?'':`onclick="addItem('${activeCat}',${i})"`}>${owned?'<span class="owntag">Đã có gói</span>':''}
    ${icSvg(x.ic)}<div class="pbody"><div class="pt" style="color:var(--ink-soft)">${x.t}</div><b>${x.n}</b><div class="pp">${x.p===0?'Trừ buổi':fmt(x.p)}</div>
    ${pickBadge}
    ${owned?'<div style="font-size:11px;color:var(--amber);font-weight:600;margin-top:4px">⚠ Khách đã mua — tránh bán trùng</div>':''}</div></div>`;
}).join('');}

function renderCart(){const c=document.getElementById('cart');
  if(!cart.length){c.innerHTML='<div style="text-align:center;color:var(--ink-soft);font-size:13px;padding:24px 0">Chưa có mục nào.</div>';renderSum();return;}
  c.innerHTML=cart.map((it,i)=>{
    // ý 5: dịch vụ done → ẩn nút × và khóa nút −
    const isDoneSvc = it.done===true;
    const showRm = !isDoneSvc;
    const minusDisabled = isDoneSvc;
    let stateBadge='';
    if(isDoneSvc) stateBadge='<span class="svc-lock"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg>Đã hoàn thành — không thể bỏ</span>';
    else if(it.pick==='nopick') stateBadge='<span class="med-badge med-nopick">⚠ chưa pick — không tính tiền</span>';
    else if(it.pick==='nostock') stateBadge='<span class="med-badge med-nostock">⚠ hết stock — không tính tiền</span>';
    else if(it.pick==='picked') stateBadge='<span class="med-badge med-picked">✓ đã pick thuốc</span>';
    const priceShown = billable(it)
      ? (it.p===0?'Trừ gói':fmt(it.p*it.q))
      : `<span style="text-decoration:line-through;color:var(--ink-soft)">${fmt(it.p*it.q)}</span>`;
    return `<div class="inv-row">${icSvg(it.ic)}
      <div><div class="inv-name">${it.n}</div><div class="inv-sub">${it.m}</div>
        ${it.lot?`<div><span class="cart-lot ${it.lotNear?'near':''}">Lô ${it.lot} · HSD ${it.lotExp}${it.lotNear?' · cận date':''}</span></div>`:''}
        ${stateBadge?`<div style="margin:4px 0">${stateBadge}</div>`:''}
        <div class="inv-qty"><button onclick="chq(${i},-1)" ${minusDisabled?'disabled':''}>−</button><span class="qn">${it.q}</span><button onclick="chq(${i},1)">+</button></div></div>
      <div class="inv-right"><div class="inv-price">${priceShown}</div><div class="inv-unit">${it.p===0?'':'đơn giá '+fmt(it.p)}</div>${showRm?`<span class="inv-rm" onclick="rm(${i})">×</span>`:'<span style="display:inline-block;width:14px"></span>'}</div>
    </div>`;
  }).join('');renderSum();
}
function renderSum(){
  const sub=cart.reduce((s,i)=> s + (billable(i)? i.p*i.q : 0), 0);
  const r=ruleObj();
  const km=Math.round(sub*r.pct/100);
  const vouLine = voucher ? `<div class="sumline"><span>Voucher ${voucher}</span><span style="color:var(--rose)">áp ở bước thanh toán</span></div>` : '';
  const hasUnpicked = cart.some(i=>i.pick && i.pick!=='picked');
  document.getElementById('sum').innerHTML=`<div class="sumline"><span>Tạm tính (${cart.filter(billable).length} mục được tính)</span><span>${fmt(sub)}</span></div>
    <div class="sumline"><span>${r.label}</span><span style="color:var(--rose)">−${fmt(km)}</span></div>
    ${vouLine}
    <div class="sumline total"><span>TẠM TÍNH PHIẾU</span><span>${fmt(sub-km)}</span></div>
    ${hasUnpicked?'<div style="font-size:11.5px;color:#a64b4b;margin-top:7px">⚠ SKU thuốc chưa pick / hết stock không được cộng vào tổng.</div>':''}`;
}
function setCat(c){activeCat=c;renderCats();renderGrid();}
function setRule(id){activeRule=id;renderSum();}
function applyVou(){const v=(document.getElementById('vouIn').value||'').trim();voucher=v;
  document.getElementById('vouMsg').innerHTML = v ? `<span style="color:var(--teal-deep)">✓ Đã ghi nhận mã <b>${v}</b> — sẽ kiểm tra & áp khi thanh toán.</span>` : '';
  renderSum();
}
function addItem(cat,i){const x=CATALOG[cat][i];const ex=cart.find(c=>c.n===x.n);
  if(ex){ex.q++;}else{const lot=fefoSale(x.sku);cart.push({ic:x.ic,n:x.n,m:x.t==='Trừ gói'?'Trừ từ gói khách':x.t,p:x.p,q:1,pick:x.pick,done:false,sku:x.sku,lot:lot?lot.lot:null,lotExp:lot?lot.exp:null,lotNear:lot&&lot.near});}renderCart();}
function chq(i,d){
  if(d<0 && cart[i].done) return; // ý 5: dịch vụ đã hoàn thành không giảm SL
  cart[i].q=Math.max(1,cart[i].q+d);renderCart();
}
function rm(i){ if(cart[i].done) return; cart.splice(i,1);renderCart(); } // ý 5: chặn remove
renderCats();renderGrid();renderCart();wireUI();
</script>
</body></html>
