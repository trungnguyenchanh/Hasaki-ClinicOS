<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.sm-group{margin-bottom:26px}
.sm-glabel{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal-deep);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sm-glabel::after{content:"";flex:1;height:1px;background:var(--line)}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.sm-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;transition:.16s;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.sm-card:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-2px)}
.sm-top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.sm-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.sm-ic svg{width:18px;height:18px}
.sm-card h4{font-size:14.5px;font-weight:600}
.sm-card .file{font-size:11px;color:var(--ink-soft);font-family:Consolas,monospace}
.sm-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:10px;flex:1}
.sm-actions{display:flex;flex-wrap:wrap;gap:5px}
.sm-act{font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--bg);color:var(--ink-soft);font-weight:500}
.sm-link{font-size:11px;color:var(--ink-soft);margin-top:9px;display:flex;flex-wrap:wrap;gap:4px}
.sm-link b{color:var(--teal-deep);font-weight:600}
</style></head>
