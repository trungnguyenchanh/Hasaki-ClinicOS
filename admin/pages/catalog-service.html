<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Catalog Dịch vụ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.link-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.link-card{border:1px solid var(--line);border-radius:13px;padding:13px;text-decoration:none;color:inherit;background:#fff;transition:.15s;text-align:center}
.link-card:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-2px)}
.link-card .lc-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin:0 auto 8px;background:var(--teal-soft);color:var(--teal-deep)}
.link-card .lc-ic svg{width:18px;height:18px}
.link-card b{font-size:12.5px;display:block}.link-card span{font-size:10.5px;color:var(--ink-soft)}
.link-card.on{border-color:var(--teal);background:var(--teal-soft)}
@media(max-width:900px){.link-grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('catalog-service');
const right=`<button class="btn btn-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Thêm dịch vụ</button>`;
const LINKNAV=`<div class="link-grid">
  <a class="link-card on" href="catalog-service.html"><div class="lc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><b>Dịch vụ</b><span>SKU dịch vụ</span></a>
  <a class="link-card" href="catalog-step.html"><div class="lc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div><b>Bước</b><span>quy trình</span></a>
  <a class="link-card" href="catalog-skill.html"><div class="lc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div><b>Kỹ năng</b><span>skill matrix</span></a>
  <a class="link-card" href="catalog-machine.html"><div class="lc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div><b>Máy móc</b><span>thiết bị</span></a>
  <a class="link-card" href="catalog-material.html"><div class="lc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v4l4 9a3 3 0 0 1-3 4H8a3 3 0 0 1-3-4l4-9z"/></svg></div><b>Nguyên vật liệu</b><span>định biên</span></a>
</div>`;
document.getElementById('main').innerHTML = topbar('Danh mục','Catalog — Dịch vụ',{who:'AD',branch:'Tất cả CN',right}) + `
  ${LINKNAV}
  <div class="kpi-grid">
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg></div></div><div class="kpi-val">48</div><div class="kpi-lbl">Dịch vụ đang bán</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v4H3zM5 7v14h14V7"/></svg></div></div><div class="kpi-val">5</div><div class="kpi-lbl">Nhóm dịch vụ</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg></div></div><div class="kpi-val">12</div><div class="kpi-lbl">Dịch vụ dùng máy cao cấp</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-indigo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div><div class="kpi-val">2,4tr</div><div class="kpi-lbl">Giá dịch vụ trung bình</div></div>
  </div>
  <div class="panel"><div class="panel-h"><div class="panel-title">Danh mục dịch vụ<small>Nhóm → Dịch vụ · gắn máy móc, kỹ năng & định biên NVL</small></div><div class="pill-tabs"><button class="on">Tất cả</button><button>Dùng máy cao cấp</button><button>Triệt lông</button><button>Giảm béo</button></div></div>
    <table><thead><tr><th>Dịch vụ</th><th>Nhóm</th><th>Máy móc yêu cầu</th><th>Skill yêu cầu</th><th>Giá / buổi</th><th>Bảo hành</th></tr></thead><tbody>
      <tr class="clickable" onclick="location.href='catalog-service-detail.html'"><td><b>Triệt lông Diode toàn thân</b></td><td>Triệt lông</td><td><span class="tag vip">Laser Diode XL</span></td><td><span class="role-chip">LASER · Senior</span></td><td class="num-strong">600.000đ</td><td><span class="tag done">12 tháng</span></td></tr>
      <tr class="clickable" onclick="location.href='catalog-service-detail.html'"><td><b>Giảm béo RF bụng</b></td><td>Giảm béo</td><td><span class="tag vip">Máy RF</span></td><td><span class="role-chip">RF · Senior</span></td><td class="num-strong">1.900.000đ</td><td><span class="tag done">3 tháng</span></td></tr>
      <tr class="clickable" onclick="location.href='catalog-service-detail.html'"><td><b>Nâng cơ HIFU mặt</b></td><td>Chăm sóc da</td><td><span class="tag vip">Máy HIFU</span></td><td><span class="role-chip">HIFU · Expert</span></td><td class="num-strong">3.500.000đ</td><td><span class="tag done">6 tháng</span></td></tr>
      <tr class="clickable" onclick="location.href='catalog-service-detail.html'"><td><b>Khám & tư vấn da liễu (bác sĩ)</b> <span class="tag new" style="background:var(--indigo-soft);color:var(--indigo)">DV bác sĩ</span></td><td>Y khoa</td><td>—</td><td><span class="role-chip">Bác sĩ da liễu</span></td><td class="num-strong">300.000đ</td><td><span class="tag wait">Không</span></td></tr>
      <tr class="clickable" onclick="location.href='catalog-service-detail.html'"><td><b>Tiểu phẫu nốt ruồi (bác sĩ)</b> <span class="tag new" style="background:var(--indigo-soft);color:var(--indigo)">DV bác sĩ</span></td><td>Y khoa</td><td>Máy laser CO2</td><td><span class="role-chip">Bác sĩ · thủ thuật</span></td><td class="num-strong">1.200.000đ</td><td><span class="tag done">1 tháng</span></td></tr>
      <tr class="clickable" onclick="location.href='catalog-service-detail.html'"><td><b>Chăm sóc da cơ bản</b></td><td>Chăm sóc da</td><td>—</td><td><span class="role-chip">Skincare</span></td><td class="num-strong">450.000đ</td><td><span class="tag wait">Không</span></td></tr>
      <tr class="clickable" onclick="location.href='catalog-service-detail.html'"><td><b>Phục hồi tóc hư tổn</b></td><td>Derma & Hair</td><td>Máy hấp tóc</td><td><span class="role-chip">Hair · Senior</span></td><td class="num-strong">1.600.000đ</td><td><span class="tag done">1 tháng</span></td></tr>
    </tbody></table>
    <div class="alert al-info" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Click một dịch vụ để mở <b>chi tiết</b>: hướng dẫn tư vấn · chống chỉ định · các bước (quy định từng bước) · thông số máy & định mức NVL. Áp dụng cho cả <b>dịch vụ của bác sĩ</b>.</div></div>
  </div>`;
wireUI();
</script>
</body></html>
