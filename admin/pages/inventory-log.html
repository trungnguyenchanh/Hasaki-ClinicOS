<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Log xuất NVL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ops-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.ops-card .oc-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ops-card .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.ops-card .oc-ic svg{width:17px;height:17px}
.ops-card .oc-t{font-weight:600;font-size:14px}
.ops-card .oc-big{font-family:'Fraunces',serif;font-size:32px;line-height:1;margin:2px 0}
.ops-card .oc-sub{font-size:11.5px;color:var(--ink-soft)}
.ops-card .oc-rows{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ops-card .ocr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ops-card .ocr b{font-family:'Fraunces',serif}
.ops-card .oc-link{margin-top:11px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ops-card.warn{border-color:#f0c9a8;background:linear-gradient(140deg,#fff,#fdeee3)}
.load-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.load-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}.load-bar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--teal-soft);color:var(--teal-deep)}.badge.busy{background:#fbeccb;color:#9a6a1e}.badge.over{background:#f4d3cb;color:#9a3b2c}
.subtab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.subtab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.subtab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.kpi-bar{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;min-width:90px}.kpi-bar i{display:block;height:100%;background:var(--teal)}
.num-strong{font-family:'Fraunces',serif;font-weight:600}
.role-chip{font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--bg-2);font-weight:500}
.kpi-big{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi-big .kb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi-big .kb .kv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.kpi-big .kb .kl{font-size:11.5px;color:var(--ink-soft)}
.kpi-big .kb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.kpi-big .kb.warn .kv{color:#9a5a1e}
.kpi-big .kb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.kpi-big .kb.good .kv{color:var(--teal-deep)}
.region-block{margin-bottom:22px}
.region-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.region-head .rg-ic{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.region-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0}
.region-head .rg-sum{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ov-table td{padding:10px;border-bottom:1px solid var(--line)}
.ov-table tr.clickable{cursor:pointer;transition:.12s}.ov-table tr.clickable:hover td{background:var(--teal-soft)}
.ov-cn{font-weight:600}.ov-cn small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut-c{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut-c b{font-family:'Fraunces',serif;font-size:17px;display:block}.donut-c span{font-size:10px;color:var(--ink-soft)}
.leg-list{display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.leg-row .dot{width:11px;height:11px;border-radius:3px;flex:none}.leg-row b{margin-left:auto;font-family:'Fraunces',serif}
@media(max-width:900px){.snap,.ops-grid,.kpi-big{grid-template-columns:repeat(2,1fr)}}

/* ==== module kho ==== */
.rep-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
.rep-card{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;cursor:pointer;transition:.18s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.rep-card:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-3px)}
.rep-card .rc-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:13px;background:var(--teal-soft);color:var(--teal-deep)}
.rep-card .rc-ic.gold{background:#fbeccb;color:#9a6a1e}.rep-card .rc-ic.indigo{background:#e6e0f5;color:#6b54b8}.rep-card .rc-ic.rose{background:#f7dcd5;color:#9a3b2c}
.rep-card .rc-ic svg{width:23px;height:23px}
.rep-card h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 6px}
.rep-card p{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 13px;flex:1}
.rep-card .rc-go{font-size:12.5px;font-weight:600;color:var(--teal-deep);display:flex;align-items:center;gap:5px}
.log-row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.log-row:last-child{border:none}
.log-tk{font-family:Consolas,monospace;font-size:11.5px;color:var(--teal-deep);font-weight:600;white-space:nowrap}
.log-step{flex:1}.log-step b{font-weight:600}.log-step span{display:block;font-size:11.5px;color:var(--ink-soft)}
.log-qty{text-align:right;white-space:nowrap;font-family:'Fraunces',serif;font-weight:600}
.diff-up{color:var(--rose)}.diff-ok{color:var(--teal-deep)}
.mini-tab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.mini-tab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.mini-tab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.bar-mini{display:inline-block;width:54px;height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden;vertical-align:middle;margin-right:6px}.bar-mini i{display:block;height:100%}
@media(max-width:900px){.rep-menu{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('inventory');
const back=`<a class="btn btn-ghost" href="inventory.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Trung tâm kho</a>`;
document.getElementById('main').innerHTML = topbar('Vận hành','Log xuất NVL chi tiết',{who:'WH',branch:'CN Quận 1',right:back}) + `
  <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px">Nhật ký từng dòng xuất NVL theo từng <b>step</b> trong SKU dịch vụ. Mỗi dòng gắn phiếu DV để truy vết — bấm phiếu để mở đối soát.</div>
  <div class="snap">
    <div class="sb"><div class="sl">Dòng log hôm nay</div><div class="sv">87</div><div class="sl">toàn CN</div></div>
    <div class="sb"><div class="sl">Phiếu DV có xuất</div><div class="sv">34</div><div class="sl">phiếu</div></div>
    <div class="sb warn"><div class="sl">Dòng lệch định mức</div><div class="sv">6</div><div class="sl">cần soát</div></div>
    <div class="sb"><div class="sl">NVL khác loại</div><div class="sv">19</div><div class="sl">SKU vật tư</div></div>
  </div>
  <div class="panel"><div class="panel-h"><div class="panel-title">Log xuất theo step<small>thời gian · phiếu DV · SKU · step · NVL · định mức vs thực xuất</small></div>
    <select style="padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:12.5px;outline:none;background:#fff"><option>Tất cả phiếu</option><option>Chỉ dòng lệch định mức</option><option>Hôm nay</option></select></div>
    <div id="log"></div>
  </div>`;

const LOG=[
  {t:'09:42', tk:'DV-0825', sku:'Triệt lông Diode', step:'Step 2 · Bôi gel lạnh vùng bụng', nvl:'Gel lạnh triệt lông', bom:'45 ml', act:'58 ml', over:true},
  {t:'09:40', tk:'DV-0825', sku:'Triệt lông Diode', step:'Step 1 · Vệ sinh & sát khuẩn', nvl:'Bông + cồn y tế', bom:'1 set', act:'1 set', over:false},
  {t:'09:31', tk:'DV-0830', sku:'Chăm sóc da phục hồi', step:'Step 3 · Đắp tinh chất', nvl:'Tinh chất phục hồi', bom:'30 ml', act:'30 ml', over:false},
  {t:'09:28', tk:'DV-0830', sku:'Chăm sóc da phục hồi', step:'Step 2 · Massage dẫn', nvl:'Kem massage', bom:'15 ml', act:'15 ml', over:false},
  {t:'09:15', tk:'DV-0841', sku:'Đắp mặt nạ chuyên sâu', step:'Step 1 · Đắp mặt nạ', nvl:'Mặt nạ chuyên dụng', bom:'1 cái', act:'2 cái', over:true},
  {t:'09:02', tk:'DV-0836', sku:'Giảm béo RF bụng', step:'Step 2 · Bôi gel dẫn RF', nvl:'Gel dẫn RF', bom:'30 ml', act:'28 ml', over:false},
  {t:'08:55', tk:'DV-0836', sku:'Giảm béo RF bụng', step:'Step 1 · Đo & đánh dấu vùng', nvl:'Bút đánh dấu', bom:'—', act:'—', over:false},
  {t:'08:47', tk:'DV-0848', sku:'Gội dưỡng sinh', step:'Step 1 · Gội & ủ dưỡng', nvl:'Dầu gội dưỡng', bom:'50 ml', act:'52 ml', over:false},
  {t:'08:30', tk:'DV-0852', sku:'Điện di vitamin C', step:'Step 2 · Điện di serum', nvl:'Serum vitamin C', bom:'30 ml', act:'30 ml', over:false},
  {t:'08:18', tk:'DV-0855', sku:'Massage trị liệu', step:'Step 1 · Massage toàn thân', nvl:'Tinh dầu massage', bom:'40 ml', act:'45 ml', over:true},
];
document.getElementById('log').innerHTML = LOG.map(l=>`
  <div class="log-row">
    <span class="log-tk">${l.t}</span>
    <div class="log-step"><b>${l.sku}</b> · <a href="inventory-ticket.html?id=${l.tk}" style="color:var(--teal-deep);font-family:Consolas,monospace;font-size:11.5px">${l.tk}</a>
      <span>${l.step} — ${l.nvl}</span></div>
    <div class="log-qty">${l.act==='—'?'<span style="color:var(--ink-soft);font-weight:400">—</span>':`<span class="${l.over?'diff-up':''}">${l.act}</span> <span style="color:var(--ink-soft);font-weight:400;font-size:11px">/ ĐM ${l.bom}</span>`}
      ${l.over?'<span class="badge over" style="margin-left:6px">lố</span>':''}</div>
  </div>`).join('');
</script>
</body></html>
