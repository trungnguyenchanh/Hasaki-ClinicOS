<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Catalog Skill</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>.lvl{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:2px}.lvl.on{background:var(--teal)}</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('catalog-skill');
const right=`<button class="btn btn-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Thêm kỹ năng</button>`;
function lvl(n){let s='';for(let i=0;i<3;i++)s+=`<span class="lvl ${i<n?'on':''}"></span>`;return s;}
document.getElementById('main').innerHTML = topbar('Danh mục','Catalog — Kỹ năng (Skill matrix)',{who:'AD',branch:'Tất cả CN',right}) + `
  <div class="kpi-grid">
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5"/></svg></div></div><div class="kpi-val">16</div><div class="kpi-lbl">Kỹ năng định nghĩa</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div></div><div class="kpi-val">31</div><div class="kpi-lbl">Nhân sự được cấp skill</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div></div><div class="kpi-val">3</div><div class="kpi-lbl">Kỹ năng thiếu người</div></div>
    <div class="card"><div class="kpi-top"><div class="kpi-ic ic-indigo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg></div></div><div class="kpi-val">4</div><div class="kpi-lbl">Chờ đánh giá nâng cấp</div></div>
  </div>
  <div class="panel"><div class="panel-h"><div class="panel-title">Ma trận kỹ năng<small>Cấp độ: Junior ● ○ ○ · Senior ● ● ○ · Expert ● ● ● — đầu vào điều phối tự động</small></div><div class="pill-tabs"><button class="on">Tất cả</button><button>Thiết bị</button><button>Chăm sóc</button></div></div>
    <table><thead><tr><th>Kỹ năng</th><th>Nhóm dịch vụ</th><th>Gắn thiết bị</th><th>Cấp tối thiểu yêu cầu</th><th>Số người đạt</th><th>Tình trạng</th></tr></thead><tbody>
      <tr class="clickable"><td><b>LASER</b></td><td>Triệt lông</td><td>Laser Diode XL</td><td>${lvl(2)} Senior</td><td>5</td><td><span class="tag done">Đủ</span></td></tr>
      <tr class="clickable"><td><b>RF</b></td><td>Giảm béo</td><td>Máy RF</td><td>${lvl(2)} Senior</td><td>4</td><td><span class="tag done">Đủ</span></td></tr>
      <tr class="clickable"><td><b>HIFU</b></td><td>Chăm sóc da</td><td>Máy HIFU</td><td>${lvl(3)} Expert</td><td>1</td><td><span class="tag" style="background:#f9e6e6;color:#a64b4b">Thiếu người</span></td></tr>
      <tr class="clickable"><td><b>Skincare</b></td><td>Chăm sóc da</td><td>—</td><td>${lvl(1)} Junior</td><td>8</td><td><span class="tag done">Đủ</span></td></tr>
      <tr class="clickable"><td><b>Hair</b></td><td>Derma & Hair</td><td>Máy hấp tóc</td><td>${lvl(2)} Senior</td><td>3</td><td><span class="tag prog">Vừa đủ</span></td></tr>
      <tr class="clickable"><td><b>Mesotherapy</b></td><td>Chăm sóc da</td><td>Máy điện di</td><td>${lvl(2)} Senior</td><td>2</td><td><span class="tag prog">Vừa đủ</span></td></tr>
    </tbody></table>
    <div class="alert al-rose" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div>Kỹ năng <b>HIFU (Expert)</b> chỉ 1 người đạt → rủi ro nghẽn lịch máy HIFU đắt tiền. Đề xuất đào tạo nâng cấp.</div></div>
  </div>`;
wireUI();
</script>
</body></html>
