<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Bảo hành dịch vụ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ops-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.ops-card .oc-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ops-card .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.ops-card .oc-ic svg{width:17px;height:17px}
.ops-card .oc-t{font-weight:600;font-size:14px}
.ops-card .oc-big{font-family:'Fraunces',serif;font-size:32px;line-height:1;margin:2px 0}
.ops-card .oc-sub{font-size:11.5px;color:var(--ink-soft)}
.ops-card .oc-rows{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ops-card .ocr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ops-card .ocr b{font-family:'Fraunces',serif}
.ops-card .oc-link{margin-top:11px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ops-card.warn{border-color:#f0c9a8;background:linear-gradient(140deg,#fff,#fdeee3)}
.load-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.load-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}.load-bar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--teal-soft);color:var(--teal-deep)}.badge.busy{background:#fbeccb;color:#9a6a1e}.badge.over{background:#f4d3cb;color:#9a3b2c}
.subtab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.subtab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.subtab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.kpi-bar{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;min-width:90px}.kpi-bar i{display:block;height:100%;background:var(--teal)}
.num-strong{font-family:'Fraunces',serif;font-weight:600}
.role-chip{font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--bg-2);font-weight:500}
.kpi-big{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi-big .kb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi-big .kb .kv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.kpi-big .kb .kl{font-size:11.5px;color:var(--ink-soft)}
.kpi-big .kb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.kpi-big .kb.warn .kv{color:#9a5a1e}
.kpi-big .kb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.kpi-big .kb.good .kv{color:var(--teal-deep)}
.region-block{margin-bottom:22px}
.region-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.region-head .rg-ic{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.region-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0}
.region-head .rg-sum{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ov-table td{padding:10px;border-bottom:1px solid var(--line)}
.ov-table tr.clickable{cursor:pointer;transition:.12s}.ov-table tr.clickable:hover td{background:var(--teal-soft)}
.ov-cn{font-weight:600}.ov-cn small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut-c{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut-c b{font-family:'Fraunces',serif;font-size:17px;display:block}.donut-c span{font-size:10px;color:var(--ink-soft)}
.leg-list{display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.leg-row .dot{width:11px;height:11px;border-radius:3px;flex:none}.leg-row b{margin-left:auto;font-family:'Fraunces',serif}
@media(max-width:900px){.snap,.ops-grid,.kpi-big{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('warranty');
const right=`<button class="btn btn-teal" onclick="document.getElementById('mkbh').scrollIntoView({behavior:'smooth'})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Tạo phiếu bảo hành</button>`;
document.getElementById('main').innerHTML = topbar('Danh mục','Bảo hành dịch vụ',{who:'CS',branch:'CN Quận 1',right}) + `
  <div class="snap">
    <div class="sb good"><div class="sl">Ca còn trong hạn BH</div><div class="sv">312</div><div class="sl">toàn CN</div></div>
    <div class="sb warn"><div class="sl">Yêu cầu chờ xử lý</div><div class="sv">5</div><div class="sl">cần duyệt</div></div>
    <div class="sb"><div class="sl">Đã làm lại MP (tháng)</div><div class="sv">18</div><div class="sl">miễn phí</div></div>
    <div class="sb warn"><div class="sl">Sắp hết hạn (7 ngày)</div><div class="sv">7</div><div class="sl">nhắc khách</div></div>
  </div>

  <div class="subtab" id="st">
    <button class="on" onclick="tab('tickets')">Phiếu bảo hành tại CN</button>
    <button onclick="tab('policy')">Chính sách BH theo SKU / group</button>
    <button onclick="tab('create')">Tạo phiếu từ gói/SKU đã mua</button>
  </div>
  <div id="wv"></div>`;
const WV=document.getElementById('wv');

/* ===== Chính sách BH: group (mặc định) + SKU lẻ override ===== */
const POLICY=[
  {grp:'Triệt lông', dur:'5 năm', skus:[
    {sku:'Triệt lông Diode toàn thân', dur:'5 năm', cond:'Lông mọc lại vùng đã triệt đủ buổi'},
    {sku:'Triệt lông nách / bikini', dur:'3 năm', cond:'Override: vùng nhỏ, BH 3 năm', override:true},
  ]},
  {grp:'Giảm béo & body', dur:'3 tháng', skus:[
    {sku:'Giảm béo RF bụng', dur:'3 tháng', cond:'Không giảm theo cam kết khi tuân thủ chế độ'},
    {sku:'Nâng cơ HIFU mặt', dur:'6 tháng', cond:'Override: HIFU BH 6 tháng', override:true},
  ]},
  {grp:'Da liễu / điều trị', dur:'1 tháng', skus:[
    {sku:'Điều trị mụn cốc', dur:'1 tháng', cond:'Mụn tái phát vùng điều trị trong 1 tháng'},
    {sku:'Trị nám laser', dur:'2 tháng', cond:'Override: nám đậm lại', override:true},
  ]},
  {grp:'Tóc (Derma & Hair)', dur:'1 tháng', skus:[
    {sku:'Phục hồi tóc hư tổn', dur:'1 tháng', cond:'Tóc hư tổn lại trong thời hạn'},
  ]},
];

/* ===== Phiếu BH tạo tại CN ===== */
const TICKETS=[
  {id:'BH-1042', cust:'Trần Thu Hà', cid:'C-1042', sku:'Triệt lông Diode toàn thân', src:'Gói PKG-LASER-8 · RC-0825', left:'còn 4 năm 8 tháng', issue:'Lông mọc lại vùng nách', st:'wait', stl:'Chờ duyệt'},
  {id:'BH-1039', cust:'Ngô Khánh', cid:'C-1136', sku:'Nâng cơ HIFU mặt', src:'SKU lẻ · RC-0836', left:'còn 4 tháng', issue:'Hiệu quả chưa rõ rệt', st:'wait', stl:'Chờ BS đánh giá'},
  {id:'BH-1035', cust:'Lê Minh', cid:'C-1080', sku:'Giảm béo RF bụng', src:'Gói PKG-RF-10 · RC-0830', left:'còn 1 tháng', issue:'Vùng eo chưa đạt', st:'done', stl:'Đã duyệt · đặt lịch'},
  {id:'BH-1028', cust:'Trần Thu Hà', cid:'C-1042', sku:'Điều trị mụn cốc', src:'SKU lẻ · RC-0812', left:'hết hạn 3 ngày trước', issue:'Mụn tái phát', st:'expired', stl:'Quá hạn'},
];
const stB={wait:'busy',done:'ok',expired:'over'};

const VIEWS={
tickets:`<div class="panel" style="padding:6px 4px"><div class="panel-h" style="padding:12px 14px 4px"><div class="panel-title">Phiếu bảo hành tạo tại CN Quận 1<small>liên kết SKU/gói gốc khách đã mua</small></div>
    <div class="pill-tabs"><button class="on">Tất cả</button><button>Chờ xử lý</button><button>Đã duyệt</button><button>Quá hạn</button></div></div>
  <table class="ov-table"><thead><tr><th>Phiếu BH</th><th>Khách</th><th>SKU bảo hành</th><th>Nguồn (gói/SKU · phiếu mua)</th><th>Còn hạn</th><th>Vấn đề</th><th>Trạng thái</th></tr></thead><tbody>
    ${TICKETS.map(t=>`<tr class="clickable" onclick="location.href='customer-detail.html?id=${t.cid}'">
      <td><b style="font-family:Consolas,monospace;color:var(--teal-deep)">${t.id}</b></td><td>${t.cust}</td><td>${t.sku}</td>
      <td><span style="font-size:11.5px">${t.src}</span></td><td>${t.st==='expired'?`<span style="color:var(--rose)">${t.left}</span>`:t.left}</td><td>${t.issue}</td>
      <td><span class="badge ${stB[t.st]}">${t.stl}</span></td></tr>`).join('')}
  </tbody></table>
  <div class="alert al-info" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Phiếu BH duyệt → tạo buổi dịch vụ <b>miễn phí</b> (không trừ gói/ví), ghi nhận lý do để báo cáo chất lượng. Mỗi phiếu gắn về SKU/gói gốc khách đã mua.</div></div></div>`,

policy:`<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px">Chính sách cấu hình ở mức <b>group</b> (áp mặc định cho mọi SKU trong nhóm) và có thể <b>override theo SKU lẻ</b>. Cấu hình chi tiết SKU (step/skill/máy) xem ở <a href="catalog-service-detail.html" style="color:var(--teal-deep)">Danh mục dịch vụ</a>.</div>
  ${POLICY.map(g=>`<div class="region-block"><div class="region-head"><div class="rg-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><h3>${g.grp}</h3><div class="rg-sum">BH mặc định nhóm: <b>${g.dur}</b></div></div>
    <div class="panel" style="padding:6px 4px"><table class="ov-table"><thead><tr><th>SKU</th><th>Thời hạn BH</th><th>Điều kiện làm lại miễn phí</th><th>Cấu hình</th></tr></thead><tbody>
      ${g.skus.map(s=>`<tr><td><a href="catalog-service-detail.html" style="color:var(--teal-deep);font-weight:600">${s.sku}</a></td><td><span class="badge ok">${s.dur}</span></td><td style="font-size:12.5px">${s.cond}</td><td>${s.override?'<span class="badge busy">Override SKU</span>':'<span class="role-chip">Theo group</span>'}</td></tr>`).join('')}
    </tbody></table></div></div>`).join('')}`,

create:`<div id="mkbh" class="panel"><div class="panel-h"><div class="panel-title">Tạo phiếu bảo hành<small>chọn từ gói / SKU lẻ khách ĐÃ MUA — chỉ tạo được khi còn trong hạn BH</small></div></div>
  <div class="filt-bar" style="margin-bottom:14px"><input class="search" id="cq" placeholder="🔍 Tìm khách (tên / mã KH)..." style="flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px"><button class="btn btn-ghost" onclick="findCust()">Tra cứu</button></div>
  <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px">Ví dụ khách <b>Trần Thu Hà (C-1042)</b> — các gói/SKU đã mua đủ điều kiện tạo BH:</div>
  <table class="ov-table"><thead><tr><th>Gói / SKU đã mua</th><th>Phiếu mua gốc</th><th>Thời hạn BH</th><th>Còn hạn</th><th>Tạo phiếu</th></tr></thead><tbody>
    <tr><td><b>Triệt lông Diode toàn thân</b><span style="display:block;font-size:11px;color:var(--ink-soft)">Gói PKG-LASER-8 (8 buổi · đã xong)</span></td><td><a href="cashier-payment.html" style="color:var(--teal-deep)">RC-0825</a></td><td>5 năm</td><td><span class="badge ok">còn 4 năm 8 tháng</span></td><td><button class="btn btn-teal" style="padding:5px 12px;font-size:12px" onclick="alert('Tạo phiếu BH cho Triệt lông Diode — gắn về RC-0825.')">Tạo BH</button></td></tr>
    <tr><td><b>Giảm béo RF bụng</b><span style="display:block;font-size:11px;color:var(--ink-soft)">Gói PKG-RF-10 (đang dùng 1/10)</span></td><td><a href="cashier-payment.html" style="color:var(--teal-deep)">RC-0825</a></td><td>3 tháng</td><td><span class="badge busy">chưa hoàn tất gói</span></td><td><button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" disabled>Chưa đủ ĐK</button></td></tr>
    <tr><td><b>Điều trị mụn cốc</b><span style="display:block;font-size:11px;color:var(--ink-soft)">SKU lẻ</span></td><td><a href="cashier-payment.html" style="color:var(--teal-deep)">RC-0812</a></td><td>1 tháng</td><td><span style="color:var(--rose)">hết hạn</span></td><td><button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" disabled>Quá hạn BH</button></td></tr>
  </tbody></table>
  <div class="alert al-info" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Phiếu BH chỉ tạo được từ <b>gói/SKU khách đã mua</b> và <b>còn trong hạn bảo hành</b> tính theo chính sách SKU/group. Thời hạn bắt đầu từ buổi cuối của gói (hoặc ngày làm với SKU lẻ).</div></div></div>`,
};
function tab(k){document.querySelectorAll('#st button').forEach(b=>b.classList.remove('on'));const i={tickets:0,policy:1,create:2}[k];document.querySelectorAll('#st button')[i].classList.add('on');WV.innerHTML=VIEWS[k];}
function findCust(){alert('Tra cứu khách + nạp gói/SKU đã mua đủ ĐK bảo hành.');}
window.tab=tab; window.findCust=findCust; tab('tickets');
</script>
</body></html>
