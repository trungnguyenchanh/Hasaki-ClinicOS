<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Báo cáo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.rep-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:6px}
.rep-card{border:1px solid var(--line);border-radius:18px;padding:24px;background:#fff;cursor:pointer;transition:.18s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.rep-card:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-3px)}
.rep-card .rc-ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin-bottom:16px}
.rep-card .rc-ic svg{width:26px;height:26px}
.rc-ic.ops{background:var(--teal-soft);color:var(--teal-deep)}
.rc-ic.sales{background:#fbeccb;color:#9a6a1e}
.rc-ic.kpi{background:#e6e0f5;color:#6b54b8}
.rep-card h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 7px}
.rep-card p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0 0 16px;flex:1}
.rep-card .rc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.rep-card .rc-tag{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--bg-2);color:var(--ink-soft)}
.rep-card .rc-go{font-size:13px;font-weight:600;color:var(--teal-deep);display:flex;align-items:center;gap:5px}
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:24px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:27px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
@media(max-width:900px){.rep-menu{grid-template-columns:1fr}.snap{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('reports');
const right=`<button class="btn btn-ghost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Xuất Excel</button>`;
document.getElementById('main').innerHTML = topbar('Quản trị','Báo cáo · Trung tâm điều hành',{who:'HQ',branch:'Tất cả CN',right}) + `
  <div style="font-size:13px;color:var(--ink-soft);margin-bottom:18px">Góc nhìn quản lý cấp cao — chọn nhóm báo cáo để theo dõi tình hình vận hành & kinh doanh toàn chuỗi.</div>
  <div class="snap">
    <div class="sb"><div class="sl">Doanh thu hôm nay</div><div class="sv">487tr</div><div class="sl">▲ 8% so hôm qua</div></div>
    <div class="sb"><div class="sl">Khách đang phục vụ / chờ</div><div class="sv">16 / 14</div><div class="sl">toàn hệ thống</div></div>
    <div class="sb warn"><div class="sl">CN cần chú ý</div><div class="sv">2</div><div class="sl">quá tải / ùn khách</div></div>
    <div class="sb good"><div class="sl">KPI đạt mục tiêu</div><div class="sv">5/6</div><div class="sl">nhóm nghiệp vụ</div></div>
  </div>
  <div class="rep-menu">
    <a class="rep-card" href="report-ops.html">
      <div class="rc-ic ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
      <h3>Report Vận hành</h3>
      <p>Ảnh chụp realtime tình hình đang diễn ra: khách chờ lấy số, tư vấn, booking, khám bệnh, điều phối bác sĩ & nhân viên.</p>
      <div class="rc-tags"><span class="rc-tag">Realtime</span><span class="rc-tag">Hàng đợi</span><span class="rc-tag">Điều phối</span></div>
      <div class="rc-go">Mở báo cáo vận hành <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </a>
    <a class="rep-card" href="report-sales.html">
      <div class="rc-ic sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 14l4-4 4 4 5-6"/></svg></div>
      <h3>Report Sales</h3>
      <p>Tình hình kinh doanh: tổng toàn chuỗi, theo khu vực, từng chi nhánh, theo khách hàng, dịch vụ và sản phẩm.</p>
      <div class="rc-tags"><span class="rc-tag">Doanh thu</span><span class="rc-tag">Khu vực / CN</span><span class="rc-tag">Dịch vụ / SP</span></div>
      <div class="rc-go">Mở báo cáo sales <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </a>
    <a class="rep-card" href="report-kpi.html">
      <div class="rc-ic kpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h3>Report KPI</h3>
      <p>Hiệu suất theo nhóm nghiệp vụ so mục tiêu: bác sĩ, KTV, tư vấn, điều dưỡng, CSKH; kèm hiệu suất máy & tiêu hao NVL.</p>
      <div class="rc-tags"><span class="rc-tag">Theo vai trò</span><span class="rc-tag">So mục tiêu</span><span class="rc-tag">Máy & NVL</span></div>
      <div class="rc-go">Mở báo cáo KPI <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </a>
  </div>`;
</script>
</body></html>
