<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Report KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ops-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.ops-card .oc-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ops-card .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.ops-card .oc-ic svg{width:17px;height:17px}
.ops-card .oc-t{font-weight:600;font-size:14px}
.ops-card .oc-big{font-family:'Fraunces',serif;font-size:32px;line-height:1;margin:2px 0}
.ops-card .oc-sub{font-size:11.5px;color:var(--ink-soft)}
.ops-card .oc-rows{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ops-card .ocr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ops-card .ocr b{font-family:'Fraunces',serif}
.ops-card .oc-link{margin-top:11px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ops-card.warn{border-color:#f0c9a8;background:linear-gradient(140deg,#fff,#fdeee3)}
.load-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.load-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}.load-bar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--teal-soft);color:var(--teal-deep)}.badge.busy{background:#fbeccb;color:#9a6a1e}.badge.over{background:#f4d3cb;color:#9a3b2c}
.subtab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.subtab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.subtab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.kpi-bar{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;min-width:90px}.kpi-bar i{display:block;height:100%;background:var(--teal)}
.num-strong{font-family:'Fraunces',serif;font-weight:600}
.role-chip{font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--bg-2);font-weight:500}
.kpi-big{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi-big .kb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi-big .kb .kv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.kpi-big .kb .kl{font-size:11.5px;color:var(--ink-soft)}
.kpi-big .kb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.kpi-big .kb.warn .kv{color:#9a5a1e}
.kpi-big .kb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.kpi-big .kb.good .kv{color:var(--teal-deep)}
.region-block{margin-bottom:22px}
.region-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.region-head .rg-ic{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.region-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0}
.region-head .rg-sum{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ov-table td{padding:10px;border-bottom:1px solid var(--line)}
.ov-table tr.clickable{cursor:pointer;transition:.12s}.ov-table tr.clickable:hover td{background:var(--teal-soft)}
.ov-cn{font-weight:600}.ov-cn small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut-c{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut-c b{font-family:'Fraunces',serif;font-size:17px;display:block}.donut-c span{font-size:10px;color:var(--ink-soft)}
.leg-list{display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.leg-row .dot{width:11px;height:11px;border-radius:3px;flex:none}.leg-row b{margin-left:auto;font-family:'Fraunces',serif}
@media(max-width:900px){.snap,.ops-grid,.kpi-big{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('reports');
const back=`<a class="btn btn-ghost" href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Trung tâm báo cáo</a>`;
document.getElementById('main').innerHTML = topbar('Quản trị','Report KPI · Hiệu suất',{who:'HQ',branch:'Tất cả CN',right:back}) + `
  <div class="snap">
    <div class="sb good"><div class="sl">Nhóm đạt mục tiêu</div><div class="sv">5/6</div><div class="sl">nhóm nghiệp vụ</div></div>
    <div class="sb"><div class="sl">Năng suất KTV TB</div><div class="sv">92%</div><div class="sl">▲ 4%</div></div>
    <div class="sb warn"><div class="sl">Vi phạm giành khách</div><div class="sv">1</div><div class="sl">mục tiêu 0</div></div>
    <div class="sb"><div class="sl">NPS khách</div><div class="sv">4.8★</div><div class="sl">trên 5</div></div>
  </div>
  <div class="subtab" id="st">
    <button class="on" onclick="sub('staff')">KPI nhân sự</button><button onclick="sub('machine')">Hiệu suất máy</button><button onclick="sub('nvl')">Tiêu hao NVL</button><button onclick="sub('consult')">Tư vấn & giữ khách</button>
  </div>
  <div id="kv"></div>`;
const KV=document.getElementById('kv');
const VIEWS={
staff:`<div class="panel"><div class="panel-h"><div class="panel-title">KPI theo nhóm nghiệp vụ<small>Quản lý theo vai trò · so mục tiêu</small></div></div>
  <table><thead><tr><th>Nhóm</th><th>Chỉ số chính</th><th>Kết quả</th><th>Mục tiêu</th><th>Đạt</th></tr></thead><tbody>
    <tr><td><span class="role-chip">Bác sĩ</span></td><td>Tỷ lệ chỉ định liệu trình được chốt</td><td class="num-strong">71%</td><td>65%</td><td><div class="kpi-bar"><i style="width:88%"></i></div></td></tr><tr><td><span class="role-chip">KTV</span></td><td>Năng suất/giờ · đúng định biên NVL</td><td class="num-strong">92%</td><td>85%</td><td><div class="kpi-bar"><i style="width:92%"></i></div></td></tr><tr><td><span class="role-chip">Điều dưỡng</span></td><td>Tuân thủ quy trình</td><td class="num-strong">98%</td><td>95%</td><td><div class="kpi-bar"><i style="width:98%"></i></div></td></tr><tr><td><span class="role-chip">Tư vấn viên</span></td><td>Tỷ lệ chốt · vi phạm giành khách</td><td class="num-strong">68% · 1</td><td>60% · 0</td><td><div class="kpi-bar"><i style="width:90%"></i></div></td></tr><tr><td><span class="role-chip">CSKH</span></td><td>Tỷ lệ tái booking · NPS</td><td class="num-strong">54% · 4.8</td><td>50%</td><td><div class="kpi-bar"><i style="width:86%"></i></div></td></tr><tr><td><span class="role-chip">Học việc</span></td><td>Tiến bộ tay nghề · buổi có giám sát</td><td class="num-strong">+2 cấp · 100%</td><td>—</td><td><div class="kpi-bar"><i style="width:70%"></i></div></td></tr>
  </tbody></table>
  <div class="panel" style="margin-top:18px;box-shadow:none;border:1px dashed var(--line)"><div class="panel-h"><div class="panel-title" style="font-size:14px">KPI theo khu vực<small>tỷ lệ nhóm đạt mục tiêu</small></div></div>
    <table><thead><tr><th>Khu vực</th><th>Nhóm đạt</th><th>Năng suất TB</th><th>Tuân thủ</th><th>Đánh giá</th></tr></thead><tbody>
      <tr><td><b>TP. Hồ Chí Minh</b></td><td>6/6</td><td>93%</td><td>97%</td><td><span class="badge ok">Tốt</span></td></tr><tr><td><b>Hà Nội</b></td><td>5/6</td><td>90%</td><td>96%</td><td><span class="badge ok">Tốt</span></td></tr><tr><td><b>Đà Nẵng</b></td><td>4/6</td><td>87%</td><td>94%</td><td><span class="badge busy">Theo dõi</span></td></tr>
    </tbody></table></div></div>`,
machine:`<div class="panel"><div class="panel-h"><div class="panel-title">Hiệu suất thiết bị cao cấp<small>Giờ hoạt động · doanh thu sinh ra · ROI</small></div></div>
  <table><thead><tr><th>Thiết bị</th><th>Giá trị</th><th>Giờ HĐ/tháng</th><th>Hiệu suất</th><th>Doanh thu sinh ra</th><th>Số buổi</th><th>Tình trạng</th></tr></thead><tbody>
    <tr><td><b>Laser Diode (×3)</b></td><td>1,8 tỷ</td><td>540h</td><td>84%</td><td class="num-strong">2,1 tỷ</td><td>2.140</td><td><span class="badge ok">Tối ưu</span></td></tr><tr><td><b>Máy RF Slim (×2)</b></td><td>900tr</td><td>320h</td><td>71%</td><td class="num-strong">1,2 tỷ</td><td>720</td><td><span class="badge ok">Tốt</span></td></tr><tr><td><b>Máy HIFU (×1)</b></td><td>1,2 tỷ</td><td>180h</td><td>52%</td><td class="num-strong">680tr</td><td>240</td><td><span class="badge busy">Dưới tải</span></td></tr><tr><td><b>Máy soi da AI (×2)</b></td><td>400tr</td><td>410h</td><td>89%</td><td class="num-strong">—</td><td>1.640</td><td><span class="badge ok">Tối ưu</span></td></tr>
  </tbody></table></div>`,
nvl:`<div class="panel"><div class="panel-h"><div class="panel-title">Tiêu hao NVL — định biên vs thực tế<small>Phát hiện thất thoát / lãng phí</small></div></div>
  <table><thead><tr><th>Vật tư</th><th>Định mức (BOM)</th><th>Thực tế</th><th>Chênh lệch</th><th>Chi phí chênh</th><th>Đánh giá</th></tr></thead><tbody>
    <tr><td><b>Gel lạnh triệt lông</b></td><td>1.070 ml</td><td>1.240 ml</td><td style="color:var(--rose)">+16%</td><td style="color:var(--rose)">+3,4tr</td><td><span class="badge over">Vượt định mức</span></td></tr><tr><td><b>Đầu cartridge HIFU</b></td><td>240</td><td>232</td><td style="color:var(--teal-deep)">−3%</td><td style="color:var(--teal-deep)">−0,9tr</td><td><span class="badge ok">Trong định mức</span></td></tr><tr><td><b>Tinh chất phục hồi</b></td><td>1.680 ml</td><td>1.710 ml</td><td>+2%</td><td>+0,3tr</td><td><span class="badge ok">Chấp nhận</span></td></tr><tr><td><b>Mặt nạ chuyên dụng</b></td><td>1.680</td><td>1.890</td><td style="color:var(--rose)">+13%</td><td style="color:var(--rose)">+2,1tr</td><td><span class="badge busy">Theo dõi</span></td></tr>
  </tbody></table></div>`,
consult:`<div class="panel"><div class="panel-h"><div class="panel-title">Hiệu quả tư vấn viên<small>Chốt · giá trị gói · giữ khách · chống giành khách</small></div></div>
  <table><thead><tr><th>Tư vấn viên</th><th>Khách phụ trách</th><th>Tỷ lệ chốt</th><th>Gói TB</th><th>Giữ khách</th><th>Vi phạm</th></tr></thead><tbody>
    <tr><td><b>Quỳnh Trang</b></td><td>148</td><td class="num-strong">72%</td><td>4,1tr</td><td>61%</td><td><span class="badge ok">0</span></td></tr><tr><td><b>Thảo Nguyên</b></td><td>132</td><td class="num-strong">66%</td><td>3,6tr</td><td>54%</td><td><span class="badge over">1</span></td></tr><tr><td><b>Mỹ Ngọc</b></td><td>119</td><td class="num-strong">69%</td><td>3,8tr</td><td>58%</td><td><span class="badge ok">0</span></td></tr><tr><td><b>Hồng Ánh</b></td><td>97</td><td class="num-strong">64%</td><td>3,2tr</td><td>52%</td><td><span class="badge ok">0</span></td></tr>
  </tbody></table></div>`,
};
function sub(k){document.querySelectorAll('#st button').forEach(b=>b.classList.remove('on'));const idx={staff:0,machine:1,nvl:2,consult:3}[k];document.querySelectorAll('#st button')[idx].classList.add('on');KV.innerHTML=VIEWS[k];}
window.sub=sub; sub('staff');
</script>
</body></html>
