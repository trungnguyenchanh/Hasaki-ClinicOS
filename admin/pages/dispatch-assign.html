<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki Clinic · Điều phối cho khách</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.cand{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;transition:.16s;cursor:pointer;background:#fff}
.cand:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.cand.best{border-color:var(--teal);background:linear-gradient(140deg,#fff,var(--teal-soft))}
.cand-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cand-top .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.cand-top .sub{font-size:12px;color:var(--ink-soft)}
.score{margin-left:auto;text-align:center}
.score b{font-family:'Fraunces',serif;font-size:22px;display:block;color:var(--teal-deep)}
.score span{font-size:10px;color:var(--ink-soft);letter-spacing:.5px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.metric{background:var(--bg-2);border-radius:10px;padding:8px 10px;text-align:center}
.metric b{font-family:'Fraunces',serif;font-size:15px;display:block}
.metric span{font-size:10.5px;color:var(--ink-soft)}
.metric.warn b{color:var(--rose)}
.metric.good b{color:var(--teal-deep)}
.skill-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.sc{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--teal-soft);color:var(--teal-deep);font-weight:500}
.sc.miss{background:#f6e1e1;color:var(--rose)}
.rule-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rule-row:last-child{border:none}
.rule-row .ri{flex:1}.rule-row .ri b{font-size:13.5px;display:block}.rule-row .ri span{font-size:12px;color:var(--ink-soft)}
.switch{width:42px;height:24px;border-radius:20px;background:var(--teal);position:relative;cursor:pointer;flex:none}
.switch.off{background:var(--line)}
.switch::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.off::after{right:21px}
.rule-val{font-family:'Fraunces',serif;font-weight:600;font-size:14px;width:90px;text-align:right}
.formula{background:#1d2a28;color:#d7ece4;border-radius:13px;padding:14px 16px;font-family:Consolas,monospace;font-size:12.5px;line-height:1.7;overflow-x:auto}
.formula .k{color:#7fd1c0}.formula .n{color:#e8c87a}

/* ===== Bàn điều phối mới ===== */
.peak-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:13px;margin-bottom:16px;font-size:13px}
.peak-bar.hot{background:linear-gradient(90deg,#fdeee3,#fbe3d8);border:1px solid #f0c9a8;color:#9a5a1e}
.peak-bar.calm{background:var(--teal-soft);border:1px solid #bfe3da;color:var(--teal-deep)}
.peak-bar svg{width:20px;height:20px;flex:none}
.peak-bar .pulse{width:10px;height:10px;border-radius:50%;background:#e8763a;flex:none;animation:pp 1.2s infinite}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(232,118,58,.5)}70%{box-shadow:0 0 0 8px rgba(232,118,58,0)}100%{box-shadow:0 0 0 0 rgba(232,118,58,0)}}

.wq{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;cursor:pointer;transition:.16s;background:#fff}
.wq:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.wq.sel{border-color:var(--teal-deep);background:linear-gradient(140deg,#fff,var(--teal-soft));box-shadow:0 4px 14px rgba(15,118,110,.14)}
.wq-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.wq-top .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.wq-top .wt{margin-left:auto;text-align:right;white-space:nowrap}
.wq-top .wt b{font-family:'Fraunces',serif;font-size:16px;color:var(--ink)}
.wq-top .wt.over b{color:var(--rose)}
.wq-top .wt span{font-size:10.5px;color:var(--ink-soft);display:block}
.wq-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:9px}
.wq-stat{background:var(--bg-2);border-radius:9px;padding:7px 4px;text-align:center}
.wq-stat b{font-family:'Fraunces',serif;font-size:15px;display:block;line-height:1}
.wq-stat span{font-size:9.5px;color:var(--ink-soft);letter-spacing:.2px}
.wq-stat.mach b{color:var(--indigo)}
.wq-sku{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}
.wq-sku .sl{display:flex;align-items:center;gap:7px;font-size:12px}
.wq-sku .sl .sn{flex:1}
.wq-sku .sl .req{display:flex;gap:4px}
.tag-major{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--indigo-soft);color:var(--indigo)}
.tag-skill{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;background:var(--teal-soft);color:var(--teal-deep)}
.tag-mach{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:#ece9fb;color:#5a4bd0}

/* nhân sự */
.stf{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.stf:last-child{border:none}
.stf .info{flex:1}.stf .info b{font-size:13.5px}.stf .info span{font-size:11.5px;color:var(--ink-soft);display:block}
.stf .shift{font-size:11px;color:var(--ink-soft);font-family:Consolas,monospace}
.st-dot{width:9px;height:9px;border-radius:50%;flex:none}
.st-avail{background:#3fae7a}.st-busy{background:#e0a13a}.st-break{background:#c9543f}.st-off{background:var(--line)}
.st-pill{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px}
.sp-avail{background:#e3f3ea;color:#2e7d54}.sp-busy{background:#fbf0db;color:#9a6a1e}.sp-break{background:#f9e2dd;color:#a64b4b}.sp-off{background:var(--bg-2);color:var(--ink-soft)}
.req-by{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:#fdefc9;color:#8a6a14}

/* auto-engine + van xả */
.auto-bar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:linear-gradient(120deg,#1d2a28,#244640);color:#d7ece4;margin-bottom:16px}
.auto-bar .led{width:11px;height:11px;border-radius:50%;background:#5fe0a8;flex:none;animation:pp 1.6s infinite}
.auto-bar b{color:#fff}
.auto-bar .mode{margin-left:auto;display:flex;gap:8px}
.auto-pill{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.12);color:#d7ece4;border:none;cursor:pointer}
.auto-pill.on{background:#5fe0a8;color:#10302a}
.esc-step{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.esc-step:last-child{border:none}
.esc-num{width:24px;height:24px;border-radius:7px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.esc-step.danger .esc-num{background:#f9e2dd;color:#a64b4b}
.esc-step .et b{font-size:13px}.esc-step .et span{font-size:12px;color:var(--ink-soft)}
/* anomaly */
.anom{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid #f0d0c9;background:#fdf3f0;border-radius:12px;margin-bottom:9px}
.anom.warn{border-color:#f0d9a8;background:#fdf6e8}
.anom .ai{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.anom.flag .ai{background:#f9e2dd;color:#a64b4b}.anom.warn .ai{background:#fbeccb;color:#9a6a1e}
.anom .ax{flex:1}.anom .ax b{font-size:13px}.anom .ax span{font-size:12px;color:var(--ink-soft);display:block;margin-top:2px}
.anom .sev{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.sev-hi{background:#f4c9c0;color:#9a3b2c}.sev-md{background:#f6e1b8;color:#8a6a14}
/* full width — mọi box xếp dọc 100% */
#view .row{grid-template-columns:1fr !important}
#view .panel{position:static !important}
/* fix card anomaly không bị ép chiều cao */
.anom{height:auto !important;width:100%;box-sizing:border-box}
.anom .ai{display:inline-flex;align-items:center;justify-content:center}
.anom .ai svg{width:16px;height:16px}
.anom .ax{flex:1;min-width:0}
.anom .ai,.anom .sev{align-self:flex-start}
</style></head>
<body>
<div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script src="../assets/dispatch-data.js"></script>
<script>
renderLayout('dispatch');
let manualMode = false;
let autoMode = 'full';

const selId = (typeof getParam==='function') ? getParam('id') : null;
const cust = QUEUE.find(q=>q.id===selId) || null;

const backBtn = `<a class="btn btn-ghost" href="dispatch.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Về bàn điều phối</a>`;

document.getElementById('main').innerHTML = topbar('Vận hành','Điều phối cho khách',{who:CURRENT_USER.initials,branch:CURRENT_USER.branch,right:backBtn}) + `<div id="view"></div>`;
const VIEW = document.getElementById('view');

function render(){
  if(!cust){
    VIEW.innerHTML = `<div class="row"><div class="panel" style="text-align:center;padding:40px">
      <div style="font-size:15px;color:var(--ink-soft);margin-bottom:14px">Không tìm thấy khách (thiếu hoặc sai mã <code>?id=</code>).</div>
      <a class="btn btn-teal" href="dispatch.html">← Về bàn điều phối</a></div></div>`;
    return;
  }
  const a = wqAgg(cust);
  const ranked = STAFF.map(s=>({s, ...scoreFor(s,cust)})).sort((x,y)=>y.score-x.score);
  const best = ranked[0];
  VIEW.innerHTML = `
  <div class="auto-bar">
    <span class="led"></span>
    <div style="flex:1"><b>${autoMode==='full'?'TỰ ĐỘNG HOÀN TOÀN':'BÁN TỰ ĐỘNG'}</b> — ${autoMode==='full'?'hệ tự chốt NV điểm cao nhất; quản lý chỉ giám sát & xử ngoại lệ.':'hệ đề xuất, quản lý duyệt/chỉnh trước khi chốt.'}</div>
    <div class="mode">
      <button class="auto-pill ${autoMode==='full'?'on':''}" onclick="setAuto('full')">Tự động hoàn toàn</button>
      <button class="auto-pill ${autoMode==='semi'?'on':''}" onclick="setAuto('semi')">Bán tự động</button>
    </div>
  </div>

  <div class="row">
    <div class="panel"><div class="panel-h"><div class="panel-title">Khách: ${cust.name}${cust.vip?' <span class="tag vip">VIP</span>':''}<small>${cust.id} · ${a.tickets} phiếu DV · ${a.skus} SKU · ${a.groups} nhóm · ~${fmtMin(a.mins)} · chờ ${cust.wait}p${cust.reqStaff?' · chỉ định '+cust.reqStaff:''}</small></div></div>
      <div class="wq-sku">
        ${cust.skus.map(s=>`<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0">
          <span style="flex:1">${s.n} <span style="color:var(--ink-soft)">· ${s.group} · ${fmtMin(s.mins)}${s.machine?' · ⚙ '+s.machine:''}</span></span>
          ${s.major?`<span class="sc miss">major: ${s.major}</span>`:''}${s.skill?`<span class="sc">${s.skill}</span>`:''}</div>`).join('')}
      </div>
    </div>
  </div>

  ${cust.reqStaff?`<div class="alert al-info" style="margin-bottom:16px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7L12 17l-6.5 5 2-7L2 9h7z"/></svg><div>Khách <b>chỉ định ${cust.reqStaff}</b> qua booking và <b>chấp nhận chờ</b> — không tính cảnh báo trễ cho khách này.</div></div>`:''}
  ${(peak.hot && cust.wait>15 && !cust.peakSafe)?`<div class="alert" style="margin-bottom:16px;background:#fdeee3;border:1px solid #f0c9a8;color:#9a5a1e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3z"/></svg><div><b>Cao điểm + chờ quá lâu:</b> ưu tiên gán NV trống gần nhất để giảm thời gian chờ, kể cả điểm chưa tối ưu nhất.</div></div>`:''}

  <div class="row">
    <div class="panel"><div class="panel-h"><div class="panel-title">Điều phối — chọn nhân viên<small>${manualMode?'Chế độ chỉnh tay — vẫn phải đủ major & skill':'Hệ tự đề xuất theo điểm · bấm Chỉnh tay để override'}</small></div>
      <button class="btn ${manualMode?'btn-teal':'btn-ghost'}" style="padding:7px 14px;font-size:12.5px" onclick="toggleManual()">${manualMode?'⟲ Về tự động':'✎ Chỉnh tay (override)'}</button></div>

      <div class="panel-title" style="font-size:13.5px;margin:4px 0 8px">Bảng so sánh nhân viên<small>Đối chiếu thông số để chọn — đã xếp theo điểm</small></div>
      <table style="margin-bottom:16px"><thead><tr><th>Nhân viên</th><th>Điểm</th><th>Tua/CS</th><th>Công ca</th><th>Major</th><th>Khớp skill</th><th>Liên tục</th></tr></thead><tbody>
        ${ranked.map(r=>{const s=r.s; const mm=r.needMajors.length&&!r.hasAllMajor; return `<tr${mm?' style="opacity:.5"':''}>
          <td><b>${s.nm}</b> <span style="color:var(--ink-soft);font-size:11px">· ${s.sub}</span></td>
          <td><b style="color:var(--teal-deep)">${r.score.toFixed(2)}</b></td>
          <td>${s.tua}/${s.tuaMax}</td><td>${s.cong}</td>
          <td>${mm?'<span style="color:var(--rose)">✕ thiếu</span>':'<span style="color:var(--teal-deep)">✓</span>'}</td>
          <td>${Math.round(r.skillMatch*100)}%</td>
          <td>${r.continuity?'★ chỉ định':'—'}</td></tr>`;}).join('')}
      </tbody></table>

      <div id="cands"></div>
    </div>
  </div>

  <div class="row">
    <div class="panel"><div class="panel-h"><div class="panel-title">Cách tính điểm điều phối</div></div>
      <div class="formula"><span class="k">score</span> = <span class="n">0.35</span>·skillMatch + <span class="n">0.25</span>·(1 − loadRatio) + <span class="n">0.15</span>·(1 − payBalance) + <span class="n">0.15</span>·continuity + <span class="n">0.10</span>·vipPriority</div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:14px;line-height:1.7">
      • <b>skillMatch</b>: khớp kỹ năng & cấp độ; <b>major (bác sĩ/tóc…) bắt buộc</b>, thiếu là loại.<br>
      • <b>loadRatio</b>: số tua đang gánh / công suất ca.<br>
      • <b>payBalance</b>: tổng tiền công trong ca so với nhóm.<br>
      • <b>continuity</b>: đã từng / được khách chỉ định.<br>
      • <b>vipPriority</b>: ưu tiên KTV senior cho khách VIP.</div>
    </div>
  </div>`;
  renderCands(ranked, best, cust);
}
function renderCands(ranked, best, cust){
  document.getElementById('cands').innerHTML = ranked.map((r)=>{
    const s=r.s; const isBest = r===best && !manualMode;
    const dim = s.status==='off';
    const majorMiss = r.needMajors.length && !r.hasAllMajor;
    return `<div class="cand ${isBest?'best':''}" style="${dim?'opacity:.5':''}">
      <div class="cand-top"><div class="q-av ${s.av}">${s.nm.split(' ').slice(-1)[0].slice(0,2)}</div>
        <div><div class="nm">${s.nm}
          ${isBest?'<span class="tag done">Đề xuất tốt nhất</span>':''}
          ${r.continuity?'<span class="tag new">Khách chỉ định</span>':''}
          ${s.status==='off'?'<span class="tag" style="background:var(--bg-2);color:var(--ink-soft)">Chưa check-in</span>':''}</div>
          <div class="sub">${s.sub} · ca ${s.shift}</div></div>
        <div class="score"><b>${r.score.toFixed(2)}</b><span>ĐIỂM</span></div></div>
      <div class="metrics">
        <div class="metric ${r.loadRatio<=0.4?'good':''}"><b>${s.tua}/${s.tuaMax}</b><span>Tua đang làm</span></div>
        <div class="metric"><b>${s.cong}</b><span>Tổng công ca</span></div>
        <div class="metric ${majorMiss?'warn':'good'}"><b>${majorMiss?'✕':'✓'}</b><span>${r.needMajors.length?r.needMajors.join('/'):'Không cần major'}</span></div>
        <div class="metric ${r.skillMatch>=0.6?'good':(r.skillMatch>0?'':'warn')}"><b>${Math.round(r.skillMatch*100)}%</b><span>Khớp skill</span></div>
      </div>
      <div class="skill-chips">${s.skills.map(k=>`<span class="sc">${k}</span>`).join('')}
        <span style="margin-left:auto">${
          majorMiss ? `<button class="btn btn-ghost" style="padding:6px 14px;font-size:12px" disabled>Thiếu major bắt buộc</button>`
          : (r.eligible ? `<button class="btn ${isBest?'btn-teal':'btn-ghost'}" style="padding:6px 14px;font-size:12px" onclick="assign('${s.nm}',${manualMode})">${manualMode?'Override gán':'Phân công'}</button>`
            : `<button class="btn btn-ghost" style="padding:6px 14px;font-size:12px" disabled>Không đủ skill</button>`)
        }</span>
      </div>
    </div>`;
  }).join('');
}
function setAuto(m){ autoMode=m; render(); }
function toggleManual(){ manualMode=!manualMode; render(); }
function assign(n, manual){ alert((manual?'[CHỈNH TAY] ':'')+'Đã phân công cho '+n+' cho khách '+cust.name+'. Ghi nhận audit điều phối'+(manual?' (override rule).':'.')); }
render();
</script>
</body></html>
