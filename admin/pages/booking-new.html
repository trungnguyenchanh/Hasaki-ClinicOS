<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasaki ClinicOS · Tạo booking mới</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.snap .sb{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff}
.snap .sb .sv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.snap .sb .sl{font-size:11.5px;color:var(--ink-soft)}
.snap .sb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.snap .sb.warn .sv{color:#9a5a1e}
.snap .sb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.snap .sb.good .sv{color:var(--teal-deep)}
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ops-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}
.ops-card .oc-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ops-card .oc-ic{width:32px;height:32px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.ops-card .oc-ic svg{width:17px;height:17px}
.ops-card .oc-t{font-weight:600;font-size:14px}
.ops-card .oc-big{font-family:'Fraunces',serif;font-size:32px;line-height:1;margin:2px 0}
.ops-card .oc-sub{font-size:11.5px;color:var(--ink-soft)}
.ops-card .oc-rows{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.ops-card .ocr{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ops-card .ocr b{font-family:'Fraunces',serif}
.ops-card .oc-link{margin-top:11px;font-size:12px;font-weight:600;color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ops-card.warn{border-color:#f0c9a8;background:linear-gradient(140deg,#fff,#fdeee3)}
.load-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.load-bar{flex:1;height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden}.load-bar i{display:block;height:100%}
.badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--teal-soft);color:var(--teal-deep)}.badge.busy{background:#fbeccb;color:#9a6a1e}.badge.over{background:#f4d3cb;color:#9a3b2c}
.subtab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.subtab button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--ink-soft)}
.subtab button.on{background:var(--teal-soft);color:var(--teal-deep);border-color:var(--teal);font-weight:600}
.kpi-bar{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;min-width:90px}.kpi-bar i{display:block;height:100%;background:var(--teal)}
.num-strong{font-family:'Fraunces',serif;font-weight:600}
.role-chip{font-size:11.5px;padding:3px 11px;border-radius:20px;background:var(--bg-2);font-weight:500}
.kpi-big{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi-big .kb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.kpi-big .kb .kv{font-family:'Fraunces',serif;font-size:26px;line-height:1;margin:5px 0 2px}
.kpi-big .kb .kl{font-size:11.5px;color:var(--ink-soft)}
.kpi-big .kb.warn{background:linear-gradient(140deg,#fff,#fdeee3);border-color:#f0c9a8}.kpi-big .kb.warn .kv{color:#9a5a1e}
.kpi-big .kb.good{background:linear-gradient(140deg,#fff,var(--teal-soft));border-color:#bfe3da}.kpi-big .kb.good .kv{color:var(--teal-deep)}
.region-block{margin-bottom:22px}
.region-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.region-head .rg-ic{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.region-head h3{font-family:'Fraunces',serif;font-size:16px;margin:0}
.region-head .rg-sum{margin-left:auto;font-size:11.5px;color:var(--ink-soft)}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ov-table td{padding:10px;border-bottom:1px solid var(--line)}
.ov-table tr.clickable{cursor:pointer;transition:.12s}.ov-table tr.clickable:hover td{background:var(--teal-soft)}
.ov-cn{font-weight:600}.ov-cn small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut-c{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut-c b{font-family:'Fraunces',serif;font-size:17px;display:block}.donut-c span{font-size:10px;color:var(--ink-soft)}
.leg-list{display:flex;flex-direction:column;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}.leg-row .dot{width:11px;height:11px;border-radius:3px;flex:none}.leg-row b{margin-left:auto;font-family:'Fraunces',serif}
@media(max-width:900px){.snap,.ops-grid,.kpi-big{grid-template-columns:repeat(2,1fr)}}

.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.cal{display:grid;min-width:880px}
.cal .ch{font-size:11px;font-weight:600;color:var(--ink-soft);padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--bg-2);position:sticky;top:0}
.cal .ch.res{text-align:left;padding-left:13px;border-left:none;min-width:150px}
.cal .res-name{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:500}
.cal .slot{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:46px;padding:3px;position:relative}
.blk{border-radius:7px;padding:4px 7px;font-size:10.5px;line-height:1.25;cursor:pointer;height:100%;overflow:hidden}
.blk b{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk:hover{filter:brightness(.97)}
.blk.b-teal{background:var(--teal-soft);color:var(--teal-deep);border-left:3px solid var(--teal)}
.blk.b-gold{background:#fbeccb;color:#9a6a1e;border-left:3px solid #d9a441}
.blk.b-blush{background:#f7e0d8;color:#9a4b3b;border-left:3px solid #d98a6f}
.blk.b-slate{background:#e4e9ef;color:#4a5b6b;border-left:3px solid #8499ab}
.blk.maint{background:repeating-linear-gradient(45deg,#f0e3d3,#f0e3d3 6px,#e8d6bf 6px,#e8d6bf 12px);color:#9a6a1e;border-left:3px solid #c99a4a}
.lrow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.lrow:last-child{border:none}
.lrow .lt{font-family:'Fraunces',serif;font-weight:600;width:52px;flex:none}
.lrow .nm{flex:1;min-width:0}.lrow .nm b{font-weight:600}.lrow .nm span{display:block;font-size:11px;color:var(--ink-soft)}
.mini-badge{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.mb-go{background:var(--teal-soft);color:var(--teal-deep)}.mb-wait{background:var(--bg-2);color:var(--ink-soft)}.mb-late{background:#f4d3cb;color:#9a3b2c}.mb-soon{background:#fbeccb;color:#9a6a1e}
.prof-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.prof-row:last-child{border:none}
.prof-row span:first-child{color:var(--ink-soft)}
.field label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:5px}
.field{margin-bottom:14px}
.field input,.field select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;outline:none;background:#fff;box-sizing:border-box}
</style></head>
<body><div class="app"><aside class="sidebar"></aside><main class="main" id="main"></main></div>
<script src="../assets/app.js"></script>
<script>
renderLayout('booking');
const back=`<a class="btn btn-ghost" href="booking.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Calendar CN</a>`;
document.getElementById('main').innerHTML = topbar('Lịch & Booking','Tạo booking mới',{who:'BK',branch:'CN Quận 1',right:back}) + `
  <div class="row r-2">
    <div class="panel"><div class="panel-h"><div class="panel-title">Form đặt lịch chi tiết<small>Liên kết hồ sơ khách · kiểm tra nhân sự, máy, phòng</small></div></div>
      <div class="field"><label>Khách hàng</label>
        <div style="display:flex;gap:8px"><input value="Trần Thu Hà · C-1042" style="flex:1" readonly><a class="btn btn-ghost" href="customer-detail.html?id=C-1042" style="padding:9px 13px">Hồ sơ</a></div>
        <div style="font-size:11.5px;color:var(--rose);margin-top:5px">⚠ Dị ứng Lidocaine · không thích KTV nam · đã có gói triệt lông</div>
      </div>
      <div class="field"><label>Dịch vụ</label><select><option>Giảm béo RF bụng (máy RF · cần KTV RF Senior)</option><option>Triệt lông Diode (máy Laser Diode XL)</option><option>Chăm sóc da phục hồi</option></select></div>
      <div class="row r-2e" style="margin:0 0 14px"><div class="field" style="margin:0"><label>Ngày</label><input type="text" value="12/06/2026"></div><div class="field" style="margin:0"><label>Khung giờ (còn trống)</label><select><option>11:00 ✓ trống</option><option>15:00 ✓ trống</option><option>10:00 ⚠ quá tải</option></select></div></div>
      <div class="row r-2e" style="margin:0 0 14px"><div class="field" style="margin:0"><label>Phòng / Máy</label><select><option>Slim 1 · Máy RF (trống)</option><option>Laser 2 · Laser Diode XL</option></select></div><div class="field" style="margin:0"><label>KTV / ĐD</label><select><option>Hồng Trang (RF Senior · rảnh)</option><option>Thanh Mai (LASER)</option></select></div></div>
      <div class="field"><label>Ghi chú đặt lịch</label><input placeholder="VD: khách muốn phòng yên tĩnh, đến sớm 10 phút…"></div>
      <div style="display:flex;gap:9px"><button class="btn btn-teal" style="flex:1;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg>Xác nhận đặt lịch</button><button class="btn btn-ghost" onclick="location.href='booking.html'">Hủy</button></div>
    </div>
    <div class="panel"><div class="panel-h"><div class="panel-title">Kiểm tra khả dụng<small>tự đối chiếu khung giờ · nhân sự · máy trước khi xác nhận</small></div></div>
      <div class="prof-row"><span>Khung 11:00</span><span class="badge ok">Còn trống</span></div>
      <div class="prof-row"><span>KTV Hồng Trang (RF Senior)</span><span class="badge ok">Rảnh</span></div>
      <div class="prof-row"><span>Máy RF · EQ-RF-02</span><span class="badge ok">Sẵn sàng</span></div>
      <div class="prof-row"><span>Phòng Slim 1</span><span class="badge ok">Trống</span></div>
      <div class="prof-row"><span>Đối chiếu chống chỉ định</span><span class="badge busy">Cần xác nhận</span></div>
      <div class="alert al-info" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div>Hệ thống tự kiểm tra <b>khung giờ trống · nhân sự rảnh · máy sẵn sàng</b> và đối chiếu chống chỉ định với hồ sơ khách trước khi xác nhận.</div></div>
    </div>
  </div>`;
</script>
</body></html>
